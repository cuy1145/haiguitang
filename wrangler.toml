#:schema node_modules/wrangler/config-schema.json
# ============================================================================
# Cloudflare Workers 部署配置（生产运行时）
#
# ⚠️ 方案修订（《产出/阶段6》+《haiguitang/docs/CF-WITHOUT-DO.md》）
#   你的账号上 Durable Objects 需要付费、当前不可用，因此改为：
#     · 状态存储：**D1**（云端 SQLite，免费额度 5GB / 500 万行读/天 / 10 万行写/天）
#     · 定时器：**惰性推进**（每个请求先补算过期事件）+ Cron 做生命周期清理
#     · 广播：**客户端增量轮询**（rooms/events?since=seq），协议语义不变（seq + 增量 + 快照）
#     · 并发：**乐观锁 CAS**（UPDATE ... WHERE state_version = ?）+ 唯一索引
#   规则与编排（@ht/core、packages/server 的 rooms.ts / ai.ts）**逐字复用**，没有第二套实现。
# ============================================================================
name = "haiguitang"
main = "packages/worker/src/index.ts"
compatibility_date = "2025-08-01"
workers_dev = true

# 前端静态资源（正式 React 客户端的构建产物也输出到这里）
[assets]
directory = "packages/web/public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 打包器别名：pnpm workspace 的软链（node_modules/@ht/core → packages/core）
# esbuild 不跟随这种软链，必须显式指向源码入口。规则域仍然只有一份实现。
[alias]
"@ht/core" = "./packages/core/src/index.ts"

# 状态存储：单个 D1 数据库，所有房间共用（room_id 作为分区键）
[[d1_databases]]
binding = "DB"
database_name = "haiguitang"
database_id = "201c8906-63dd-4b55-9678-0f568c76fb57"
migrations_dir = "packages/worker/migrations"

# 生命周期清理（免费计划可用，最小粒度 1 分钟）。
# 注意：Cron **不承担对局计时**——对局计时由"惰性推进"完成（见 docs/CF-WITHOUT-DO.md §2.1），
# Cron 只负责清理长时间无人访问的房间与过期密钥。
[triggers]
crons = ["17 * * * *"]

[vars]
AI_PROVIDER = "openai-compatible"
DEV_TOOLS = "0"
SITE_MONTHLY_CALL_CAP = "2000"
SITE_GRANT_BUDGET_CALLS = "200"
SITE_GRANT_MAX_PER_MATCH = "2"
SITE_GRANT_COOLDOWN_SEC = "600"
# 长轮询等待上限（毫秒，0=关闭）；开着可以把别人动作的传播延迟压到 1 秒内，代价是占用请求配额
POLL_WAIT_MS = "0"
# MASTER_KEY / AI_KEY / AI_BASE_URL / AI_MODEL 通过 secret 或 [env.production.vars] 提供：
#   npx wrangler secret put MASTER_KEY
#   npx wrangler secret put AI_KEY

# 本地开发：`wrangler dev` 读取 .dev.vars（已被 .gitignore 排除）
