<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>AI 海龟汤</title>
<!--
  M1 本地服务器版前端（阶段性实现：零依赖、直接吃同一份 @ht/core 语义）。
  正式客户端将按《阶段1》§3.1 换成 React + Vite，并把 packages/web 作为构建产物目录；
  当前这一版是"能真正联机试玩"的最小实现，用来验证服务端行为与交互节奏。
  安全前提：本页面**永远不接触 API Key 明文**——房主提交的 Key 只在服务端加密存储，
  页面拿到的只有掩码；所有判定与汤底都在服务端。
-->
<style>
  /* ==========================================================================
   * 深夜档案桌 · 设计令牌（docs/前端设计方案.md §2.3 / §2.4 / §2.5）
   * 禁区：蓝紫霓虹渐变、玻璃拟态（背景模糊）、发光、悬浮阴影、emoji 图标。
   * 层级靠"三种纸 + 三种标签 + 描边"建立，不靠阴影和圆角。
   * ========================================================================*/
  :root{
    /* 桌面与结构 */
    --desk-950:#0b1012; --desk-900:#11191b; --desk-800:#182225; --desk-700:#223034;
    --rule-dark:#344347; --rule-soft:#26332f;
    /* 案卷纸 */
    --paper-100:#eee9dc; --paper-200:#ded7c7; --paper-300:#c8bfad;
    --ink-900:#202526; --ink-600:#596264;
    /* 功能色 */
    --brass:#b99255; --brass-light:#d4b477;
    --stamp-yes:#287b68; --stamp-no:#a64e45; --stamp-partial:#8a6a2f; --stamp-unknown:#a5742f; --stamp-irrelevant:#647176;
    --signal:#83a69e; --danger:#bd554b;
    /* 文本 */
    --text-on-dark:#e9e5da; --text-secondary:#aeb8b6; --text-muted:#75817f;
    /* 交互 */
    --focus:#d4b477; --selection:rgba(185,146,85,.28);
    /* 便笺（讨论区） */
    --note-other:#2b3a37; --note-other-ink:#e4e7e2; --note-mine:#4a3c25; --note-mine-ink:#f3e9d6;
    /* 字体 */
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    --font-mono:"Cascadia Mono","SFMono-Regular",Consolas,monospace;
    --font-story:"Songti SC",SimSun,serif;
    /* 形状 */
    --r-xs:2px; --r-sm:4px; --r-md:6px;
    --shadow-paper:0 2px 0 rgba(0,0,0,.35);
    --shadow-modal:0 10px 26px -18px rgba(0,0,0,.9);
  }

  /* ==========================================================================
   * 基础与桌面背景（§2.6）
   * ========================================================================*/
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background-color:var(--desk-950);
    background-image:
      linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.008) 1px,transparent 1px);
    background-size:24px 24px;
    color:var(--text-on-dark);
    font:14px/1.6 var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--selection)}
  a{color:var(--brass-light)}
  h1,h2,h3,h4{margin:0 0 10px;font-weight:700;letter-spacing:.01em}
  h3{font-size:13px}
  p{margin:0 0 10px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
  th{color:var(--text-muted);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  /* 焦点可见（§23）：黄铜细线 + 2px 外线，不做发光 */
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .wrap{max-width:1440px;margin:0 auto;padding:0 18px 40px}

  /* 眉题（§2.4：11px / 700 / 字距 .16em） */
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--text-muted);text-transform:uppercase}
  .eyebrow b{color:var(--brass);font-weight:700}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .dim{color:var(--text-muted);font-size:12px}
  .grow{flex:1 1 auto;min-width:0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .hr{height:1px;background:var(--rule-dark);margin:12px 0;border:0}

  /* ==========================================================================
   * 顶栏：档案柜索引条（§2.7）
   * ========================================================================*/
  .topbar{
    position:sticky;top:0;z-index:40;height:58px;display:flex;align-items:center;gap:14px;
    background:var(--desk-900);border-bottom:1px solid var(--brass);
    padding:0 18px;margin:0 -18px 18px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:30px;height:30px;flex:0 0 auto;color:var(--brass);display:grid;place-items:center}
  .logo svg{width:26px;height:26px;display:block}
  .brand .name{font-size:15px;font-weight:700;letter-spacing:.06em;line-height:1.2}
  .brand .sub{font-size:10.5px;color:var(--text-muted);letter-spacing:.08em}
  .topchips{display:flex;align-items:center;gap:10px;margin-left:auto}
  .chip{
    display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;
    border:1px solid var(--rule-dark);border-radius:var(--r-xs);background:var(--desk-800);
    color:var(--text-secondary);font-size:11.5px;white-space:nowrap;
  }
  .chip.clickable{cursor:pointer}
  .chip.clickable:hover{border-color:var(--brass);color:var(--text-on-dark)}
  /* 连接信号灯：6px 实心点 + 短文字（不做发光圆点） */
  .lamp{width:6px;height:6px;border-radius:0;background:var(--signal);flex:0 0 auto}
  .lamp.off{background:var(--danger)}
  .lamp.warn{background:var(--stamp-unknown)}

  /* ==========================================================================
   * 三栏骨架（§5.1 / §22）
   * ========================================================================*/
  .grid{display:grid;grid-template-columns:280px minmax(0,1fr) 320px;gap:16px;align-items:start}
  .col-side,.col-main{min-width:0;display:flex;flex-direction:column;gap:14px}
  .col-rail{min-width:0;display:flex;flex-direction:column;gap:14px;position:sticky;top:74px}
  @media(max-width:1199px){
    .grid{grid-template-columns:280px minmax(0,1fr)}
    .col-rail{grid-column:1 / -1;position:static}
  }

  /* ==========================================================================
   * 深色面板（普通面板：1px 描边，无阴影、无模糊）
   * ========================================================================*/
  .card,.panel{
    background:var(--desk-900);border:1px solid var(--rule-dark);border-radius:var(--r-sm);
    padding:14px;position:relative;
  }
  .card>h3,.panel>h3{
    font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--text-muted);text-transform:uppercase;
    margin:0 0 10px;
  }
  /* 面板标题带编号短线（§2.5） */
  .card.hd,.panel.hd{padding-top:12px}
  .card.hd::before,.panel.hd::before{content:'';position:absolute;left:14px;right:14px;top:0;height:2px;background:var(--brass);opacity:.5}

  /* 键值行 */
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
  .kv .k{color:var(--text-muted);white-space:nowrap}
  .k{color:var(--text-muted)}.v{color:var(--text-on-dark)}
  .field{margin-bottom:12px}
  .field>label{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:6px;letter-spacing:.04em}

  /* ==========================================================================
   * 控件：按钮（§2.26）
   * ========================================================================*/
  button{
    font:inherit;font-size:12.5px;color:var(--text-on-dark);background:transparent;
    border:1px solid var(--rule-dark);border-radius:var(--r-sm);
    padding:8px 12px;min-height:36px;cursor:pointer;transition:background .14s ease,border-color .14s ease,transform .06s ease;
  }
  button:hover{border-color:var(--brass);background:rgba(185,146,85,.06)}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--brass);border-color:var(--brass);color:#1b1408;font-weight:700}
  button.primary:hover{background:var(--brass-light);border-color:var(--brass-light)}
  button.ghost{background:transparent;border-color:var(--rule-dark);color:var(--text-secondary)}
  button.note{background:#3c3220;border-color:#5c4a2a;color:var(--note-mine-ink)}
  button.note:hover{background:#473a25;border-color:var(--brass)}
  button.reason{background:transparent;border-color:var(--stamp-no);color:#e0a49c}
  button.reason:hover{background:rgba(166,78,69,.14)}
  button.danger{background:transparent;border-color:transparent;color:#d98a80;padding-left:6px;padding-right:6px}
  button.danger:hover{background:rgba(189,85,75,.12);border-color:var(--danger)}
  button.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}
  button:disabled,button[disabled]{
    color:var(--text-muted);border-color:var(--rule-soft);background:transparent;cursor:not-allowed;
  }
  button.primary:disabled,button.primary[disabled]{background:#2c2a20;border-color:#463f2c;color:#8a8272}
  button.icon{min-width:36px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  button svg{width:16px;height:16px;flex:0 0 auto}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  /* 输入框：深色平面 + 单条底边（§2.26） */
  input[type=text],input[type=number],input:not([type]),textarea,select{
    width:100%;background:var(--desk-800);color:var(--text-on-dark);
    border:1px solid var(--rule-dark);border-bottom:2px solid var(--rule-dark);
    border-radius:var(--r-xs);padding:9px 10px;font:inherit;font-size:13.5px;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-bottom-color:var(--brass)}
  input::placeholder,textarea::placeholder{color:#5d6866}
  textarea{min-height:76px;resize:vertical;line-height:1.7}
  select{font-family:var(--font-mono);font-size:12.5px}
  input.err,textarea.err,select.err{border-bottom-color:var(--stamp-no)}

  /* ==========================================================================
   * 标签与印章（§2.26：三类不能共用一种样式）
   * ========================================================================*/
  /* 身份纸签：窄矩形、浅底深字 */
  .slip{
    display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:var(--r-xs);
    background:var(--paper-200);color:var(--ink-900);font-size:10.5px;font-weight:700;letter-spacing:.04em;
  }
  .slip.dim{background:#3a4442;color:var(--text-secondary)}
  .slip.brass{background:var(--brass);color:#1b1408}
  /* 状态印章：方角描边 */
  .seal{
    display:inline-flex;align-items:center;padding:1px 7px;border:1px solid currentColor;border-radius:var(--r-xs);
    font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--text-secondary);
  }
  .seal.yes{color:var(--stamp-yes)}.seal.no{color:var(--stamp-no)}
  .seal.partial{color:var(--stamp-partial)}
  .seal.unknown{color:var(--stamp-unknown)}.seal.irrelevant{color:var(--stamp-irrelevant)}
  .seal.brass{color:var(--brass)}
  /* 属性文本：短竖线分隔，不加容器 */
  .attrs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--text-secondary);font-size:11.5px;letter-spacing:.03em}
  .attrs>span{display:inline-flex;align-items:center;gap:5px}
  .attrs>span+span::before{content:'';width:1px;height:11px;background:var(--rule-dark);margin-right:3px}
  .attrs .mono{color:var(--text-on-dark)}
  .attrs .warn{color:var(--stamp-unknown)}
  .attrs .sensitive{color:#d98a80;border:1px solid rgba(217,138,128,.5);border-radius:var(--r-xs);padding:0 5px}
  /* 旧的 pill 名字保留（老组件还在用），但改成"纸签"样式而不是胶囊 */
  .pill{
    display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:var(--r-xs);
    border:1px solid var(--rule-dark);color:var(--text-secondary);font-size:10.5px;letter-spacing:.03em;background:var(--desk-800);
  }
  .pill.accent{border-color:var(--brass);color:var(--brass-light)}
  .pill.live{border-color:var(--brass);color:var(--brass-light)}
  .pill.l2{border-color:var(--stamp-unknown);color:var(--stamp-unknown)}
  .pill.l3{border-color:var(--danger);color:#d98a80}
  .pill.jump{cursor:pointer;background:transparent}
  .badge{
    display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:999px;
    background:var(--brass);color:#1b1408;font:700 10.5px/16px var(--font-mono);text-align:center;
  }

  /* 提示 / 错误 / 通知 */
  .notice,.err{
    border:1px solid var(--rule-dark);border-left:3px solid var(--signal);
    background:var(--desk-800);border-radius:var(--r-xs);padding:9px 11px;font-size:12.5px;color:var(--text-secondary);
  }
  .err{border-left-color:var(--danger);color:#e6b3ac}
  .notice.warn{border-left-color:var(--stamp-unknown)}

  /* ==========================================================================
   * 当前回合：机械计时牌（§2.9）
   * ========================================================================*/
  .speakerbox{
    background:var(--desk-900);border:1px solid var(--rule-dark);border-radius:var(--r-sm);
    padding:14px;display:grid;gap:12px;position:relative;
  }
  .speakerbox.head::before{content:'';position:absolute;left:14px;right:14px;top:0;height:2px;background:var(--brass);opacity:.45}
  /* 轮到自己：左边缘黄铜标尺 */
  .speakerbox.myturn{border-left:3px solid var(--brass)}
  .speakerbox .top{display:flex;align-items:flex-start;gap:10px}
  .avatar{
    width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border-radius:var(--r-xs);
    background:var(--desk-700);color:var(--paper-100);font-weight:700;font-size:14px;border:1px solid var(--rule-dark);
  }
  .avatar.me{border-color:var(--brass);color:var(--brass-light)}
  .who{font-size:10.5px;color:var(--text-muted);font-family:var(--font-mono)}
  .nm{font-size:15px;font-weight:700;line-height:1.3}
  .timer{
    font-family:var(--font-mono);font-size:32px;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  .timer.warn{color:var(--stamp-unknown)}
  .timer.danger{color:var(--stamp-no)}
  /* 刻度条：一排细刻度，从右向左熄灭（§2.9） */
  .ticks{display:flex;gap:2px;height:12px;align-items:stretch}
  .ticks i{flex:1 1 0;background:var(--desk-700);border-radius:1px}
  .ticks i.on{background:var(--brass)}
  .ticks.danger i.on{background:var(--stamp-no)}
  .bar{display:none}
  /* 旧类名映射（老渲染器还在用 .meter/.timer/.dots 等） */
  .meter{height:10px;display:flex;gap:2px}
  .meter span{background:var(--desk-700);flex:1 1 0}
  .meter span.on{background:var(--brass)}
  .meta{font-size:11.5px;color:var(--text-muted)}
  .dots{display:flex;gap:3px;align-items:center}
  .dots i,.dot{width:6px;height:6px;background:var(--desk-700);border-radius:1px;display:inline-block}
  .dots i.on,.dot.on{background:var(--brass-light)}
  .dot.live{background:var(--signal)}
  .dot.away{background:var(--stamp-unknown)}
  .dot.off{background:transparent;border:1px solid var(--rule-dark)}

  /* ==========================================================================
   * 汤面：全页唯一的大纸张（§2.10）
   * ========================================================================*/
  .puzzle-card,.puzzler,.sheet{
    background:var(--paper-100);color:var(--ink-900);border:1px solid var(--paper-300);
    border-radius:var(--r-xs);padding:20px 22px 18px;box-shadow:var(--shadow-paper);
  }
  .puzzle-card h3,.sheet h3{color:var(--ink-600);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .puzzle-card .ptitle{
    font-family:var(--font-story);font-size:24px;line-height:1.35;font-weight:700;color:var(--ink-900);
    margin:6px 0 4px;padding-bottom:8px;border-bottom:1px solid rgba(32,37,38,.22);
  }
  .puzzle-card .surface{
    font-family:var(--font-story);font-size:17px;line-height:1.95;color:var(--ink-900);
    max-width:42em;white-space:pre-wrap;margin:12px 0 0;
  }
  .puzzle-card .puz-src{margin-top:14px;font-size:11px;color:var(--ink-600)}
  .puzzle-card .attrs{color:var(--ink-600)}
  .puzzle-card .attrs>span+span::before{background:rgba(32,37,38,.25)}
  .puzzle-card .attrs .mono{color:var(--ink-900)}
  .puzzle-card .seal{color:var(--ink-600)}
  .puzzle-card .seal.yes{color:var(--stamp-yes)}
  .puzzle-card .seal.no{color:var(--stamp-no)}
  .puzzle-card .actions button{border-color:rgba(32,37,38,.3);color:var(--ink-900);background:rgba(255,255,255,.35)}
  .puzzle-card .actions button:hover{border-color:var(--brass);background:rgba(185,146,85,.16)}
  .puzzle-card .actions button.primary{background:var(--brass);color:#1b1408;border-color:var(--brass)}
  /* 案卷工具条：提示 / 猜汤底放在纸张下方的深色条上（§2.10） */
  .toolbar{
    background:var(--desk-900);border:1px solid var(--rule-dark);border-radius:var(--r-sm);
    padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .hintbtn{
    display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:64px;min-height:44px;
    padding:5px 10px;border-radius:var(--r-xs);border:1px solid var(--rule-dark);background:var(--desk-800);
  }
  .hintbtn .t{font-family:var(--font-mono);font-size:12px;font-weight:700}
  .hintbtn .c{font-size:10px;color:var(--text-muted)}
  .hintbtn.t1{border-color:#3d5147}.hintbtn.t2{border-color:#5c4a2a}.hintbtn.t3{border-color:#5a3630}
  .hintbtn.t1 .t{color:var(--signal)}.hintbtn.t2 .t{color:var(--brass-light)}.hintbtn.t3 .t{color:#d98a80}
  .guessquick{border-color:var(--stamp-no);color:#e0a49c}

  /* 统计索引尺（§2.11）：一条细线串联四组数据 */
  .stats{
    display:flex;align-items:stretch;gap:0;background:transparent;border:0;border-top:1px solid var(--rule-dark);
    border-bottom:1px solid var(--rule-dark);padding:8px 0;
  }
  .stat{flex:1 1 0;min-width:0;padding:0 12px;border-left:1px solid var(--rule-soft);display:grid;gap:2px}
  .stat:first-child{border-left:0;padding-left:0}
  .stat .n{font-family:var(--font-mono);font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:11px;color:var(--text-muted);letter-spacing:.06em}
  .stat .meter{margin-top:4px}

  /* AI / 额度：设备铭牌（§2.18） */
  .engine,.creditcard,.roomcard{
    background:var(--desk-800);border:1px solid var(--rule-dark);border-radius:var(--r-xs);padding:12px;
  }
  .engine .lamp,.creditcard .lamp{width:8px;height:8px}
  .mask{font-family:var(--font-mono);background:var(--desk-950);border:1px solid var(--rule-dark);border-radius:var(--r-xs);padding:3px 8px;font-size:12px}

  /* ==========================================================================
   * 正式记录：审讯记录册（§2.12）
   * ========================================================================*/
  .records{background:var(--desk-900);border:1px solid var(--rule-dark);border-radius:var(--r-sm);padding:14px}
  .log{display:flex;flex-direction:column;gap:0;max-height:46vh;overflow:auto;padding-right:4px}
  .log .tl{
    display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rule-soft);
    background:transparent;border-radius:0;flex-wrap:wrap;
  }
  .log .tl .q{font-size:15px;line-height:1.7;font-weight:500;color:var(--text-on-dark);flex:1 1 100%}
  .log .tl .head{display:flex;gap:8px;align-items:center;width:100%;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
  .log .tl.mine{border-left:3px solid var(--brass);padding-left:10px}
  .log .tl .who-line{display:flex;align-items:center;gap:6px}
  /* 答案印章：略旋转的方角章，文字始终水平 */
  .verdict{
    display:inline-flex;align-items:center;justify-content:center;min-width:56px;padding:3px 8px;
    border:2px solid currentColor;border-radius:var(--r-xs);font-weight:700;font-size:12px;letter-spacing:.08em;
    transform:rotate(-1.6deg);
  }
  .verdict.yes{color:var(--stamp-yes)}.verdict.no{color:var(--stamp-no)}
  .verdict.partial{color:var(--stamp-partial)}
  .verdict.unknown{color:var(--stamp-unknown)}.verdict.irrelevant{color:var(--stamp-irrelevant)}
  /* 铅笔批注：灰字 + 左侧短线 */
  .explain{border-left:2px solid var(--rule-dark);padding-left:8px;color:var(--text-muted);font-size:12px;margin-top:4px;flex:1 1 100%}
  /* 系统事件：细分隔线 + 居中文字 */
  .tl.sys{
    justify-content:center;text-align:center;border-bottom:0;color:var(--text-muted);font-size:11.5px;
  }
  .tl.sys::before,.tl.sys::after{content:'';flex:1 1 auto;height:1px;background:var(--rule-soft)}
  .tl.err{border-left:3px solid var(--danger);padding-left:10px;color:#e0a49c}
  .tl.vote{border-left:3px solid var(--brass);padding-left:10px}
  .tl .meta{margin-left:auto}
  .log .empty{color:var(--text-muted);font-size:12.5px;padding:18px 4px;text-align:center;border:1px dashed var(--rule-dark);border-radius:var(--r-xs)}

  /* ==========================================================================
   * 全员讨论：便笺栏（§2.13）
   * ========================================================================*/
  .chatcard{background:var(--desk-900);border:1px solid var(--rule-dark);border-radius:var(--r-sm);padding:14px}
  .chat{display:flex;flex-direction:column;gap:7px;max-height:38vh;overflow:auto;padding-right:4px}
  .chat .msg{
    max-width:88%;padding:7px 10px;border-radius:var(--r-sm);
    background:var(--note-other);color:var(--note-other-ink);border:1px solid #354744;
  }
  .chat .msg.mine{align-self:flex-end;background:var(--note-mine);color:var(--note-mine-ink);border-color:#5c4a2a}
  .chat .msg .who{font:11px/1.4 var(--font-mono);color:var(--text-muted);margin-bottom:2px}
  .chat .msg .txt{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .chat .chatsep{display:flex;align-items:center;gap:8px;margin:3px 0;color:var(--text-muted);font:11px/1 var(--font-mono);white-space:nowrap}
  .chat .chatsep::before,.chat .chatsep::after{content:'';flex:1 1 auto;height:1px;background:var(--rule-soft)}
  .chatcard .row input{flex:1 1 auto;min-width:0}
  .chatcard .counter{font:11px/1 var(--font-mono);color:var(--text-muted);white-space:nowrap;align-self:center}
  .chat-hint{font-size:11.5px}

  /* 页签：文字 + 底部短线（§2.26） */
  .tabs{display:flex;gap:14px;border-bottom:1px solid var(--rule-dark);margin-bottom:12px}
  .tab{
    background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:7px 2px;min-height:40px;
    color:var(--text-muted);font-size:12.5px;letter-spacing:.04em;position:relative;
  }
  .tab:hover{background:transparent;color:var(--text-on-dark)}
  .tab.on{color:var(--text-on-dark);border-bottom-color:var(--brass);background:transparent}
  .tab .badge{position:absolute;top:2px;right:-10px;margin:0}

  /* ==========================================================================
   * 玩家名册（§2.14）
   * ========================================================================*/
  .memlist{background:var(--desk-900);border:1px solid var(--rule-dark);border-radius:var(--r-sm);padding:8px 12px 10px}
  .playercard{
    display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 0;border-bottom:1px solid var(--rule-soft);
    background:transparent;border-radius:0;position:relative;
  }
  .playercard:last-child{border-bottom:0}
  .playercard.speaking{border-left:3px solid var(--brass);padding-left:9px;margin-left:-12px;padding-right:0}
  .playercard .nm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .playercard .meta{font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
  .playercard .avatar{position:relative;width:30px;height:30px;font-size:13px}
  .playercard .avatar .dot{position:absolute;right:-2px;bottom:-2px;border:1px solid var(--desk-900)}
  .playercard .kick{margin-left:auto}
  .playercard.away .nm{color:var(--text-secondary)}
  .playercard.off .nm{color:var(--text-muted)}
  .playercard.eligible{background:transparent}

  /* ==========================================================================
   * 底部书写板：正式提问（§2.15）
   * ========================================================================*/
  .composer{
    background:var(--desk-900);border:1px solid var(--rule-dark);border-top:2px solid var(--brass);
    border-radius:var(--r-sm);padding:14px;
  }
  .composer.grace{border-top-color:var(--stamp-unknown)}
  .composer textarea{min-height:64px}
  .composer .askrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .composer .askrow .primary{min-width:120px}
  .composer .hintbar{margin-top:10px}
  @media(max-width:900px){
    .composer.sticky{
      position:sticky;bottom:0;z-index:30;margin:0 -14px -10px;border-radius:0;border-left:0;border-right:0;
      padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    }
  }

  /* 等待与候选（§7.3 / §2.22） */
  .waitcard,.candcard,.aicard,.bannerbox,.settled,.truthcard,.pendingcard{
    background:var(--desk-900);border:1px solid var(--rule-dark);border-radius:var(--r-sm);padding:14px;
  }
  .cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-top:10px;align-items:stretch}
  .cand{
    background:var(--paper-200);color:var(--ink-900);border:1px solid var(--paper-300);border-radius:var(--r-xs);
    padding:12px;display:flex;flex-direction:column;gap:8px;position:relative;height:100%;
  }
  /* 正文自适应但卡片等高、底部的「选这道」对齐在底部（用户要求水平和垂直都对齐） */
  .cand .cbody{font-family:var(--font-story);font-size:14.5px;line-height:1.7;flex:1 1 auto;overflow:hidden}
  .cand .row:last-of-type{margin-top:auto}
  .cand .row{gap:6px}
  .cand .pill{border-color:rgba(32,37,38,.28);background:rgba(255,255,255,.4);color:var(--ink-600)}
  .cand .pill.l3{border-color:var(--stamp-no);color:var(--stamp-no)}
  .cand .seal{color:var(--ink-600)}
  .cand button.primary{align-self:flex-start}
  .cand.on::after{
    content:'选中';position:absolute;top:8px;right:8px;padding:1px 6px;border:2px solid var(--brass);
    color:var(--brass);font-size:10.5px;font-weight:700;letter-spacing:.08em;transform:rotate(-2deg);border-radius:var(--r-xs);
  }

  /* 入口页（§2.8 / §4） */
  .entry{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:22px;align-items:start;padding-top:8px}
  .entry .hero{
    background:var(--paper-100);color:var(--ink-900);border:1px solid var(--paper-300);border-radius:var(--r-xs);
    padding:26px 24px 22px;box-shadow:var(--shadow-paper);position:relative;
  }
  .entry .hero h1{font-family:var(--font-story);font-size:30px;line-height:1.25;margin-bottom:10px}
  .entry .hero p{font-size:14.5px;line-height:1.9;color:#333a3b;max-width:34em}
  .entry .hero ol{margin:12px 0 0;padding-left:20px;font-size:13.5px;line-height:1.9;color:#333a3b}
  .entry .hero .secret{
    margin-top:18px;padding-top:12px;border-top:1px solid rgba(32,37,38,.2);
    font-size:11.5px;letter-spacing:.14em;color:var(--stamp-no);font-weight:700;
  }
  .entry .hero .stampmark{position:absolute;top:16px;right:18px;color:var(--brass);opacity:.9}
  .entry .hero .stampmark svg{width:34px;height:34px}
  .entry .form{background:var(--desk-900);border:1px solid var(--rule-dark);border-radius:var(--r-sm);padding:18px}
  .modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .mode{
    background:var(--desk-800);border:1px solid var(--rule-dark);border-radius:var(--r-xs);padding:10px 9px;cursor:pointer;
    position:relative;min-height:76px;
  }
  .mode:hover{border-color:var(--brass)}
  .mode .idx{font:700 10.5px/1 var(--font-mono);color:var(--text-muted);letter-spacing:.1em}
  .mode .t{font-size:13.5px;font-weight:700;margin:6px 0 3px}
  .mode .d{font-size:11px;color:var(--text-muted);line-height:1.5}
  .mode.on{border-color:var(--brass);background:#1d1c16}
  .mode.on::after{content:'';position:absolute;top:8px;right:8px;width:14px;height:14px;border:2px solid var(--brass);border-radius:2px}
  @media(max-width:900px){.entry{grid-template-columns:minmax(0,1fr)}}

  /* 轮到你（§10.1） */
  .your-turn{
    background:var(--desk-800);border:1px solid var(--brass);border-left:3px solid var(--brass);
    border-radius:var(--r-xs);padding:10px 12px;font-size:13px;color:var(--paper-100);
  }
  .topmsg{display:grid;gap:8px}

  /* ==========================================================================
   * 弹窗与抽屉（§2.26）
   * ========================================================================*/
  .overlay{
    position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.68);
    display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;
  }
  .modal{
    width:100%;max-width:720px;background:var(--desk-900);border:1px solid var(--rule-dark);border-radius:var(--r-md);
    box-shadow:var(--shadow-modal);padding:18px 18px 16px;position:relative;
  }
  .modal::before{content:'';position:absolute;left:18px;right:18px;top:0;height:2px;background:var(--brass);opacity:.6}
  .modal h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
  .modal .fieldrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule-soft)}
  .modal .fieldrow .lab{font-size:12.5px;color:var(--text-secondary)}
  .modal .fieldrow .hint{grid-column:2;font-size:11px;color:var(--text-muted);margin-top:-4px}
  .modal .foot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--rule-dark)}
  .modal .papernote{background:var(--paper-100);color:var(--ink-900);border-radius:var(--r-xs);padding:12px;border:1px solid var(--paper-300)}
  .modal .papernote textarea{background:transparent;border:0;border-bottom:1px dashed rgba(32,37,38,.35);color:var(--ink-900);font-family:var(--font-story)}
  .modal table td{font-size:12.5px}
  .truthcard{background:var(--paper-100);color:var(--ink-900);border-color:var(--paper-300)}
  .truthcard h3{color:var(--ink-600)}
  .truthcard .surface{font-family:var(--font-story);font-size:16.5px;line-height:1.9;white-space:pre-wrap}
  @media(max-width:560px){.overlay{padding:0}.modal{max-width:none;min-height:100vh;border-radius:0}}

  /* ==========================================================================
   * 短提示：窄收据（§2.23）
   * ========================================================================*/
  .toasts{position:fixed;top:70px;right:18px;z-index:70;display:grid;gap:8px;width:300px;max-width:calc(100vw - 36px)}
  .toast{
    background:var(--desk-900);border:1px solid var(--rule-dark);border-left:3px solid var(--signal);
    border-radius:var(--r-xs);padding:9px 11px;font-size:12.5px;color:var(--text-secondary);
  }
  .toast.warn{border-left-color:var(--stamp-unknown)}
  .toast.err{border-left-color:var(--danger);color:#e6b3ac}

  /* ==========================================================================
   * 移动端：逐张翻阅档案（§6 / §22）
   * ========================================================================*/
  @media(max-width:900px){
    .wrap{padding:0 14px 26px}
    .topbar{margin:0 -14px 14px;height:52px;gap:10px;padding:0 14px}
    .brand .sub{display:none}
    .grid{grid-template-columns:minmax(0,1fr);gap:12px}
    .col-side,.col-main,.col-rail{display:contents}
    /* 单列顺序：状态 → 汤面 → 输入(吸附) → 记录 → 讨论 → 名册 → 其他 */
    .speakerbox{order:10}
    .puzzle-card,.puzzler,.sheet{order:20}
    .toolbar{order:22}
    .stats{order:24}
    .engine{order:26}
    .your-turn{order:15}
    .topmsg{order:8}
    .pendingcard{order:16}
    .candcard,.waitcard,.aicard{order:30}
    /* 窄屏（§6 玩法顺序）：状态 → 汤面/工具 → 记录 → **讨论** → 提问(吸底) → 名册/房间/额度 */
    .records{order:38}
    /* 讨论就在公共记录底下（用户要求）：整块「页签 + 便笺」紧跟在记录之后 */
    .col-rail>.card{order:40}
    .composer{order:42}
    .bannerbox{order:60}
    .settled,.truthcard{order:70}
    .roomcard{order:82}
    .memlist{order:84}
    .creditcard{order:86}
    .playercard{display:flex}
    .puzzle-card .ptitle{font-size:21px}
    .puzzle-card .surface{font-size:16px;line-height:1.9}
    .stat{padding:0 9px}
    .stat .n{font-size:17px}
    /* 触控目标 44px（§23） */
    button,.tab,.hintbtn,.chip.clickable{min-height:44px}
    /* 窄屏：讨论内联在流程里（不再做全屏面板），发送按钮就在便笺栏内部 */
    .chat{max-height:none}
    .chatcard .row input{min-height:44px}
    /* 顶栏只留"已连接"，不显示技术细节 */
    .chip .tech{display:none}
    .toasts{top:60px;right:10px;left:10px;width:auto}
    .cands{grid-template-columns:minmax(0,1fr)}
  }

  /* 减少动态效果（§2.24 / §23） */
  @media(prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
    button:active{transform:none}
  }
  @keyframes note-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  @keyframes paper-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* 入场动画只加在**新出现**的那一条上（.fx 由渲染时按 seq 判断）：
     整页是 innerHTML 全量重渲染，如果动画写死在 .msg / .tl 上，每次重渲染都会重播一遍，
     点一下空白处、在记录里拖选文字都会看到"闪一下"。 */
  .chat .msg.fx{animation:note-in .14s ease-out}
  .log .tl.fx,.log .qa.fx{animation:paper-in .16s ease-out}

  /* ---------- 小转场：让切换不那么生硬 ----------
     和上面同一条纪律：动画**绝不挂在常驻节点上**，只由 JS 在"这次渲染确实是它第一次出现"
     时补一个类（.screen-in / .panel-in / .card-in / .in / .out）。否则整页重渲染会反复重播。 */
  @keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fade-slide-left{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  @keyframes fade-only{from{opacity:0}to{opacity:1}}
  @keyframes fade-out-only{from{opacity:1}to{opacity:0}}
  @keyframes curtain-in{from{opacity:0;transform:translateY(10px) scale(.994)}to{opacity:1;transform:none}}
  @keyframes curtain-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(6px) scale(.996)}}
  /* 换屏与页签用各自的动画名（同名的话测试与调试都分不清是哪一处转场） */
  @keyframes screen-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes panel-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* 换屏（入口 ⇄ 房间）：整屏轻微上浮淡入 */
  .screen-in{animation:screen-in .2s cubic-bezier(.22,.61,.36,1)}
  /* 右栏切页签、别的"整块替换" */
  .panel-in{animation:panel-in .16s ease-out}
  /* 新出现的区块：汤面、轮到你、公告条 */
  .card-in{animation:fade-up .18s ease-out}
  .your-turn.card-in{animation:fade-slide-left .18s ease-out}
  /* 弹窗：进场一次；关闭先加 .out 播完再真正移除（见 JS closeWithFx） */
  .overlay.in{animation:fade-only .12s ease-out}
  .overlay.out{animation:fade-out-only .13s ease-in forwards}
  .overlay .modal.in{animation:curtain-in .18s cubic-bezier(.22,.61,.36,1)}
  .overlay .modal.out{animation:curtain-out .13s ease-in forwards}
  /* 倒计时进度条由 tickUi 每 250ms 改 width：让它滑过去而不是一格一格跳 */
  [data-bar]{transition:width .25s linear}
  /* 机械刻度：亮/灭之间做 180ms 渐变，不是硬切 */
  .ticks i{transition:background-color .18s linear}
  /* 短收据：滑入 + 到期前淡出（pushToast 负责加 .gone） */
  .toast{animation:fade-slide-left .16s ease-out}
  .toast.gone{animation:fade-out-only .2s ease-in forwards}
  /* 交互反馈：hover 底色过渡统一，按下有 1px 回弹（原本只有个别按钮有） */
  button,.mode,.cand,.tab{transition:background-color .14s ease,border-color .14s ease,color .14s ease,transform .07s ease}
  button:active:not(:disabled),.mode:active,.cand:active,.tab:active{transform:translateY(1px)}
  /* 可点的候选卡：hover 时边框抬一点（不做位移，避免整列抖动） */
  .cand{transition:border-color .16s ease}
  .cand:hover{border-color:var(--brass)}

  /* ---------- 补充：新版结构与旧渲染器的对齐 ---------- */
  /* 问答记录：上下分区（回合/提问者/时间 → 完整问题 → 答案章），不是聊天气泡（§2.12） */
  .log .qa{display:flex;flex-direction:column;gap:6px;padding:11px 0;border-bottom:1px solid var(--rule-soft)}
  .log .qa:last-child{border-bottom:0}
  .log .qa .head{display:flex;gap:10px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
  .log .qa .head .who{color:var(--text-secondary);font-family:var(--font-ui);font-size:12px;font-weight:600}
  .log .qa .q{font-size:15px;line-height:1.7;font-weight:500;color:var(--text-on-dark)}
  .log .qa .a{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--text-secondary)}
  .log .qa.mine{border-left:3px solid var(--brass);padding-left:10px}
  .log .qa .late{color:var(--stamp-unknown);font-size:11px}
  /* 统计尺：旧渲染器用 .stat .v，新结构用 .stat .n */
  .stat .v{font-family:var(--font-mono);font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat .meter i{display:block;height:100%;background:var(--brass)}
  /* 入口页主按钮：盖章器式方角 + 字距（§2.8） */
  .entry .form button.primary{border-radius:var(--r-xs);letter-spacing:.08em;min-height:44px}
  /* 房主操作行距 */
  .roomcard .actions button{font-size:12px}
  /* 便笺栏嵌在右栏页签里时不要再套一层卡片边框 */
  .chatcard.bare{background:transparent;border:0;border-radius:0;padding:0}
  /* 名册行尾的"更多"（§2.14：移出默认藏起来） */
  details.more{margin-left:auto;position:relative}
  details.more>summary{list-style:none;cursor:pointer;color:var(--text-muted);font-size:11px;padding:4px 6px;border:1px solid transparent;border-radius:var(--r-xs)}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary:hover{color:var(--text-on-dark);border-color:var(--rule-dark)}
  details.more[open]>summary{color:var(--text-on-dark);border-color:var(--rule-dark)}
  details.more>button{position:absolute;right:0;top:calc(100% + 4px);z-index:5;white-space:nowrap;background:var(--desk-800);border-color:var(--danger)}
  /* 底部书写板整行：桌面上横跨三栏（移动端由 order 插到记录之后） */
  .composer{grid-column:1 / -1;position:sticky;bottom:0;z-index:30;box-shadow:0 -1px 0 var(--rule-dark)}
  .composer .askrow .dim{font-size:11.5px}
  /* 汤面下方的案卷工具条 */
  .toolbar{margin-top:-8px}
  .toolbar .eyebrow{margin-right:4px}

  /* ==========================================================================
   * 设备手册式弹窗（§2.19）：分组左侧窄索引 + 章节编号
   * ========================================================================*/
  .fieldgroup{border-left:2px solid var(--rule-dark);padding:2px 0 2px 12px;margin:14px 0 0}
  .fieldgroup>h4{margin:0 0 8px;font-size:11px;letter-spacing:.16em;color:var(--brass);text-transform:uppercase}
  .fieldgroup .fieldrow{border-bottom:1px dotted var(--rule-soft)}
  .fieldgroup .fieldrow:last-child{border-bottom:0}
  .modal .chapter{display:flex;align-items:baseline;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--rule-dark);margin-bottom:12px}
  .modal .chapter .no{font:700 12px/1 var(--font-mono);color:var(--brass);letter-spacing:.1em}
  .modal .chapter h3{margin:0}
  /* 开关：短拨杆（不用手机系统风格的大滑块） */
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch .track{width:34px;height:18px;border:1px solid var(--rule-dark);border-radius:2px;background:var(--desk-800);position:relative;transition:background .14s ease}
  .switch .track::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;background:var(--text-muted);transition:transform .14s ease,background .14s ease}
  .switch input:checked+.track{background:#2b2a1c;border-color:var(--brass)}
  .switch input:checked+.track::after{transform:translateX(16px);background:var(--brass-light)}
  .switch input:focus-visible+.track{outline:2px solid var(--focus);outline-offset:2px}
  .switch .lab{font-size:12.5px;color:var(--text-secondary)}
  /* 结案推理的稿纸输入（§2.17）：暖纸 + 淡横线 */
  .modal .papernote textarea{
    background-image:repeating-linear-gradient(180deg,transparent 0 27px,rgba(32,37,38,.16) 27px 28px);
    line-height:28px;min-height:140px;
  }
  .reason.solid{background:var(--stamp-no);border-color:var(--stamp-no);color:#fff;font-weight:700}
  .reason.solid:hover{background:#c05a50;border-color:#c05a50}
  /* 汤底开封（§2.20）：横向封套，封条从中间向两侧退开；总时长 800ms */
  .envelope{position:relative;background:var(--desk-800);border:1px solid var(--rule-dark);border-radius:var(--r-xs);padding:16px;overflow:hidden}
  .envelope .sealband{position:absolute;top:0;bottom:0;left:50%;width:52%;display:flex;transform:translateX(-50%);pointer-events:none}
  .envelope .sealband i{flex:1 1 50%;background:linear-gradient(180deg,#3a3020,#2a2318);border:1px solid #514328;animation:seal-open .8s ease-out forwards}
  .envelope .sealband i:first-child{transform-origin:left center}
  .envelope .sealband i:last-child{transform-origin:right center}
  @keyframes seal-open{0%{transform:scaleX(1)}55%{transform:scaleX(1)}100%{transform:scaleX(0)}}
  .envelope .truthsheet{background:var(--paper-100);color:var(--ink-900);border:1px solid var(--paper-300);border-radius:var(--r-xs);padding:18px 20px;position:relative}
  .envelope .truthsheet h2{font-family:var(--font-story);font-size:24px;margin:6px 0 10px}
  .envelope .truthsheet .surface{font-family:var(--font-story);font-size:16.5px;line-height:1.95;white-space:pre-wrap}
  .seal.big{font-size:12px;padding:3px 10px;border-width:2px;letter-spacing:.12em}
  /* 复盘的"仅房主可见"窄红条（§2.21） */
  .redbar{background:var(--danger);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.08em;padding:5px 10px;border-radius:var(--r-xs);margin-bottom:12px}
  .recap h4{margin:16px 0 6px;font-size:11px;letter-spacing:.16em;color:var(--text-muted);text-transform:uppercase}
  .recap h4 .no{font-family:var(--font-mono);color:var(--brass);margin-right:6px}
  .recap .sheet{background:var(--paper-100);color:var(--ink-900);border:1px solid var(--paper-300);border-radius:var(--r-xs);padding:14px 16px}
  .recap .sheet .surface{font-family:var(--font-story);font-size:16px;line-height:1.9;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="logo" id="brandLogo" aria-hidden="true"></div>
      <div>
        <div class="name">海龟汤</div>
        <div class="sub">情境推理档案</div>
      </div>
    </div>
    <div class="topchips">
      <span class="chip mono clickable" id="roomChip" hidden></span>
      <span class="chip" id="connChip"><i class="lamp"></i>连接中…</span>
    </div>
  </header>
  <div id="app"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* ============================================================================
 * 客户端状态与工具
 * ==========================================================================*/
// 主力前端用 ht.* 键（与旧版一致：升级不该把正在玩的人的会话弄丢）
const LS_TOKEN = 'ht.token';
const LS_DRAFT = 'ht.draft';      // 预输入草稿：只存本机，绝不上传（隐私红线）
const LS_NICK = 'ht.nickname';

const S = {
  screen: 'entry',                      // entry | room
  error: '',
  notice: '',
  config: null,                         // GET /api/config
  me: null,                             // { roomId, memberId, token }
  view: null,                           // 最近一次 RoomView
  connected: false,
  lastSeq: 0,
  ack: {},
  pendingTimeline: [],                  // 系统事件（来自 room_events）
  questions: [],                        // 公共提问记录（来自 questions 表，所有人都能看到）
  log: [],                              // 合并后的公共对话记录（提问 + 系统事件，按时间排序）
  logPinned: true,                      // 用户是否停在记录底部（是则新消息自动滚到底）
  renderPending: false,                 // 输入/拖拽期间被推迟的渲染（操作结束后补一次）
  lastFingerprint: '',                  // 上次渲染对应的状态指纹（相同就不再碰 DOM）
  preset: 'standard',                   // 入口页选中的对局预设
  keyProvider: 'deepseek',              // 自备 Key 的提供方预设
  aiPuzzle: null,                       // AI 创作状态：{pending} | {puzzleId,title,surface,warnings} | {error,issues}
  lastFailDetail: null,                 // 上一次动作失败时的 detail（供具体功能展示细节）
  lastFailMessage: '',
  drafts: {},                            // 弹窗输入的临时值：只在本页内存里，重渲染不丢；关闭即清
  serverOffset: 0,                      // 服务端时钟 - 本机时钟（计时用服务端时间为准）
  hint: '',  recap: null,
  // 全员讨论区：消息、增量游标、草稿（只在内存里，和正式提问草稿分开）、未读数
  chat: [], chatSeq: 0, chatDraft: '', chatReadSeq: 0, chatUnread: 0,
  // chatPinned：讨论列表是否停在底部 —— 停在底部才自动跟随新消息，也才算"已读"
  // chatScrollToBottom：一次性指令（点「有 N 条新消息 ↓」时用），渲染后自动消费
  chatPinned: true, chatScrollToBottom: false,
  // 右栏页签：crew（在桌成员）/ notes（全员讨论）。切页签不动中央记录的滚动位置。
  railTab: 'crew',
  /** 房主点「换一批」后的候选题（只活在当前等待阶段；离开房间会被清掉） */
  pickPool: null,
  keyMask: null,
  keyTest: null,
  configModal: false,
  modalTriggerId: '',                    // 打开弹窗的那个按钮（关闭后把焦点还回去）
  noticeShown: '',                       // 已经弹过的短提示（同一条不重复弹）
  guessModal: false,
  truthModal: false,                     // "汤底公示"弹窗（被猜出时自动弹一次）
  truthDismissedKey: '',                 // 已经点过"返回"的那一局（避免每轮重渲染又弹出来）
  keyModal: false,
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = (ms) => { ms = Math.max(0, ms | 0); const t = Math.ceil(ms / 1000); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const nowMs = () => Date.now();
/** 服务端当前时间（以服务端快照为基准对齐本机时钟） */
const serverNow = () => Date.now() + S.serverOffset;

/* ---------------------------------------------------------------- 小转场的记账
 * 整页是 innerHTML 全量重渲染，所以动画类只能加在"刚出现/刚变化"的节点上。
 * 这份账由 fxEnter() 维护（见下），这里只留一个"上一次弹窗组合"给关闭逻辑用。
 * ------------------------------------------------------------------------- */
let lastFxModalKey = null;
let modalExitTimer = null;    // 弹窗淡出定时器

/**
 * 转场窗口：某个"第一次出现"的东西，在它出现后的短窗口内允许（重新）播入场动画。
 *
 * 为什么不是简单的"值变了才播一次"：入场后往往紧跟一次渲染
 * （建房返回→立刻一次轮询、开局返回→立刻一次轮询），
 * 那次渲染会把刚加的类连同节点一起换掉，动画还没开始就没了 —— 表现就是"没有转场"。
 * 所以这里记一个 260ms 的窗口：窗口内同值再渲染仍然补类（重新起播，肉眼看不出来），
 * 窗口过了就再也不补，避免"每次重渲染都重播"的老毛病。
 */
const FX_WINDOW_MS = 260;
const fxWindows = Object.create(null);
function fxEnter(key, value) {
  const t = Date.now();
  const prev = fxWindows[key];
  if (!prev || prev.value !== value) {
    fxWindows[key] = { value, until: t + FX_WINDOW_MS };
    return true;
  }
  return t < prev.until;
}

/** 当前应当显示的弹窗组合键（顺序与 viewRoom 里的拼装顺序一致） */
function modalKeyOf() {
  const room = S.view ? S.view.room : null;
  return [
    S.recap ? 'recap' : '',
    (S.truthModal && room && room.truth) ? 'truth' : '',
    S.keyModal ? 'key' : '',
    S.configModal ? 'cfg' : '',
    S.guessModal ? 'guess' : '',
  ].filter(Boolean).join('+');
}

/**
 * 关弹窗时先播 130ms 淡出再真正改状态。
 *
 * 为什么不能在 CSS 里"关的时候过渡一下"：关 = 状态变了 → 整页重渲染 → 节点当场被替换掉，
 * 没有机会播退场。所以先给现有的 .overlay/.modal 加 .out，等它播完再执行 apply()。
 * 期间再次调用（连点两下返回）只保留最后一次。
 */
function closeWithFx(apply) {
  const ov = document.querySelector('.overlay');
  if (!ov) { apply(); return; }
  ov.classList.add('out');
  const card = ov.querySelector('.modal');
  if (card) card.classList.add('out');
  if (modalExitTimer) clearTimeout(modalExitTimer);
  modalExitTimer = setTimeout(() => {
    modalExitTimer = null;
    lastFxModalKey = null;      // 下一次打开要重新播进场
    apply();
  }, 130);
}

/* ---------------------------------------------------------------- 全员讨论区
 * 只统计"别人发的、我还没看到的"未读数；未读纯属前端提示，不改房间/对局状态。
 * 打开讨论区并停在底部即视为已读（chatReadSeq 推进到最新）。
 * ------------------------------------------------------------------------- */
/** 单条讨论消息长度上限，与服务端 `PLATFORM.chatMaxLen` 对齐（这里只用于输入框提示与字数显示） */
const CHAT_MAXLEN = 500;
/** 短提示（窄收据）停留时长 */
const TOAST_MS = 4600;
/**
 * 短提示：窄收据从右上角滑入，4.6 秒后收起（§2.23）。
 * 容器 #toasts 在 #app 之外，所以整页重渲染不会把它冲掉；左侧细线的颜色表示性质。
 */
function pushToast(text, kind = 'ok') {
  const box = document.getElementById('toasts');
  if (!box || !text) return;
  const el = document.createElement('div');
  el.className = `toast${kind === 'err' ? ' err' : kind === 'warn' ? ' warn' : ''}`;
  el.textContent = text;
  el.setAttribute('data-at', String(Date.now()));
  box.appendChild(el);
  while (box.children.length > 4) box.removeChild(box.firstChild);
  // 到期前 200ms 先加 .gone 播一段淡出，再真正移除（不然收据是"啪"地消失）
  setTimeout(() => {
    el.classList.add('gone');
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
  }, Math.max(300, TOAST_MS - 200));
}

/**
 * 清理过期收据。
 * 为什么不能只靠 setTimeout：后台标签页/无头浏览器会把定时器节流到分钟级，
 * 那样提示会一直挂着。所以每轮渲染（≥1.2 秒一次）也顺手按时间戳清一遍。
 */
function pruneToasts() {
  const box = document.getElementById('toasts');
  if (!box) return;
  const now = Date.now();
  for (const el of Array.from(box.children)) {
    const at = Number(el.getAttribute('data-at') || 0);
    if (at > 0 && now - at > TOAST_MS) box.removeChild(el);
  }
}

/**
 * 关闭"最上面那一层"（§23：Esc 关弹窗）。返回真值表示确实关掉了什么。
 * 顺序与视觉层级一致：复盘 → Key → 参数 → 猜底 → 汤底 → 房间信息 → 窄屏讨论面板。
 */
function closeTopModal() {
  if (S.recap) { S.recap = null; return true; }
  if (S.keyModal) { S.keyModal = false; S.keyTest = null; delete S.drafts.keyValue; return true; }
  if (S.configModal) { S.configModal = false; return true; }
  if (S.guessModal) { S.guessModal = false; delete S.drafts.guessText; return true; }
  if (S.truthModal) {
    const r = S.view ? S.view.room : null;
    S.truthModal = false;
    if (r && r.truth) S.truthDismissedKey = `${r.id}:${r.roundNo}`;   // 关掉就别再自动弹
    return true;
  }
  return false;
}

function countChatUnread() {
  const meId = S.view && S.view.you ? S.view.you.memberId : '';
  S.chatUnread = S.chat.filter((m) => (m.chatSeq || 0) > S.chatReadSeq && m.memberId !== meId).length;
}
function markChatRead() {
  // 注意：必须跳过本地乐观条目：它的 chatSeq 是哨兵值（CHAT_LOCAL_SEQ = 最大整数），
  // 一旦算进 max，chatReadSeq 会被顶到最大整数 → 之后**所有**新消息都被判成"已读"，
  // 未读角标再也不出现（真缺陷，E2E 抓到的）。
  const newest = S.chat.reduce((mx, m) => (m.pending === true ? mx : Math.max(mx, m.chatSeq || 0)), 0);
  if (newest > S.chatReadSeq) { S.chatReadSeq = newest; countChatUnread(); }
}
/** 时刻 → HH:MM:SS（用于对话记录） */
const fmtClock = (at) => { try { return new Date(at).toLocaleTimeString('zh-CN', { hour12: false }); } catch { return ''; } };
/**
 * 元素此刻是否真的看得见（display:none / 被折叠都算看不见）。
 * 讨论区的"已读"判定必须建立在它之上：手机上面板没打开时列表是隐藏的，
 * 把隐藏列表当成"停在底部"会把人没看过的消息标成已读。
 * 测试用的 DOM 桩没有 getBoundingClientRect，这里要容错（否则整页渲染会抛）。
 */
function isVisible(el) {
  if (!el || el.offsetParent === null) return false;
  const r = typeof el.getBoundingClientRect === 'function' ? el.getBoundingClientRect() : null;
  return r ? r.height > 0 : true;
}
/** 讨论列表的 HTML（整页渲染与局部补渲染共用同一份，避免两处写法漂移） */
function chatListHtml() {
  const meId = S.view && S.view.you ? S.view.you.memberId : '';
  const msgs = S.chat.slice(-80);
  if (!msgs.length) return '<div class="empty">还没人说话。想商量就打个招呼。</div>';
  // 跨局分隔线（§12.8）：局号变化时插一条「第 N 局开始」，让旧消息仍可查、但一眼看得出分界。
  // 0 = 还没开过局（等待/选题阶段）不打线；第一条就属于第 N 局时也要打，否则看不出从哪局开始。
  const parts = [];
  let prevMatch = null;
  for (const m of msgs) {
    const mn = m.matchNo || 0;
    if (mn !== prevMatch && mn >= 1) parts.push(`<div class="chatsep"><span>第 ${mn} 局开始</span></div>`);
    prevMatch = mn;
    parts.push(chatEntry(m, meId));
    // 生成 HTML 的这一刻就记成"渲染过了"：同一个 tick 里还会再渲染一次
    // （乐观条目 → 服务端响应又触发一次整页渲染）。如果等到渲染收尾才标记，
    // 第二次渲染会再给它一个 .fx → 自己发的字闪两下（PC 与手机都复现过）。
    chatFxSeen.add(chatFxKey(m));
  }
  return parts.join('');
}
/** 讨论卡片右上角：未读提示 / 「有 N 条新消息 ↓」入口（§12.7） */
function chatPillHtml() {
  const unread = S.chatUnread || 0;
  const n = unread > 99 ? '99+' : unread;
  // 用户正在往上翻旧消息：**不强行拉到底**，只给一个入口
  if (unread && !S.chatPinned) return `<button class="pill live jump" id="btnChatJump">有 ${n} 条新消息 ↓</button>`;
  return `<span class="pill ${unread ? 'live' : ''}">${unread ? `${n} 条新消息` : '房间内自由发言'}</span>`;
}

/**
 * 已经播过"便笺贴入"动画的条目。
 *
 * 为什么需要它：同一条消息会被渲染两次 —— 先是本地的乐观条目（clientMessageId 已定），
 * 紧接着服务端真值回来把同一条替换掉。如果只按"有没有 chatSeq / 是不是 pending"判断，
 * 这两次渲染都会带上 .fx，而列表是整块 innerHTML 重建 → **自己发的字会闪两下**
 * （PC 和手机都一样，用户报的）。改成按"这一条是否已经渲染过"来判断，就只会闪一次。
 */
const chatFxSeen = new Set();
const chatFxKey = (m) => m.clientMessageId || `seq:${m.chatSeq}`;
/** 上一次渲染出来的便笺列表 HTML（内容没变就不重建 DOM） */
let lastChatHtml = null;
function markChatFxSeen() {
  for (const m of S.chat) chatFxSeen.add(chatFxKey(m));
  if (chatFxSeen.size > 500) chatFxSeen.clear();   // 兜底：房间聊天不会这么大
}
/**
 * 局部补渲染讨论区。
 *
 * 为什么需要它：整页是 innerHTML 全量重渲染，而 `isBusy()`（输入框带焦点 / 正在组字）会把
 * 重渲染整个推迟 —— 否则中文输入法组字会被打断。可只要用户把光标留在输入框里，
 * **整个页面就再也不更新**。所以被推迟时至少把讨论区补上：只替换列表与角标这几块，
 * 绝不碰输入框本身，组字安全。
 */
function patchChatList() {
  if (!S.view || S.screen !== 'room') return;
  const log = $('#chatLog');
  if (!log) return;
  // 内容没变就一个字节都别动：自己发消息会走两次 patch（乐观条目 + 服务端真值），
  // 第二次内容完全相同，重建 innerHTML 只会白闪一下。
  const html = chatListHtml();
  if (lastChatHtml !== html) {
    log.innerHTML = html;
    lastChatHtml = html;
  }
  const pill = $('#chatPill');
  if (pill) pill.innerHTML = chatPillHtml();
  const cnt = $('#chatCount');
  if (cnt) cnt.textContent = `${S.chat.length} 条`;
  // 输入框与发送键也一起同步（自己刚发完：清空草稿、按钮变灰、字数归零）。
  // 注意只改 value，不动节点本身 —— 中文输入法组字不能被打断。
  const input = $('#chatInput');
  if (input && input.value !== (S.chatDraft || '')) input.value = S.chatDraft || '';
  const btn = $('#btnChatSend');
  if (btn) btn.disabled = !String(S.chatDraft || '').trim();
  const counter = btn && btn.parentElement ? btn.parentElement.querySelector('.counter') : null;
  if (counter) counter.textContent = `${String(S.chatDraft || '').length}/${CHAT_MAXLEN}`;
  if (S.chatPinned) log.scrollTop = log.scrollHeight;
  markChatFxSeen();                                  // 这一次渲染过的条目，下次不再播动画（否则自己发的会闪两下）
}

/* ---------------------------------------------------------------- 计时（按秒走）
 * 轮询每 1.8 秒才回来一次，但倒计时必须按秒动，所以这里单独跑一个轻量 ticker：
 *   · 只更新带 data-deadline 的文本 / 带 data-bar 的进度条，**不重渲染整个界面**
 *     （整页重渲染会摧毁正在输入的输入框——这正是"API Key 打一半就没了"的根因）
 *   · 归零时催一次轮询，让服务端做惰性推进（超时跳过 / 投票截止…）
 * ------------------------------------------------------------------------- */
let tickTimer = null;
let zeroNudgedAt = 0;
function startTicker() {
  if (tickTimer) return;
  tickTimer = setInterval(tickUi, 250);
  tickUi();
}
function tickUi() {
  const now = serverNow();
  let anyExpired = false;
  document.querySelectorAll('[data-deadline]').forEach((el) => {
    // 刻度条也带 data-deadline（用来算点亮格数），但它的内容是 <i> 格子 —— 绝不能被当成倒计时文本写进去
    if (el.hasAttribute('data-ticks')) return;
    const left = Math.max(0, Number(el.getAttribute('data-deadline')) - now);
    const text = el.getAttribute('data-format') === 'plain' ? `${Math.ceil(left / 1000)} 秒` : fmt(left);
    if (el.textContent !== text) el.textContent = text;
    if (left <= 0) anyExpired = true;
  });
  document.querySelectorAll('[data-bar]').forEach((el) => {
    const left = Math.max(0, Number(el.getAttribute('data-deadline')) - now);
    const total = Math.max(1, Number(el.getAttribute('data-total')) || 1);
    const pct = Math.max(0, Math.min(100, (left / total) * 100));
    el.style.width = `${pct}%`;
  });
  // 机械计时牌的刻度条（§2.9）：从右向左逐格熄灭 —— 只改 class，不重渲染。
  document.querySelectorAll('[data-ticks]').forEach((el) => {
    const left = Math.max(0, Number(el.getAttribute('data-deadline')) - now);
    const total = Math.max(1, Number(el.getAttribute('data-total')) || 1);
    const pct = Math.max(0, Math.min(100, (left / total) * 100));
    const cells = el.children;
    const lit = Math.ceil((pct / 100) * cells.length);
    for (let i = 0; i < cells.length; i++) {
      const on = i < lit;
      if (cells[i].classList.contains('on') !== on) cells[i].classList.toggle('on', on);
    }
    // 最后 5 秒：只让数字和刻度变印泥红，不闪整块区域
    const danger = left <= 5000;
    if (el.classList.contains('danger') !== danger) el.classList.toggle('danger', danger);
  });
  if (anyExpired && S.view && token() && !pollInFlight && Date.now() - zeroNudgedAt > 1500) {
    zeroNudgedAt = Date.now();
    void pollOnce();
  }
}

function token() { return localStorage.getItem(LS_TOKEN) || ''; }
function saveSession(roomId, memberId, tok) {
  S.me = { roomId, memberId, token: tok };
  // 只存会话凭证，不存任何密钥或汤底（汤底服务端根本不下发）
  localStorage.setItem(LS_TOKEN, tok);
}
/**
 * 会话代次：每次"会话结束"（主动离开 / 令牌失效 / 房间被清理）+1。
 * 所有跨网络的异步回调（轮询、动作）都在发起前记下代次，回来时对不上就**整包丢弃**。
 * 否则会出现这类竞态：点「离开」时已有一个轮询在飞，它比离开请求晚回来，
 * 于是把房间页又渲染回来（或写上一句 HTTP 404），页面卡死只能刷新。
 */
let sessionEpoch = 0;

function clearSession() {
  sessionEpoch++;
  S.connected = false;             // 别再用旧会话的"已连接"去上报活动/心跳
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_DRAFT);
  S.me = null;
  S.view = null;
  S.drafts = {};                 // 会话结束：连同内存里的 API Key 草稿一起丢掉
  S.questions = [];
  S.log = [];
  // 讨论区是**房间内**的东西：离开/换房就清空，别把上一个房间的聊天带到下一个房间
  S.chat = [];
  S.chatSeq = 0;
  S.chatReadSeq = 0;
  S.chatUnread = 0;
  S.chatDraft = '';
  S.chatPinned = true;
  chatFxSeen.clear();                            // 换房间：动画记录也一起清掉
  lastChatHtml = null;                          // 换房间：便笺列表缓存也要清（否则可能拿旧房间的内容比对）
  S.fxLogAt = 0;
  S.railTab = 'crew';
  S.pickPool = null;             // 候选题"换一批"的结果也属于当前房间
}

/** 房间在服务端已经不存在（最后一人离开会立刻清理 / 过期回收）：回入口页，别一直重试 */
function roomGone(message = '房间已结束或已被清理，请重新创建或加入房间') {
  const wasInRoom = S.screen === 'room';
  clearSession();
  stopPolling();
  S.screen = 'entry';
  S.view = null;
  S.error = '';
  S.notice = wasInRoom ? message : '';
  render();
}

async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json', ...(opts.headers || {}) };
  if (token()) headers.authorization = `Bearer ${token()}`;
  const res = await fetch(path, { ...opts, headers });
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = { raw: text }; }
  if (!res.ok) {
    const err = new Error((body && (body.error || body.message)) || `HTTP ${res.status}`);
    err.status = res.status;
    err.body = body;              // 保留响应体：错误码/真实请求地址等诊断信息要用
    throw err;
  }
  return body;
}

/* ============================================================================
 * 传输层：轮询（方案 A：D1 + 惰性推进，无 WebSocket / 无 Durable Objects）
 *
 *  · 每 1.8 秒 GET /api/rooms/state?since=<seq>
 *      一次请求同时拿到【权威状态快照】+【时间线】+【新事件】+【最新 seq】
 *  · 动作走 POST /api/rooms/actions，响应里自带本次事件 → 自己的操作零等待
 *  · 心跳 20 秒一次（服务端断连判定 60 秒）；页面交互上报"活动"（挂机判定用）
 *  · 服务端每个请求都会先"惰性补算"过期事件（超时跳过/挂机/移交/投票截止），
 *    所以即使没有服务器定时器，语义也与"每秒 tick"等价
 * ==========================================================================*/
let pollTimer = null;
let hbTimer = null;
let pollInFlight = false;

/**
 * 讨论区乐观条目的 chatSeq 哨兵值：真实 seq 由服务端 SQL 分配（MAX+1），本地不等往返就先显示。
 * 用最大整数是**故意**的 —— 排序时它必然落在最下面（自己刚发的就是最新一条），
 * 而且它只活在 S.chat 数组里，服务端真值一到就按 clientMessageId 原地替换。
 */
const CHAT_LOCAL_SEQ = Number.MAX_SAFE_INTEGER;

/** {t:...} 帧 → 服务端动作（保持原有调用点不变） */
const ACTIONS = {
  next_round: () => ({ type: 'next_round' }),
  submit: (f) => ({ type: 'submit', turnSeq: f.turnSeq, text: f.text, clientSubmitId: f.clientSubmitId }),
  hint: (f) => ({ type: 'hint', tier: f.tier }),
  guess: (f) => ({ type: 'guess', text: f.text }),
  vote: (f) => ({ type: 'vote', choice: f.choice }),
  config: (f) => ({ type: 'config', patch: f.patch, expectedVersion: f.expectedVersion }),
  start: (f) => ({ type: 'start', mode: f.mode ?? 'pick', ...(f.puzzleId ? { puzzleId: f.puzzleId } : {}), ...(f.force ? { force: true } : {}) }),
  resume_transfer: () => ({ type: 'resume_transfer' }),
  return_host: () => ({ type: 'return_host' }),
  decline_return: () => ({ type: 'decline_return' }),
  ready: (f) => ({ type: 'ready', ready: f.ready !== false }),
  kick: (f) => ({ type: 'kick', memberId: f.memberId }),
  create_ai_puzzle: () => ({ type: 'create_ai_puzzle' }),
  reroll_candidates: () => ({ type: 'reroll_candidates' }),
  reenable_key: (f) => ({ type: 'reenable_key', yes: f.yes === true }),
  revoke_key: () => ({ type: 'revoke_key' }),
  skip_turn: () => ({ type: 'skip_turn' }),
  end_match: () => ({ type: 'end_match' }),
};

function startPolling() {
  if (!token()) return;
  stopPolling();
  startTicker();
  // 1.2 秒一轮：4 人玩 30 分钟约 6000 次请求，远低于免费额度（10 万/天），
  // 但别人动作的传播延迟从 ~0.9s 降到 ~0.6s。配合"状态没变就不重渲染"，开销可忽略。
  pollTimer = setInterval(() => { void pollOnce(); }, 1200);
  hbTimer = setInterval(() => { void sendAction({ type: 'heartbeat', hidden: document.visibilityState !== 'visible' }, { silent: true }); }, 20000);
  void pollOnce();
}

function stopPolling() {
  if (pollTimer) clearInterval(pollTimer);
  if (hbTimer) clearInterval(hbTimer);
  pollTimer = null;
  hbTimer = null;
}

async function pollOnce() {
  if (pollInFlight || !token()) return;
  const epoch = sessionEpoch;
  pollInFlight = true;
  try {
    const res = await fetch(`/api/rooms/state?since=${S.lastSeq}&chatSince=${S.chatSeq}`, { headers: { authorization: `Bearer ${token()}` } });
    // 响应回来时如果会话已经结束（用户已离开 / 房间被清理），整包丢弃：
    // 既不能把页面拉回房间，也不能写一句"连接中断（HTTP 404）"把入口页卡住。
    if (epoch !== sessionEpoch || !token()) return;
    if (res.status === 401) { expireSession(); return; }
    // 404 有两种，必须分开：ROOM_NOT_FOUND = 房间真没了（回入口页）；
    // 其它 404（例如路由不存在 = 前后端版本不匹配）是连接问题，要照实报出来，不能悄悄踢人。
    if (res.status === 404) {
      const body = await res.json().catch(() => null);
      if (body && body.error === 'ROOM_NOT_FOUND') { roomGone(); return; }
      throw new Error(`HTTP 404${body && body.path ? ` ${body.path}` : ''}`);
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (epoch !== sessionEpoch) return;
    S.connected = true;
    S.error = '';
    applyState(data);
  } catch (err) {
    if (epoch !== sessionEpoch) return;
    S.connected = false;
    S.error = `连接中断（${err.message}），正在重试…`;
    render();
  } finally {
    pollInFlight = false;
  }
}

/** 应用服务端返回的 { view, timeline, questions, events, seq } */
function applyState(data) { applyViewPayload(data); }

/** 把一份服务端载荷铺进本地状态（轮询与动作响应共用同一条路径） */
function applyViewPayload(data) {
  if (data.view) {
    S.view = data.view;
    S.screen = 'room';
    // 用服务端时间做基准，避免本机时钟偏差把倒计时算歪
    if (data.view.room && typeof data.view.room.serverTime === 'number') {
      S.serverOffset = data.view.room.serverTime - Date.now();
    }
  }
  if (Array.isArray(data.timeline)) {
    S.pendingTimeline = data.timeline.map((t) => ({
      seq: t.seq, kind: t.kind, text: t.text, at: t.at, meta: t.meta,
      memberId: t.memberId ?? null, answer: t.answer, reasonCode: t.reasonCode, source: t.source,
    }));
  }
  if (Array.isArray(data.questions)) {
    S.questions = data.questions.map((q) => ({
      at: q.at, kind: 'question', memberId: q.memberId, memberName: q.memberName, turnSeq: q.turnSeq,
      text: q.text, answer: q.answer, reasonCode: q.reasonCode, source: q.source, late: q.late === true,
      explain: q.explain || null,
    }));
  }
  S.log = buildLog(S.questions, S.pendingTimeline);
  // 全员讨论区：按 clientMessageId 合并。自己刚发的那条是**乐观条目**（chatSeq 用哨兵值、pending=true），
  // 服务端真值到了就原地替换 —— 不能当成重复直接丢掉，否则它永远停在哨兵位置、pending 也永远不消。
  if (Array.isArray(data.chatMessages) && data.chatMessages.length > 0) {
    let newest = 0;
    for (const m of data.chatMessages) {
      const i = S.chat.findIndex((x) => x.clientMessageId === m.clientMessageId);
      if (i < 0) S.chat.push(m);
      else if (S.chat[i].pending === true || !S.chat[i].chatSeq) S.chat[i] = m;
      if (m.chatSeq > newest) newest = m.chatSeq;
    }
    S.chat.sort((a, b) => (a.chatSeq || a.createdAt) - (b.chatSeq || b.createdAt));
    if (S.chat.length > 200) S.chat = S.chat.slice(-200);
    if (typeof data.chatSeq === 'number' && data.chatSeq > S.chatSeq) S.chatSeq = data.chatSeq;
    else if (newest > S.chatSeq) S.chatSeq = newest;
    countChatUnread();
  }
  if (typeof data.seq === 'number' && data.seq > S.lastSeq) S.lastSeq = data.seq;
  if (Array.isArray(data.events)) {
    for (const e of data.events) if (typeof e.seq === 'number' && e.seq > S.lastSeq) S.lastSeq = e.seq;
  }
  const roomNow = data.view && data.view.room ? data.view.room : null;
  // 「换一批」的结果只对当前这次等待阶段有效：一开局（或回到选题）就丢掉，别让旧的一批串到下一局
  if (roomNow && roomNow.status !== 'waiting') S.pickPool = null;
  if (roomNow && roomNow.status === 'settled') {
    S.notice = roomNow.truth ? '有人猜出了汤底：已对所有人公示' : '对局已结束，可以查看复盘';
    S.guessModal = false;                       // 结束了就别再挂着"猜汤底"弹窗
    const key = roomNow.truth ? `${roomNow.id}:${roomNow.roundNo}` : '';
    if (key && S.truthDismissedKey !== key) S.truthModal = true;   // 刚被猜出 → 自动弹一次
  } else if (roomNow) {
    // 不在"已结束"状态了（回到选题 / 开了下一局）：清掉"已点过返回"的记录，
    // 否则下一局再被猜出时 roundNo 又是 1，key 相同就再也不弹了（真实缺陷，W9 抓到）
    S.truthDismissedKey = '';
    S.truthModal = false;
  }
  render();
}

/**
 * 公共对话记录 = 所有成员的提问（含判定结果）+ 系统事件，按时间合并排序。
 * 提问来自服务端 questions 表（人人可见），系统事件来自 room_events。
 */
function buildLog(questions, timeline) {
  const qs = (questions || []).map((q) => ({ ...q, text: q.text }));
  const evs = (timeline || []).filter((t) => t.kind !== 'question').map((t) => ({ ...t, kind: t.kind === 'system' ? 'system' : t.kind }));
  return [...qs, ...evs].sort((a, b) => (a.at - b.at) || ((a.seq || 0) - (b.seq || 0)));
}

/**
 * 提交动作；**响应里直接带回最新视图**，所以自己的操作零额外往返（以前要再轮询一次）。
 * 失败时返回 null，并把错误显示出来。
 */
async function sendAction(action, opts = {}) {
  // 没有令牌 = 已经不在房间里（刚离开/被清理）。直接静默返回：
  // 页面上不该出现"会话已失效"这种噪音 —— 用户什么都没做错。
  if (!token()) return null;
  const epoch = sessionEpoch;
  try {
    const res = await fetch('/api/rooms/actions', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${token()}` },
      body: JSON.stringify(action),
    });
    const data = await res.json().catch(() => ({}));
    // 会话已经结束（用户已离开）：这份响应属于上一个房间，丢弃
    if (epoch !== sessionEpoch || !token()) return null;
    if (res.status === 401) { expireSession(); return null; }
    // 同上：只有 ROOM_NOT_FOUND（房间真没了）才回入口页
    if (res.status === 404 && data && data.error === 'ROOM_NOT_FOUND') { roomGone(); return null; }
    if (!res.ok || data.ok === false) {
      const detail = data.detail && data.detail.errors
        ? '（' + data.detail.errors.map((e) => `${e.path}: ${e.reason}`).join('；') + '）'
        : '';
      S.error = (data.message || `HTTP ${res.status}`) + detail;
      S.lastFailDetail = data.detail ?? null;      // 供具体功能展示细节（例如坏题检测的逐条原因）
      S.lastFailMessage = data.message || '';
      // 失败响应里同样带着**最新视图**：用上它，别让房主对着陈旧状态再点一次
      // （典型场景：有人刚加入还没举手 → 开局被拒 → 不刷新视图就得等 1.2 秒轮询后才能再点）
      if (data.view) applyViewPayload(data);
      else render();
      return null;
    }
    S.error = '';
    if (data.data && data.data.text) S.hint = data.data.text;
    if (!opts.silent) S.notice = noticeFor(action);
    // 响应自带 view/questions/seq → 直接应用，省掉一次往返
    if (data.view) applyViewPayload(data);
    else await pollOnce();
    return data;
  } catch (err) {
    if (epoch !== sessionEpoch) return null;      // 离开房间后才回来的失败，同样丢弃
    S.connected = false;
    S.error = `请求失败：${err.message}`;
    render();
    return null;
  }
}

/** 会话失效（令牌过期/房间销毁）：回到入口页 */
function expireSession() {
  clearSession();
  stopPolling();
  S.screen = 'entry';
  S.view = null;
  S.error = '会话已失效，请重新创建或加入房间';
  render();
}

/** 兼容原有调用点：request({t:'...'}) → 对应动作 */
function request(frame) {
  const map = ACTIONS[frame.t];
  if (!map) { S.error = `未知操作：${frame.t}`; render(); return null; }
  if (frame.t === 'guess') S.guessModal = false;
  void sendAction(map(frame));
  return null;
}

/** 兼容原有调用点：send({t:'activity'|'heartbeat'}) */
function send(frame) {
  if (frame.t === 'activity' || frame.t === 'heartbeat') {
    void sendAction({ type: frame.t, hidden: frame.hidden === true }, { silent: true });
  }
}

/** 主动离开房间：先告诉服务端（最后一人离开会被立即清理），再清本地 */
async function leaveRoom() {
  if (token()) {
    try {
      await fetch('/api/rooms/actions', {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: `Bearer ${token()}` },
        body: JSON.stringify({ type: 'leave' }),
        keepalive: true,
      });
    } catch { /* 网络失败也要允许离开 */ }
  }
  clearSession();
  stopPolling();
  S.screen = 'entry';
  S.view = null;
  S.notice = '';
  S.error = '';
  render();
}

function noticeFor(action) {
  switch (action.type) {
    case 'submit': return '已提交';
    case 'hint': return '提示已发放';
    case 'vote': return '已记录你的表决';
    case 'start': return '对局开始';
    case 'config': return '参数已更新';
    case 'skip_turn': return '已跳过本轮';
    case 'revoke_key': S.keyMask = null; return '已撤销 Key';
    default: return '';
  }
}

/** 兼容：进入房间时用一次状态快照铺满界面 */
function applyView(view) {
  if (!view) return;
  S.view = view;
  S.screen = 'room';
  render();
}

/** 复制到剪贴板（http 页面下 navigator.clipboard 不可用，回落到临时 textarea） */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch { /* 回落 */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const okCopy = document.execCommand('copy');
    document.body.removeChild(ta);
    return okCopy;
  } catch { return false; }
}

/**
 * 「轮到你了」提醒：切到别的标签页时把标题闪起来，回来后立刻复原。
 * （我们只有一个人能发言，错过回合的代价很高，所以这个提醒是值得的）
 */
let titleTimer = null;
let titleBase = document.title;
function setTitleAlert(on) {
  if (on) {
    titleBase = 'AI 海龟汤';
    if (titleTimer) return;
    let flip = false;
    titleTimer = setInterval(() => {
      flip = !flip;
      document.title = flip ? '轮到你发言了 — 海龟汤' : titleBase;
    }, 900);
    document.title = '轮到你发言了 — 海龟汤';
  } else {
    if (titleTimer) { clearInterval(titleTimer); titleTimer = null; }
    document.title = 'AI 海龟汤';
  }
}

/* ============================================================================
 * 渲染
 *
 * 注意：这里是全量 innerHTML 重渲染，而轮询每 1.8 秒就会调一次 render()。
 *    **正在输入时绝不重渲染**：整页 innerHTML 会把输入框整个换掉，
 *    中文输入法正在组字的内容会直接被打断、光标丢失 —— 表现就是"打不进字/一闪一闪"。
 *    输入结束后（失焦或停手 700ms）再补一次渲染，把期间收到的状态追上。
 *    另外仍显式保住：焦点/光标位置、S.drafts 回填的输入值、对话记录是否贴底。
 * ==========================================================================*/
/**
 * 是否"用户正在操作"：输入中 / 鼠标按着拖动 / 有文字选区。
 *
 * 轮询每 1.2 秒回一次，期间**绝不动 DOM**：
 *   · 输入中（含中文输入法组字）→ 输入框被替换会打断组字
 *   · 鼠标按着拖动（选中文字、拖滚动条）→ 节点被替换会打断拖拽与选区，表现为"闪一下"
 *   · 有选区 → 重渲染会清掉选区，用户会以为点错了
 */
function isBusy() {
  if (pointerDown) return true;
  const a = document.activeElement;
  if (a && a.tagName) {
    const editable = a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable === true;
    if (editable && $('#app').contains(a)) return true;
  }
  try {
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && String(sel).length > 0) return true;
  } catch { /* 忽略 */ }
  return false;
}

let pointerDown = false;

/**
 * 被推迟的渲染补上时用**非强制** render()：
 * 指纹没变就一个字节都不动。以前这里是 render(true)，于是"点一下空白处""在记录里拖选文字"
 * 都会把整页重建一遍 —— 新记录/便笺的入场动画跟着重播，看起来就像页面在闪。
 */
let deferredRenderTimer = null;
function scheduleDeferredRender() {
  if (deferredRenderTimer) clearTimeout(deferredRenderTimer);
  deferredRenderTimer = setTimeout(() => {
    deferredRenderTimer = null;
    if (S.renderPending && !isBusy()) render();
  }, 700);
}

/** 操作结束（失焦 / 松开鼠标）后补渲染；延迟一点，避免把正要点击的按钮提前替换掉 */
function flushDeferredRender() {
  setTimeout(() => {
    if (S.renderPending && !isBusy()) render();
  }, 250);
}

/**
 * 状态指纹：只有它变了才重渲染。
 *
 * 注意：这里**必须剔除每轮都在变的字段**（`room.serverTime`）：时间戳每 1.2 秒变一次，
 * 一旦进指纹，指纹就永远不同，"状态没变就不动 DOM"直接失效 ——
 * 表现就是整个页面（尤其是弹窗）每 1.2 秒重建一次、入场动画反复重播 = **闪回**。
 * 倒计时不走这里：它由 tickUi() 直接改 `data-deadline` 元素的文本，不需要重渲染。
 */
function stateFingerprint() {
  const t = S.keyTest;
  const view = S.view
    ? { ...S.view, room: S.view.room ? { ...S.view.room, serverTime: 0 } : S.view.room }
    : null;
  return JSON.stringify([
    S.screen, S.connected, S.notice, S.error, S.hint,
    S.configModal, S.guessModal, S.keyModal, S.truthModal,
    // 讨论区：消息条数与未读数进指纹（否则新消息不会触发重渲染）；草稿刻意不进（打字不重渲染）；
    // 页签也进指纹（切到「讨论」要立刻重画）；候选题「换一批」的结果同理
    S.chat.length, S.chatUnread, S.railTab, S.pickPool ? S.pickPool.length : 0,
    S.keyMask, t ? [t.pending === true, t.ok === true, t.reasonCode, t.message, t.url] : null,
    S.recap ? 1 : 0,
    view, S.questions, S.log.length, S.pendingTimeline.length,
    S.preset, S.keyProvider,
    S.drafts.ask, S.drafts.guessText, S.drafts.keyBase, S.drafts.keyModel, S.drafts.nick, S.drafts.code,
    Object.keys(S.drafts).filter((k) => k.startsWith('cfg:')).map((k) => [k, S.drafts[k]]),
  ]);
}

function render(force = false) {
  const app = $('#app');
  pruneToasts();                                     // 过期的窄收据顺手清掉（不依赖被节流的定时器）
  // 短提示（§2.23）：notice 表示"刚发生了什么"，像一张窄收据从右上角滑入后自动收起。
  // 持续状态（连接中断 / AI 异常 / 投票 / 移交）走各自区域的常驻提示，不走这里；
  // 入口页（会话失效、房间已清理）也仍然内联显示，不放 toast。
  if (S.notice && S.notice !== S.noticeShown && S.screen === 'room') {
    S.noticeShown = S.notice;
    pushToast(S.notice, 'ok');
  }
  if (!app.firstChild) force = true;                 // 首次渲染必须画
  if (!force && isBusy()) {
    S.renderPending = true;
    // 整页渲染推迟了，但讨论区不能跟着停摆：把列表/角标局部补上（不碰输入框，组字安全）
    patchChatList();
    scheduleDeferredRender();
    return;
  }

  const fingerprint = stateFingerprint();
  if (!force && fingerprint === S.lastFingerprint) return;   // 状态没变：一个字节都不动
  S.renderPending = false;
  S.lastFingerprint = fingerprint;

  // 哪些"小转场"该播：只在"这个东西刚出现/刚变化"的窗口内补类（见 fxEnter 的说明）
  const screenChanged = fxEnter('screen', S.screen);
  const modalKeyNow = modalKeyOf();

  const active = document.activeElement;
  const keep = active && active.id && app.contains(active) && typeof active.selectionStart === 'number'
    ? { id: active.id, start: active.selectionStart, end: active.selectionEnd }
    : null;
  const oldLog = $('#log');
  const pinned = oldLog ? (oldLog.scrollHeight - oldLog.scrollTop - oldLog.clientHeight < 48) : S.logPinned;
  // 必须**先**把旧位置的 scrollTop 抄下来：下面 app.innerHTML 一换，#log 就是个全新节点（scrollTop=0），
  // 再读 log.scrollTop 只会读到 0 —— 于是"没贴在底部"的情况下每次重渲染都被扔回记录最上面
  // （往上翻旧记录时一直跳回顶部，就是这里漏了这一句）。
  const logScrollBefore = oldLog ? oldLog.scrollTop : 0;
  // 讨论列表同理：重渲染前先记住"是不是停在底部"和滚动位置。
  // 注意：不可见时（手机上面板没打开）**不能**当成停在底部 —— 否则会把人没看过的消息算成已读。
  const oldChat = $('#chatLog');
  const chatVisible = isVisible(oldChat);
  // S.chatScrollToBottom：点「有 N 条新消息 ↓」或打开面板时的一次性指令 ——
  // 否则重渲染后会按"重渲染前的位置"还原，把用户又扔回列表顶部（点了个寂寞）。
  const chatPinnedBefore = S.chatScrollToBottom === true
    ? true
    : (oldChat && chatVisible
      ? (oldChat.scrollHeight - oldChat.scrollTop - oldChat.clientHeight < 24)
      : S.chatPinned);
  const chatScrollBefore = oldChat ? oldChat.scrollTop : 0;
  // 弹窗内部可能被滚动过（Key 弹窗、参数弹窗内容多），重渲染后要还原，否则会"跳回顶部"
  const oldModal = document.querySelector('.modal');
  const modalScroll = oldModal ? oldModal.scrollTop : 0;

  if (!S.view || S.screen === 'entry') { app.innerHTML = viewEntry(); bindEntry(); }
  else app.innerHTML = viewRoom();

  // 换屏 / 弹窗进场：这里统一补类（不改 viewEntry/viewRoom 的返回值，也不改 modalShell 的签名）
  const rootEl = app.firstElementChild;
  if (rootEl && screenChanged) rootEl.classList.add('screen-in');
  if (modalKeyNow && fxEnter('modal', modalKeyNow)) {
    const ov = document.querySelector('.overlay');
    const card = ov ? ov.querySelector('.modal') : null;
    if (ov) ov.classList.add('in');
    if (card) card.classList.add('in');
  }
  if (!modalKeyNow) lastFxModalKey = null;             // 关掉了：下次再开要重新播进场
  else lastFxModalKey = modalKeyNow;

  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) {
      el.focus();
      try { el.setSelectionRange(keep.start, keep.end); } catch { /* number 输入框不支持选区 */ }
    }
  }
  const log = $('#log');
  // 公共记录：贴在底部 → 跟随最新；往上翻 → **原样还原**到用户看的那一行（别拉回顶部）
  if (log) {
    log.scrollTop = pinned ? log.scrollHeight : Math.min(logScrollBefore, log.scrollHeight);
    S.logPinned = pinned;
  }
  // 讨论列表：停在底部 → 跟随到底；往上翻 → 保持原位置（新消息只提示，不强行拉走）
  const chatLog = $('#chatLog');
  if (chatLog) {
    if (chatPinnedBefore) chatLog.scrollTop = chatLog.scrollHeight;
    else chatLog.scrollTop = Math.min(chatScrollBefore, chatLog.scrollHeight);
    const vis = isVisible(chatLog);
    S.chatPinned = vis ? (chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 24) : chatPinnedBefore;
    S.chatScrollToBottom = false;                  // 一次性指令已消费
    if (vis && S.chatPinned) {
      // 看得见 + 停在底部 = 已读。未读数变了就下一拍补一次渲染让角标消失
      // （用 setTimeout 而不是直接递归 render：避免"渲染中再渲染"）
      const before = S.chatUnread;
      markChatRead();
      if (S.chatUnread !== before) setTimeout(() => render(), 0);
    }
  }
  // 记录本次渲染到哪儿了：下次渲染时用它判断"哪几条是新的"，只给新条目加入场动画。
  S.fxLogAt = S.log.reduce((mx, t) => Math.max(mx, Number(t.at || 0)), 0);
  markChatFxSeen();                                  // 便笺：记下"这些已经渲染过了"，重渲染不再重播

  // 窄屏讨论面板打开时锁住页面滚动（面板本身是 fixed 覆盖层）。
  // 容错：测试用的 DOM 桩没有 body.classList / matchMedia。
  const narrow = typeof window.matchMedia === 'function' ? window.matchMedia('(max-width:900px)').matches : false;
  if (document.body && document.body.classList && typeof document.body.classList.toggle === 'function') {
  }
  if (modalScroll > 0) {
    const modal = document.querySelector('.modal');
    if (modal) modal.scrollTop = modalScroll;
  }

  // 顶部连接状态（§2.7：6px 信号灯 + 短文字，不做发光圆点）
  const chip = document.getElementById('connChip');
  if (chip) {
    const inRoom = Boolean(S.view && S.screen === 'room');
    const bad = inRoom && !S.connected;
    chip.innerHTML = bad
      ? '<i class="lamp off"></i>连接中断，正在重试…'
      : '<i class="lamp"></i>已连接<span class="tech"> · Cloudflare Workers + D1</span>';
  }

  // 房号实时显示在顶栏（§2.7：ROOM / K7M2QX，等宽字体，点整个编号复制）
  const roomChip = document.getElementById('roomChip');
  if (roomChip) {
    const inRoom = Boolean(S.view && S.screen === 'room' && S.view.room);
    if (inRoom) {
      roomChip.hidden = false;
      roomChip.innerHTML = `ROOM / <b>${esc(S.view.room.code)}</b> <span class="dim">复制</span>`;
      roomChip.style.cursor = 'pointer';
      roomChip.setAttribute('role', 'button');
      roomChip.title = '点一下复制房号';
      roomChip.onclick = async () => {
        const okCopy = await copyText(S.view.room.code);
        S.notice = okCopy ? `房号 ${S.view.room.code} 已复制` : `房号：${S.view.room.code}`;
        render();
      };
    } else {
      roomChip.hidden = true;
      roomChip.onclick = null;
    }
  }

  // 弹窗焦点（§23）：打开时把焦点送进弹窗；关闭后把焦点还给触发它的按钮
  const dlg = document.querySelector('.overlay .modal');
  if (dlg) {
    if (!dlg.contains(document.activeElement)) {
      const first = dlg.querySelector('input:not([type=hidden]),textarea,select,button');
      if (first && first.focus) first.focus();
    }
    S.modalWasOpen = true;
  } else if (S.modalWasOpen) {
    S.modalWasOpen = false;
    const back = S.modalTriggerId ? document.getElementById(S.modalTriggerId) : null;
    if (back && back.focus) back.focus();
  }

  // 轮到你/没轮到你：标题栏提醒（只在自己需要动手时闪）
  const myTurnNow = Boolean(S.view && S.screen === 'room' && S.view.you && S.view.you.canSubmit);
  setTitleAlert(myTurnNow && document.visibilityState !== 'visible');
}

  { key: 'standard', idx: '02', title: '标准', desc: '60 秒 / 人 · 20 轮上限', cool: '猜底冷却 180 秒' },
  { key: 'casual', idx: '03', title: '休闲', desc: '120 秒 / 人 · 30 轮上限', cool: '猜底冷却 300 秒' },
];

      ${S.error ? `<div class="err" style="margin-top:12px">${esc(S.error)}</div>` : ''}
      ${S.notice ? `<div class="notice" style="margin-top:12px">${esc(S.notice)}</div>` : ''}
      <div class="hr"></div>

      <div class="dim">
        ${S.config ? `服务端模型：${S.config.realModelEnabled ? '已配置平台额度' : '未配置（可由房主自备 API Key）'} · 密钥保险箱：${S.config.vaultEnabled ? '已启用' : '未启用'}` : '正在读取服务端配置…'}
