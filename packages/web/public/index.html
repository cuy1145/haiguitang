/**
 * 入口页的「创建 / 加入」：留空房间码就新建，否则按房号加入。
 * 单独抽成函数（而不是塞在 onclick 里）是为了能测：离开房间后立刻重开，
 * 上一次会话留下的报错/说明不许带进新房间。
 */
async function joinOrCreate() {
  const nickname = ($('#nick').value || '').trim() || '玩家';
  const code = ($('#code').value || '').trim().toUpperCase();
  const preset = $('#preset').value;
  localStorage.setItem(LS_NICK, nickname);
  S.error = '';
  S.notice = '';                   // 上一次会话的说明（如"房间已被清理"）不要带进新房间
  const res = code
    ? await api(`/api/rooms/${code}/join`, { method: 'POST', body: JSON.stringify({ nickname }) })
    : await api('/api/rooms', { method: 'POST', body: JSON.stringify({ nickname, preset }) });
  saveSession(res.roomId, res.memberId, res.token);
  if (res.view) { S.view = res.view; S.screen = 'room'; }
  startPolling();
  render();
}

/**
 * 入口页的「单人模式」：自己一个人推一道题。
 *
 * 房间还是同一套（同一批判定/提示/猜汤底/复盘代码），只是建房时带 `solo: true`：
 * 服务端不给这个房间排轮转计时、拒绝讨论区/投票/准备/踢人，也拒绝别人加入。
 * 所以这里**不看房号输入框** —— 单人模式永远是新建一间自己的房。
 */
async function startSolo() {
  const nickname = ($('#nick').value || '').trim() || '玩家';
  const preset = $('#preset').value;
  localStorage.setItem(LS_NICK, nickname);
  S.error = '';
  S.notice = '';
  const res = await api('/api/rooms', { method: 'POST', body: JSON.stringify({ nickname, preset, solo: true }) });
  saveSession(res.roomId, res.memberId, res.token);
  if (res.view) { S.view = res.view; S.screen = 'room'; }
  startPolling();
  render();
}

function bindEntry() {
  const go = $('#btnGo');
  if (go) go.onclick = async () => {
    try { await joinOrCreate(); } catch (e) { S.error = e.message; render(); }
  };
  const solo = $('#btnSolo');
  if (solo) solo.onclick = async () => {
    try { await startSolo(); } catch (e) { S.error = e.message; render(); }
  };
  const resume = $('#btnResume');
  if (resume) resume.onclick = async () => {
    try {
      const me = await api('/api/session');
      S.me = { roomId: me.roomId, memberId: me.memberId, token: token() };
      S.view = me.view; S.screen = 'room';
      startPolling();
      render();
    } catch (e) {
      // 房间已经没了（长时间没人 → 被回收；或最后一人离开后立即清理）。
      // 这不是"出错了"，是正常生命周期：给一句中文说明，别甩一个 ROOM_NOT_FOUND 错误码。
      clearSession();
      if (e.status === 401 || e.status === 404) {
        S.error = '';
        S.notice = '上一个房间已经关闭了（长时间没有人参与，或已经散场）。重新开一局，或在下面输入房号加入。';
      } else {
        S.error = e.message;
      }
      render();
    }
  };
}

/** 中文阶段文案（§24：界面不出现 waiting/playing/settled 这类内部枚举） */
function roomStatusLabel(room) {
  if (!room) return '';
  if (room.status === 'waiting') return '等待开局';
  if (room.status === 'playing') return '推理进行中';
  if (room.status === 'settled') return '本局结束';
  if (room.status === 'suspended') return room.pauseReason === 'AI_BLOCKED' ? '已暂停 · AI 异常' : '已暂停';
  return room.status;
}

/**
 * 房间页总体布局（§5.1）：左「当前回合」/ 中「主内容」/ 右「玩家与讨论」，底部整行书写板。
 * 手机上 .grid 变成 display:contents，各区块按 §6 的玩法顺序单列排开。
 */
function viewRoom() {
  const v = S.view;
  const room = v.room;
  const you = v.you;
  const turn = room.turn;
  const puzzle = room.puzzle;
  const draft = S.drafts.ask ?? (localStorage.getItem(LS_DRAFT) || '');
  const myTurn = you.canSubmit;
  const phaseLabel = { ACTIVE: '正在提问', GRACE: '宽限期（提交仍有效）', JUDGING: '主持人判定中', SETTLED: '本轮结束', SKIPPED: '已跳过', PAUSED: '已暂停', IDLE: '等待开局' }[turn.phase] || turn.phase;
  const counting = turn.phase === 'ACTIVE' || turn.phase === 'GRACE';
  const deadline = turn.phase === 'GRACE' ? turn.graceDeadlineAt : turn.deadlineAt;
  // 计时窗口长度：**不能**用 turn.startedAt —— 房间投影里根本没有这个字段（它只在服务端内部），
  // 之前用它算出来是 NaN，进度条/刻度会一直是空的。这里直接按本局配置的时长算。
  const total = turn.phase === 'GRACE'
    ? Math.max(1, (room.config.graceSec || 5) * 1000)
    : Math.max(1, (room.config.perTurnSec || 60) * 1000);
  const left = counting ? Math.max(0, deadline - serverNow()) : 0;
  const pct = counting ? Math.max(0, Math.min(100, (left / total) * 100)) : 0;
  const railTab = S.railTab === 'notes' ? 'notes' : 'crew';
  const waiting = room.status === 'waiting';
  /** 单人模式：隐藏一切多人专属部件（名册 / 讨论区 / 房号邀请 / 投票 / 跳过 / 准备） */
  const solo = room.solo === true;

  // 小转场记账（见文件顶部的 fxEnter）：只在"刚出现/刚变化"的窗口内给类，避免整页重渲染反复重播
  const tabFx = fxEnter('railTab', railTab) ? ' panel-in' : '';
  const puzzleFx = (puzzle && fxEnter('puzzle', puzzle.id)) ? ' card-in' : '';
  const turnFx = (myTurn && room.status === 'playing' && fxEnter('turn', turn.seq)) ? ' card-in' : '';
  const msgKey = `${S.notice || ''}|${S.error || ''}`;
  const msgFx = (msgKey !== '|' && fxEnter('msg', msgKey)) ? ' card-in' : '';

  return `
  <div class="grid">
    <div class="col-side">
      ${speakerPanel(room, you, turn, counting, left, deadline, total, pct, phaseLabel)}
      ${engineBar(room, you)}
      <div class="card roomcard hd">
        <h3>${solo ? 'SOLO / 单人这局' : 'ROOM / 房间'}</h3>
        <div class="kv">
          ${solo ? '' : `<div class="k">房号</div><div class="mono" style="letter-spacing:.18em">${esc(room.code)}</div>`}
          <div class="k">状态</div><div>${esc(roomStatusLabel(room))}</div>
          <div class="k">进度</div><div class="mono">第 ${room.roundNo} 轮 · 本房间第 ${room.matchNo || 0} 局</div>
        </div>
        ${solo ? '' : `
        <div class="actions">
          <button id="btnCopyCode" class="ghost">复制房号</button>
          <button id="btnCopyInvite" class="ghost">复制邀请链接</button>
        </div>`}
        ${you.isHost ? `
        <div class="hr"></div>
        <div class="eyebrow" style="margin-bottom:8px">${solo ? 'THIS ROUND / 本局操作' : 'HOST / 房主操作'}</div>
        <div class="actions">
          ${waiting ? `<button class="primary" id="btnStart">${solo ? '随机来一道' : '开局（随机一道）'}</button>${solo ? '' : '<button id="btnStartVote">投票选汤</button>'}` : ''}
          <button id="btnCfg">对局参数</button>
          ${(!solo && turn.phase === 'ACTIVE') ? '<button id="btnSkip">跳过本轮</button>' : ''}
        </div>` : ''}
        <div class="hr"></div>
        <button id="btnLeave" class="danger">${solo ? '结束单人局' : '离开房间'}</button>
      </div>
    </div>

    <div class="col-main">
      ${(S.notice || S.error) ? `<div class="topmsg${msgFx}">
        ${S.notice ? `<div class="notice">${esc(S.notice)}</div>` : ''}
        ${S.error ? `<div class="err">${esc(S.error)}</div>` : ''}
      </div>` : ''}

      ${pendingSeatCard(room, you)}

      ${myTurn && room.status === 'playing' ? `<div class="your-turn${turnFx}"><b>${solo ? '想好就问' : '轮到你发言'}</b> · ${solo ? '不限时，慢慢推；一句话问两件事会得到「部分接近」' : '想好就直接问，超时会自动跳过本轮'}</div>` : ''}

      ${puzzle ? puzzleCard(puzzle, room, you, puzzleFx) : ''}
      ${puzzle ? statStrip(room, you) : ''}

      ${(you.isHost && room.status === 'waiting') ? aiPuzzleCard(room, you) : ''}

      ${(waiting && !you.isHost) ? `
      <div class="waitcard hd">
        <div class="spread"><h3 style="margin:0">WAIT / 等待房主选题</h3><span class="seal">选题中</span></div>
        <div class="dim">房主可以自己挑一道、让大家投票选，或者让 AI 现写一道新题。选好后你会看到汤面。</div>
      </div>` : ''}

      ${(you.isHost && pickCandidates(v).length > 0 && waiting) ? `
      <div class="candcard hd"><div class="spread"><h3 style="margin:0">CANDIDATES / 候选题（${pickCandidates(v).length} 道）</h3>
        <span class="row">
          <span class="dim">${solo ? '点「选这道」就开始，或让 AI 现写一道' : '点「选这道」直接开局，或发起「投票选汤」让大家一起选'}</span>
          <button id="btnReroll" class="ghost">换一批</button>
        </span></div>
        <div class="cands">
          ${pickCandidates(v).map((c) => `
            <div class="cand">
              <div class="attrs">
                <span class="seal">${esc(c.rating)}</span>
                <span>难度 <span class="mono">${c.difficulty}</span>/5</span>
                <span>约 <span class="mono">${c.estMinutes}</span> 分钟</span>
              </div>
              <div class="cbody">${esc(c.surface)}</div>
              <div class="row">${(c.tags || []).map((t) => `<span class="pill">#${esc(t)}</span>`).join('')}
                ${(c.sensitiveTags || []).map((t) => `<span class="pill l3">内容提示：${esc(t)}</span>`).join('')}</div>
              ${you.isHost ? `<button class="primary" data-pick="${esc(c.id)}">选这道</button>` : ''}
            </div>`).join('')}
        </div>
      </div>` : ''}

      ${bannersBox(room, you)}

      ${room.truth ? truthCard(room, you) : ''}

      ${room.status === 'settled' ? `
      <div class="settled hd"><div class="spread"><h3 style="margin:0">CLOSED / 本局结束</h3>
        ${you.isHost ? `<span class="row"><button class="primary" id="btnRecap">查看复盘</button><button id="btnNextRound">${solo ? '再来一道' : '回到选题（下一局）'}</button></span>` : '<span class="seal">等房主开下一局</span>'}</div>
        <div class="dim">${room.truth
          ? '汤底已经公示（见上方）。点「' + (solo ? '再来一道' : '回到选题') + '」就能选下一道题；中止的对局不予揭晓（避免"开局→立刻结束→读汤底"）。'
          : you.isHost
            ? '本局没被猜出来：复盘含汤底揭晓（含事实点与全部提问）' + (solo ? '。' : '，只有你能看到；中止的对局不予揭晓。')
            : '本局没被猜出来。汤底只有房主能揭晓。'}</div></div>` : ''}

      ${recordsCard(room, you)}
    </div>

    <div class="col-rail">
      ${solo ? `
      <div class="card hd">
        <h3>SOLO / 单人模式</h3>
        <div class="dim">这一局只有你一个人，所以这些多人玩法<strong>不在</strong>这里：</div>
        <ul class="dim" style="margin:8px 0 0;padding-left:18px">
          <li>全员讨论区</li>
          <li>准备举手 / 等房主开局</li>
          <li>投票选汤、踢人、房主移交</li>
          <li>回合倒计时（超时跳过）</li>
        </ul>
        <div class="dim" style="margin-top:8px">都有的是：提问判定与说明句、提示、猜汤底、汤底公示、复盘、AI 出题、对局参数。</div>
      </div>` : `
      <div class="card hd">
        <div class="tabs" role="tablist">
          <button class="tab${railTab === 'crew' ? ' on' : ''}" id="btnTabCrew" role="tab" aria-selected="${railTab === 'crew' ? 'true' : 'false'}">CREW / 玩家 <span class="dim">${room.members.length}</span></button>
          <button class="tab${railTab === 'notes' ? ' on' : ''}" id="btnTabNotes" role="tab" aria-selected="${railTab === 'notes' ? 'true' : 'false'}">NOTES / 讨论${S.chatUnread ? `<span class="badge">${S.chatUnread > 99 ? '99+' : S.chatUnread}</span>` : ''}</button>
        </div>
        ${railTab === 'crew' ? `<div class="railpanel${tabFx}">${crewPanel(room, you, turn)}</div>` : `<div class="railpanel${tabFx}">${chatCard(room, you, true)}</div>`}
      </div>`}
      <div class="creditcard hd">
        <h3>CREDIT / 额度来源</h3>
        <div class="kv">
          <div class="k">模式</div><div>${room.credit.mode === 'host_key' ? (solo ? '你自备的 API' : '房主自备 API') : '平台备用额度'}</div>
          <div class="k">原因</div><div class="mono">${esc(room.credit.reason)}</div>
          ${room.credit.grantLeft ? `<div class="k">临时授权</div><div class="mono">${room.credit.grantLeft} 次</div>` : ''}
          <div class="k">${solo ? '你的 Key' : '房主 Key'}</div><div>${hostKeyMask(room) ? `<span class="mask">${esc(hostKeyMask(room))}</span>` : '<span class="dim">未配置</span>'}</div>
        </div>
        <div class="dim" style="margin-top:8px">原文不可回读：任何角色（含房主本人）都取不回明文。调用失败时不会自动改用平台额度。</div>
      </div>
    </div>

    ${composerCard(room, you, turn, myTurn, draft)}
  </div>

  ${S.configModal ? cfgModal(room) : ''}
  ${S.guessModal ? guessModal(v) : ''}
  ${(S.truthModal && room.truth) ? truthModal(room, you) : ''}
  ${S.keyModal ? keyModal(v) : ''}
  ${S.recap ? recapModal(S.recap) : ''}`;
}

/**
 * 底部书写板（§2.15）：唯一黄铜实底按钮是「发送」，猜汤底印泥红细框，讨论用便笺按钮。
 * 未轮到时输入框照常可用（只写本机草稿），只有发送按钮禁用 —— 不把整块降透明度。
 */
function composerCard(room, you, turn, myTurn, draft) {
  const grace = turn.phase === 'GRACE';
  const solo = room.solo === true;
  return `
  <div class="composer${grace ? ' grace' : ''} sticky">
    <div class="spread">
      <div class="eyebrow">ASK / <b>正式提问</b></div>
      <span class="dim">${solo ? '回车发送（Shift+回车换行）· 发送后进入记录，无法撤回' : '回车发送（Shift+回车换行）· 发送后公开且不可撤回'} · 草稿只存在本机浏览器</span>
    </div>
    <textarea id="ask" enterkeyhint="send" style="margin-top:10px" placeholder="${solo ? '想好了就写下来 —— 不限时，没有人催你。回车发送。' : '随时可以打字（预输入）。回车发送，Shift+回车换行。'}">${esc(draft)}</textarea>
    ${grace && myTurn ? '<div class="notice warn hintbar">宽限期内仍有效：现在发送依然算这一轮。</div>' : ''}
    <div class="askrow">
      <button class="primary" id="btnSend" ${myTurn ? '' : 'disabled'}>${grace && myTurn ? '发送（宽限期内仍有效）' : (myTurn ? '发送' : '等待回合')}</button>
      ${room.status === 'playing' ? `<button id="btnGuessQuick" class="reason" ${room.canGuess ? '' : 'disabled'}>${guessButtonLabel(room)}</button>` : ''}
      <span class="dim">${myTurn ? '轮到你发言了' : '等待 ' + (turn.memberId ? esc(nameOf(room, turn.memberId)) + ' 发言' : '开局')}${turn.lateSubmit ? ' · 上一轮为临界提交' : ''}</span>
    </div>
    ${S.hint ? `<div class="notice hintbar">提示：${esc(S.hint)}</div>` : ''}
  </div>`;
}

/**
 * 题目块：汤面 + 所有**操作按钮**（提示 / 揭秘）都放这里。
 * 提示由 config.hintsEnabled 控制，默认关闭 —— 关闭时连按钮都不显示，只留一句说明。
 */
function puzzleCard(puzzle, room, you, fx = '') {
  const hintsOn = Boolean(room.config && room.config.hintsEnabled);
  const playing = room.status === 'playing';
  const diff = Math.max(1, Math.min(5, Number(puzzle.difficulty) || 1));
  return `
  <div class="puzzle-card${fx}">
    <div class="spread">
      <div class="eyebrow" style="color:var(--ink-600)">CASE SURFACE / <b style="color:var(--ink-900)">汤面</b></div>
      <div class="attrs">
        <span class="seal">${esc(puzzle.rating)}</span>
        <span title="难度 ${diff}/5">难度 ${diffDots(diff)}</span>
        ${puzzle.estMinutes ? `<span>约 <span class="mono">${puzzle.estMinutes}</span> 分钟</span>` : ''}
      </div>
    </div>
    <h1 class="ptitle">《${esc(puzzle.title)}》</h1>
    <div class="surface">${esc(puzzle.surface)}</div>
    ${(puzzle.tags || []).length || (puzzle.sensitiveTags || []).length ? `
    <div class="attrs" style="margin-top:12px">
      ${(puzzle.tags || []).map((t) => `<span>#${esc(t)}</span>`).join('')}
      ${(puzzle.sensitiveTags || []).map((t) => `<span class="sensitive">内容提示：${esc(t)}</span>`).join('')}
    </div>` : ''}
    ${puzzle.attribution ? `<div class="puz-src">题库来源：${esc(puzzle.attribution.author)}${puzzle.attribution.url ? ` · <a href="${esc(puzzle.attribution.url)}" target="_blank" rel="noopener noreferrer">${esc(puzzle.attribution.url)}</a>` : ''}</div>` : ''}
  </div>
  <div class="toolbar">
    <span class="eyebrow">TOOLS / 案卷工具</span>
    ${hintsOn ? `
      <button class="hintbtn t1" data-hint="1" ${you.canHintT12 ? '' : 'disabled'}><span class="t">T1</span><span class="c">轻</span></button>
      <button class="hintbtn t2" data-hint="2" ${you.canHintT12 ? '' : 'disabled'}><span class="t">T2</span><span class="c">中</span></button>
      <button class="hintbtn t3" data-hint="3" ${you.canHintT3 ? '' : 'disabled'}><span class="t">T3</span><span class="c">深</span></button>`
    : `<span class="dim">本局未开启提示（${room.solo === true ? '可在左侧「对局参数」里打开' : '房主可在左侧「对局参数」里打开'}）</span>`}
  </div>`;
}

/** 猜汤底按钮的文案：共用冷却期间显示剩余时间（由 tickUi 每 250ms 刷新） */
function guessButtonLabel(room) {
  const until = Number((room && room.guessCooldownUntil) || 0);
  const left = until ? Math.max(0, until - serverNow()) : 0;
  if (left > 0) return `猜汤底 · 共用冷却 <span data-deadline="${until}">${fmt(left)}</span>`;
  return '猜汤底（随时可猜）';
}

/** 公共记录里的一条：提问（含判定）或系统事件 */
function logEntry(t, room, you) {
  // .fx = "这条是刚出现的"：只有当它的时间戳晚于上次渲染过的最新一条时才加入场动画
  // （公开问答投影里没有全局自增序号，只有 at = 服务端写入时刻，用它做标记最稳）
  const fx = Number(t.at || 0) > Number(S.fxLogAt || 0) ? ' fx' : '';
  if (t.kind === 'question') {
    const who = t.memberName || nameOf(room, t.memberId || '');
    const mine = Boolean(t.memberId && you && t.memberId === you.memberId);
    const ans = String(t.answer || '');
    return `<div class="qa${mine ? ' mine' : ''}${fx} ${esc(ans)}">
      <div class="head"><span class="who">${esc(who)}${mine ? '（你）' : ''}</span><span>第 ${t.turnSeq} 轮 · ${fmtClock(t.at)}</span></div>
      <div class="q">${esc(t.text)}</div>
      <div class="a">主持人：<span class="verdict ${esc(ans)}">${answerLabel(t.answer)}</span>${t.reasonCode && t.reasonCode !== 'NONE' ? `<span class="dim">（${esc(t.reasonCode)}）</span>` : ''}${t.source ? sourceTag(t.source) : ''}${t.late ? '<span class="late">· 临界提交</span>' : ''}</div>
      ${t.explain ? `<span class="explain">${esc(t.explain)}</span>` : ''}
    </div>`;
  }
  const cls = t.kind === 'rejected' ? 'err' : t.kind === 'vote' ? 'vote' : 'sys';
  return `<div class="tl ${cls}${fx}">${t.memberId ? `<b>${esc(nameOf(room, t.memberId))}</b>：` : ''}${esc(t.text)}
    <div class="meta">${fmtClock(t.at)}${t.meta ? ' · ' + esc(t.meta) : ''}</div></div>`;
}

/** 对局被 AI 中断时，告诉房主"具体该改什么" */
function aiBlockHint(code) {
  switch (code) {
    case 'SCHEMA_INVALID': return '模型没有按要求的 JSON 格式回答（常见原因：模型名不匹配、输出被截断）。可换一个模型名（例如 deepseek-v4-pro）后重新提交，系统会自动重试一次。';
    case 'OUTPUT_TRUNCATED': return '模型这次输出被截断了（写到一半就到上限）。系统重试时会自动加大输出预算；仍然失败就换一个输出更短的模型。';
    case 'THINKING_ONLY': return '这个模型只回了思考过程、正文是空的 —— 多半是它默认开着「思考模式」，把输出预算吃光了。系统已自动重试并加大预算；仍失败请换一个非思考模型（例如 deepseek-flash）。';
    case 'HTTP_401': case 'AUTH_FAILED': return 'API Key 无效或已被撤销：到服务商后台重新生成后提交。';
    case 'HTTP_402': case 'QUOTA_EXHAUSTED': return '账号余额/额度不足：充值或换一个 Key。';
    case 'HTTP_429': case 'RATE_LIMITED': return '被上游限流：稍等一会儿重新提交即可。';
    case 'HTTP_404': case 'MODEL_OR_BASE_URL_NOT_FOUND': return 'Base URL 或模型名不对：DeepSeek 用 https://api.deepseek.com + deepseek-flash。';
    case 'HTTP_400': case 'INVALID_REQUEST': return '上游不接受请求参数：多半是模型名不对。';
    case 'CONNECT_TIMEOUT': case 'READ_TIMEOUT': case 'UPSTREAM_TIMEOUT': return '调用超时：检查网络/代理，或换一个上游地址。';
    case 'LEAK_DETECTED': return '模型输出里含有汤底片段，已被安全机制拦截（不会展示给玩家）。换一个模型名通常可以避免。';
    case 'PROVIDER_REFUSAL': return '上游因内容策略拒绝了这次判定。换一个模型名试试。';
    default: return '点「更新 API Key 并继续对局」重新做一次连接测试并提交，通过后会自动解除暂停。';
  }
}

/** 房主看到的候选题：优先用「换一批」的结果（只在当前等待阶段有效），否则用服务端给的那一批 */
function pickCandidates(v) {
  if (S.pickPool && S.pickPool.length > 0) return S.pickPool;
  return (v && v.candidates) || [];
}

/**
 * 全员讨论区（设计稿 §12）：房间内自由发言，**不参与判定**
 * —— 不进 AI 主持人、不占回合、不进判定缓存、不加线索、不触发猜汤底。
 * 谁都能发（含旁观者与待入席者）；限长 500 字、独立限流（10 秒 5 条）。
 *
 * 位置：桌面端在右栏「讨论」页签里；窄屏时整块卡片排在**公共记录下面**并在流程里内联展开
 * （不再做全屏面板 —— 之前那个面板既要点提问区的按钮、又会把页面卡住）。
 * 发送按钮就在便笺栏自己的输入框旁边，提问区里不再放讨论入口。
 */
function chatCard(room, you, bare = false) {
  const draftLen = String(S.chatDraft || '').length;
  return `
  <div class="chatcard${bare ? ' bare' : ' card'}">
    ${bare ? `<div class="spread" style="margin-bottom:8px"><span class="chat-hint dim">便笺只贴在桌边：不进判定、不占回合</span><span id="chatPill">${chatPillHtml()}</span></div>`
      : `<div class="spread" style="margin-bottom:10px">
      <h3 style="margin:0">NOTES / 全员讨论 <span class="dim" id="chatCount">${S.chat.length} 条</span></h3>
      <span id="chatPill">${chatPillHtml()}</span>
    </div>
    <div class="dim chat-hint" style="margin-bottom:8px">房号 ${esc(room.code)} · 只用来商量怎么问、怎么推理。这里说的话不会进判定，也不占提问回合。</div>`}
    <div class="chat" id="chatLog">
      ${chatListHtml()}
    </div>
    <div class="row" style="margin-top:9px;align-items:flex-end">
      <input id="chatInput" maxlength="${CHAT_MAXLEN}" autocomplete="off" spellcheck="false" enterkeyhint="send" placeholder="发消息…（回车发送）" value="${esc(S.chatDraft || '')}">
      <button class="note" id="btnChatSend" ${String(S.chatDraft || '').trim() ? '' : 'disabled'}>贴上</button>
      <span class="counter">${draftLen}/${CHAT_MAXLEN}</span>
    </div>
  </div>`;
}

function chatEntry(m, meId) {
  const mine = m.memberId === meId;
  /**
   * 入场动画只给**别人**的便笺，而且只播一次。
   *
   * 为什么自己发的不做动画：自己那条会在同一个 tick 里被渲染两次
   * （先本地乐观条目，紧接着服务端响应又触发一次整页渲染），
   * 只要它带 .fx 就会重建一次节点、重播一次动画 —— 用户看到的就是"自己发的字在闪"。
   * 直接不给自己的便笺加动画，等于从规则上杜绝这一整类闪烁：
   * 话是立刻出现的（本来也不需要"贴进来"的动效）。
   */
  const fx = !mine && !chatFxSeen.has(chatFxKey(m)) ? ' fx' : '';
  return `<div class="msg${mine ? ' mine' : ''}${fx}">
    <div class="who">${mine ? '你' : esc(m.memberName || '—')}<span class="dim"> ${esc(fmtClock(m.createdAt))}</span></div>
    <div class="txt">${esc(m.text)}</div>
  </div>`;
}

/** 还没准备的"有资格"人数（离线/旁观/房主不阻塞开局）；房主据此决定是否二次确认 */
function startBlockedBy(room) {
  if (!room) return 0;
  return Math.max(0, (room.readyEligible || 0) - (room.readyCount || 0));
}

/**
 * 「待入席」卡片：只有**对局进行中进房**的人会看到。
 * 他此刻不占轮转、也不占玩家位：可以先旁观，点「申请下一轮上桌」后，
 * 到轮次跨轮那一刻才被转正进轮转（不会抢掉老成员本轮的提问机会）。
 */
function pendingSeatCard(room, you) {
  const me = room.members.find((m) => m.id === you.memberId);
  if (!me || me.pendingSeat !== true) return '';
  const asked = me.seatRequested === true;
  const cfg = room.config || {};
  const perTurn = Number(cfg.perTurnSec || 60);
  const players = room.members.filter((m) => m.role !== 'spectator').length || 1;
  const etaMin = Math.max(1, Math.round((perTurn * players) / 60));
  return `
  <div class="card waitcard">
    <div class="spread"><h3 style="margin:0">待入席 <span class="dim">本局已经开始</span></h3>
      <span class="pill ${asked ? 'live' : 'l2'}">${asked ? '已申请上桌' : '旁观中'}</span></div>
    <div class="dim">这一局在你进来之前就开始了，所以你先排队：现在能看全部公开信息、不占用提问顺序。
      ${asked
        ? `等本局走到下一轮（约 ${etaMin} 分钟）就轮到你，届时你会被正式排进轮转。`
        : `想加入就点下面的按钮——会从**下一轮**起排进轮转，不会抢掉别人的提问机会。`}</div>
    <div class="row" style="margin-top:10px">
      <button class="${asked ? '' : 'primary'}" id="btnSeat">${asked ? '取消申请（继续旁观）' : '申请下一轮上桌'}</button>
      <span class="dim">${asked ? '取消后本局不再插入你' : '不申请就一直旁观，不影响对局'}</span>
    </div>
  </div>`;
}

/** 还没举手的人（用来在确认框里**点名**，而不是只说"还有 N 人"） */
function notReadyNames(room) {
  if (!room) return [];
  return room.members
    .filter((m) => m.role !== 'spectator' && m.conn === 'connected' && !m.isHost && !m.ready)
    .map((m) => m.name);
}

/**
 * 开局：有人在没准备时**先点名确认**，确认后带 force 强制开局。
 *
 * 以前「选这道」/「投票选汤」这两条路根本没走这里（一个提前 return、一个直接请求），
 * 于是服务端必然回 NOT_ALL_READY，提示写着"或确认后强制开局"却没有确认框 ——
 * 房主只能改用另一个按钮，而那个按钮是**随机抽题**，反而丢了选题能力（真实缺陷 S1）。
 */
function requestStart(mode, puzzleId) {
  const missing = notReadyNames(S.view ? S.view.room : null);
  if (missing.length > 0) {
    if (!confirm(`${missing.join('、')} 还没点「我准备好了」。仍然开局？`)) return;
  }
  request({ t: 'start', mode, ...(puzzleId ? { puzzleId } : {}), ...(missing.length > 0 ? { force: true } : {}) });
}

/**
 * 「AI 创作」卡片（仅房主、且只有开局前）。
 *
 * 流程：点「生成新题」→ 服务端让模型写整道题（汤面/汤底/事实点表）→
 * **统一坏题检测**（关键事实点是否泄露在汤面里、结构、长度、违禁词…）→
 * 通过后存为本房间的自定义题目 → 房主看着预览决定「就用这道开局」或「重新生成」。
 * 不通过就把具体问题列给房主看（不会静默失败）。
 */
function aiPuzzleCard(room, you) {
  const st = S.aiPuzzle;
  const canUse = Boolean(st && st.puzzleId) && room.status === 'waiting';
  const model = (S.drafts.keyModel ?? defaultModel());
  return `
  <div class="card aicard">
    <div class="spread" style="margin-bottom:10px">
      <h3 style="margin:0">AI 创作 <span class="dim">房主专用</span></h3>
      <span class="pill accent">${esc(model)}</span>
    </div>
    <div class="dim" style="margin-bottom:10px">
      让模型按当前题目分级（${esc(room.config.ratingMax)}）与难度区间（${room.config.difficultyMin}–${room.config.difficultyMax}）现写一道新题。
      生成后会先过一遍坏题检测：汤面不得泄露关键事实点、事实点结构要能判定、不得含违禁内容 —— 不通过会直接告诉你哪里不合格。
      生成的题只属于本房间，不会进公共题库。
    </div>
    <div class="row">
      <button class="primary" id="btnAiPuzzle" ${st && st.pending ? 'disabled' : ''}>${st && st.pending ? '模型正在出题…' : (st && st.puzzleId ? '重新生成一道' : '生成新题')}</button>
      ${canUse ? `<button id="btnAiStart">就用这道开局</button>` : ''}
      ${st && st.error ? `<span class="pill l3">${esc(st.error)}</span>` : ''}
    </div>
    ${st && st.issues && st.issues.length ? `
      <div class="err" style="margin-top:12px">${st.issues.some((i) => i.path === 'model') ? '模型这次没能出题' : '这题没通过坏题检测'}（已作废，不会入库）：<br>
        ${st.issues.slice(0, 6).map((i) => `· ${esc(i.path)}：${esc(i.reason)}`).join('<br>')}
        ${st.issues.some((i) => i.path === 'model') ? '<br><span class="dim">再点一次「生成新题」通常就好；连续失败可换 deepseek-chat 试试。</span>' : ''}</div>` : ''}
    ${st && st.puzzleId ? `
      <div class="puzzle" style="margin-top:12px">
        <div class="spread"><div class="ptitle">《${esc(st.title)}》</div><span class="pill live">已通过检测</span></div>
        <div class="surface">${esc(st.surface)}</div>
        ${st.warnings && st.warnings.length ? `<div class="dim" style="margin-top:8px">提示：${st.warnings.map((w) => esc(w)).join('；')}</div>` : ''}
      </div>` : ''}
  </div>`;
}

/** 房主 Key 掩码（没有则返回 null） */function hostKeyMask(room) {
  const h = room.members.find((m) => m.isHost);
  return h && h.keyMask ? h.keyMask : null;
}

/** 难度刻度：五格细竖线（§2.10 用短竖刻度而不是圆点，也不用彩色胶囊） */
function diffDots(n) {
  const v = Math.max(1, Math.min(5, Number(n) || 1));
  const cell = (on) => `<i style="display:inline-block;width:3px;height:11px;background:${on ? 'currentColor' : 'rgba(32,37,38,.22)'};margin:0 1px"></i>`;
  return `<span class="diffs" title="难度 ${v}/5" aria-label="难度 ${v} / 5">${cell(true).repeat(v)}${cell(false).repeat(5 - v)}</span>`;
}

/** 判定来源 → 人话标签（透明化：让玩家知道这条是谁给的） */
function sourceTag(source) {
  const map = { model: ['模型判定', 'accent'], cache: ['判定缓存', ''], rule: ['规则拦截', 'l2'] };
  const [label, cls] = map[String(source)] ?? [String(source || '未知'), ''];
  return `<span class="pill ${cls}" title="判定来源">${esc(label)}</span>`;
}

/**
 * 统计条（参考同类产品，但这里的分母来自服务端的**必需事实点计数**）：
 *   提问数 · 线索 X/Y · 提示用量 · 探索度
 * 探索度 = 已解锁事实点 / 必需事实点，达到 100% 通常意味着可以揭秘了。
 */
function statStrip(room, you) {
  const asked = S.questions.length;
  const clue = room.revealedFacts ? room.revealedFacts.length : 0;
  const total = room.factTotal || 0;
  const need = room.requiredFactTotal || 0;
  const pct = need > 0 ? Math.min(100, Math.round((clue / need) * 100)) : 0;
  const hintsOn = Boolean(room.config && room.config.hintsEnabled);
  return `
  <div class="stats">
    <div class="stat"><div class="v">${asked}</div><div class="l">提问</div></div>
    <div class="stat"><div class="v">${clue}<span class="dim">/${total}</span></div><div class="l">线索</div></div>
    <div class="stat"><div class="v">${hintsOn ? '开' : '关'}</div><div class="l">提示</div></div>
    <div class="stat grow">
      <div class="spread" style="margin-bottom:5px"><span class="l">探索度</span><span class="v" style="font-size:13px">${pct}%</span></div>
      <div class="meter"><i style="width:${pct}%"></i></div>
      <div class="dim" style="margin-top:4px">已拼出 ${clue} 条事实点${need ? ` · 关键 ${Math.min(clue, need)}/${need}` : ''}</div>
    </div>
  </div>`;
}

/**
 * 「汤主」状态条：现在到底是谁在回答？（借鉴同类产品的"XX 汤主在值班"，
 * 但这里把它和**额度来源**合并显示，因为我们的判定引擎取决于凭据而不是一个人格）。
 */
function engineBar(room, you) {
  const blocked = room.ai.state === 'BLOCKED';
  const usingHost = room.credit.mode === 'host_key';
  const mask = hostKeyMask(room);
  const platform = Boolean(S.config && S.config.realModelEnabled);
  let who, tag, note;
  if (blocked) {
    who = '汤主罢工了'; tag = 'l3'; note = `AI 服务异常（${room.ai.reasonCode || '未知'}），对局已暂停`;
  } else if (usingHost && mask) {
    who = 'AI 汤主（房主自备 Key）'; tag = 'accent'; note = `凭据 ${mask} · 调用失败不会自动改用平台额度`;
  } else if (platform) {
    who = 'AI 汤主（平台备用额度）'; tag = 'accent'; note = '由站点额度提供，受月度上限约束';
  } else {
    who = '关键词汤主（内置模拟）'; tag = 'l2'; note = '只认题库里写过的说法，理解不了自然语言改写';
  }
  return `
  <div class="engine">
    <span class="dot ${blocked ? 'off' : 'active'}"></span>
    <b>${esc(who)}</b>
    <span class="pill ${tag}">${blocked ? '已暂停' : '在值班'}</span>
    <span class="dim">${esc(note)}</span>
    ${you.isHost && !blocked ? `<button id="btnKey" class="ghost" style="margin-left:auto">${mask ? '更换 / 撤销 Key' : '接通 AI 汤主'}</button>` : ''}
  </div>`;
}

/** 房间邀请：房号 + 可分享链接（链接里带 ?code=，朋友点开自动填好） */
function inviteText(room) {
  const url = `${location.origin}/?code=${encodeURIComponent(room.code)}`;
  return { url, text: `来玩 AI 海龟汤，房号 ${room.code}\n${url}` };
}

/** 成员名字首字（中文取第一个字，英文取首字母大写） */
function initialOf(name) {
  const s = String(name ?? '?').trim();
  return s ? s.slice(0, 1).toUpperCase() : '?';
}

/** 按名字生成稳定的头像色相，让同一个人在任何设备上颜色一致 */
function hueOf(name) {
  let h = 0;
  for (const ch of String(name ?? '')) h = (h * 31 + ch.codePointAt(0)) % 360;
  return h;
}

/** 钥匙图标：房主实心、原房主空心（§2.14），单色线性 */
function keySvg(solid) {
  return `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" style="width:12px;height:12px;vertical-align:-1px">
    <circle cx="5" cy="5" r="2.6" ${solid ? 'fill="currentColor"' : ''}/><path d="M6.9 6.9 13 13M10.6 10.6l-1.4 1.4M12.2 12.2l-1.4 1.4"/>
  </svg>`;
}

/**
 * 当前回合：机械计时牌（§2.9）。
 * 倒计时只由 tickUi() 每 250ms 改写文本与刻度，**不触发整页重渲染**；
 * 等待阶段同一块牌子切换成「落座记录」（准备人数 + 准备按钮）。
 */
function speakerPanel(room, you, turn, counting, left, deadline, total, pct, phaseLabel) {
  const solo = room.solo === true;
  const current = turn.memberId ? room.members.find((m) => m.id === turn.memberId) : null;
  const isMe = Boolean(current && current.id === you.memberId);
  const urgent = counting && left <= 5000;
  const me = room.members.find((m) => m.id === you.memberId);
  const iAmReady = Boolean(me && me.ready);
  const eligible = room.readyEligible || 0;
  const readyCount = room.readyCount || 0;
  const allReady = eligible > 0 && readyCount >= eligible;
  const waiting = room.status === 'waiting';
  const TICKS = 24;
  // 单人模式：没有轮转也没有计时 —— 计时牌换成"你自己慢慢想"的说明（仍然保留当前进度）
  if (solo) {
    return `
  <div class="speakerbox head${room.status === 'playing' ? ' myturn' : ''}">
    <div class="spread">
      <div class="eyebrow">SOLO / <b>单人推理</b></div>
      <span class="mono dim">${waiting ? '未开局' : `第 ${room.roundNo} 轮 · 第 ${turn.seq} 问`}</span>
    </div>
    <div class="top">
      <div class="avatar me">${esc(initialOf(you.name || '我'))}</div>
      <div class="grow">
        <div class="nm">${esc(you.name || '我')} · 你</div>
        <div class="who">${waiting ? '挑一道题开始' : '想好就问 —— 不限时，没有回合压力'}</div>
      </div>
      <div style="text-align:right">
        <div class="timer" style="color:var(--text-muted)">不限时</div><div class="meta">单人模式</div>
      </div>
    </div>
    ${waiting ? `
      <div class="hr" style="margin:2px 0"></div>
      <div class="spread">
        <span class="eyebrow">SOLO / 自己推</span>
        <span class="seal">无需举手</span>
      </div>
      <div class="dim">单人模式不用等别人、也不用举手：选一道题就能开始。判定、提示、猜汤底、复盘都在。</div>
    ` : ''}
  </div>`;
  }
  return `
  <div class="speakerbox head${isMe ? ' myturn' : ''}">
    <div class="spread">
      <div class="eyebrow">TURN / <b>当前回合</b></div>
      <span class="mono dim">${waiting ? '未开局' : `第 ${room.roundNo} 轮 · 第 ${turn.seq} 问`}</span>
    </div>
    <div class="top">
      <div class="avatar${isMe ? ' me' : ''}">${current ? esc(initialOf(current.name)) : '·'}</div>
      <div class="grow">
        <div class="nm">${current ? esc(current.name) + (isMe ? ' · 你' : '') : (waiting ? '等待开局' : '没有人在发言')}</div>
        <div class="who">${current ? esc(phaseLabel) : (waiting ? '房主选好题目后开始' : '—')}</div>
      </div>
      <div style="text-align:right">
        ${counting
          ? `<div class="timer${urgent ? ' danger' : ''}" id="tickLeft" data-deadline="${deadline}">${fmt(left)}</div><div class="meta">剩余</div>`
          : '<div class="timer" style="color:var(--text-muted)">--:--</div><div class="meta">未计时</div>'}
      </div>
    </div>
    ${counting ? `<div class="ticks${urgent ? ' danger' : ''}" data-ticks data-deadline="${deadline}" data-total="${total}" aria-hidden="true">${'<i></i>'.repeat(TICKS)}</div>` : ''}
    ${waiting ? `
      <div class="hr" style="margin:2px 0"></div>
      <div class="spread">
        <span class="eyebrow">SEATS / 落座记录</span>
        <span class="seal${allReady && eligible ? ' yes' : ''}">已准备 ${readyCount}/${eligible}</span>
      </div>
      ${you.isHost
        ? '<div class="dim">你是房主：不用举手。等大家准备好，或在点名确认后强制开局。</div>'
        : `<div class="row">
             <button class="${iAmReady ? '' : 'primary'}" id="btnReady">${iAmReady ? '已准备（点一下收回）' : '我准备好了'}</button>
             <span class="dim">${eligible === 0 ? '房间只有你一个人，开局由房主决定' : allReady ? '全员已准备，等房主开局' : `还有 ${Math.max(0, eligible - readyCount)} 人没准备（离线/旁观不算数）`}</span>
           </div>`}
    ` : ''}
  </div>`;
}

/**
 * 在桌成员名册（§2.14）：行分隔线、方形姓名牌、身份纸签、状态小圆点、当前发言刻度线。
 * 「移出」藏在行尾的更多操作里，展开后才出现（避免误触）。
 */
function crewPanel(room, you, turn) {
  const eligible = room.readyEligible || 0;
  const readyCount = room.readyCount || 0;
  const allReady = eligible > 0 && readyCount >= eligible;
  return `
  <div class="spread" style="margin-bottom:8px">
    <span class="mono dim">已准备 ${readyCount}/${eligible}${allReady && eligible ? ' · 可以开局' : ''}</span>
    <span class="dim">${room.members.length} 人</span>
  </div>
  <div class="memlist" style="border:0;padding:0;background:transparent">
    ${room.members.map((m) => {
      const active = turn.memberId === m.id;
      const away = m.conn === 'disconnected' || m.activity === 'idle';
      const kickable = you.isHost && m.id !== you.memberId;
      const state = m.conn === 'disconnected' ? 'off' : m.activity === 'idle' ? 'away' : 'live';
      return `
      <div class="playercard${active ? ' speaking' : ''}${away && !active ? ' away' : ''}">
        <div class="avatar" style="--h:${hueOf(m.name)}">${esc(initialOf(m.name))}<span class="dot ${state}"></span></div>
        <div class="grow">
          <div class="nm">
            ${esc(m.name)}${m.id === you.memberId ? '<span class="dim">（你）</span>' : ''}
            ${m.isHost ? `<span class="slip brass">${keySvg(true)}房主</span>` : ''}
            ${m.formerHost ? `<span class="slip dim">${keySvg(false)}原房主</span>` : ''}
            ${m.pendingSeat === true ? `<span class="slip dim">待入席${m.seatRequested ? ' · 已申请' : ''}</span>` : ''}
          </div>
          <div class="meta">
            <span>${esc(m.stateLabel)}</span>
            <span class="mono">${m.score} 分</span>
            ${active ? '<span class="seal brass">发言中</span>' : ''}
            ${m.keyState === 'suspended' ? '<span class="seal unknown">Key 挂起</span>' : ''}
            ${m.isHost ? ''
              : m.pendingSeat === true ? ''
              : m.role === 'spectator' ? '<span class="seal">旁观</span>'
              : m.ready ? '<span class="seal yes">已准备</span>' : '<span class="seal">未准备</span>'}
          </div>
        </div>
        ${kickable ? `
        <details class="more">
          <summary class="morebtn" title="更多操作">更多</summary>
          <button class="danger" data-kick="${esc(m.id)}">移出房间</button>
        </details>` : ''}
      </div>`;
    }).join('')}
  </div>
  <div class="dim" style="margin-top:8px">挂机只跳过其回合、不移交房主；断连才触发移交。被移出的成员会立刻失效，需要重新加入。</div>`;
}

/** 公共记录：**只放记录**（操作按钮都在题目卡片里） */
function recordsCard(room, you) {
  return `
  <div class="card records">
    <div class="spread" style="margin-bottom:12px">
      <h3 style="margin:0">公共记录 <span class="dim">${S.log.length} 条 · 全员共享</span></h3>
      <span class="pill">按时间排列</span>
    </div>
    <div class="log" id="log">
      ${S.log.map((t) => logEntry(t, room, you)).join('') || '<div class="empty">还没有记录 —— 轮到你时提第一个问题吧。</div>'}
    </div>
    <div class="dim" style="margin-top:10px">所有人的提问与主持人判定都在这里；自己的提问左侧有紫色标记。
      提问一发出即公开、无法撤回；草稿框里的内容在发送前只有你自己能看到。</div>
  </div>`;
}

function banners(room, you) {
  const out = [];
  // 服务端没有平台额度时：房主自备 Key 就是唯一的真实模型来源，直接给出入口
  const hostMember = room.members.find((m) => m.isHost);
  if (!(S.config && S.config.realModelEnabled) && (S.config ? S.config.vaultEnabled : true)
      && you.isHost && hostMember && !hostMember.keyMask) {
    out.push(`<div class="notice">服务端没有配置模型额度：当前判定由<b>内置模拟主持人</b>给出（能玩，但不理解自然语言）。
      填上你自己的 API Key（默认 DeepSeek）后，判定就会走真实模型。
      <div class="row" style="margin-top:6px"><button class="primary" id="btnKeyFromBanner">填写我的 API Key</button></div></div>`);
  }
  if (room.ai.state === 'BLOCKED') {
    out.push(`<div class="notice">AI 服务异常（${esc(room.ai.reasonCode || '')}）：对局已暂停，等待房主处理。<b>本轮未消耗，且不会自动切换到平台额度。</b>
      <br><span class="dim">${esc(aiBlockHint(room.ai.reasonCode))}</span>
      ${you.isHost ? '<div class="row" style="margin-top:6px"><button id="btnFixKey">更新 API Key 并继续对局</button><button id="btnRevokeKey">撤销并改用平台额度</button></div>' : ''}</div>`);
  }
  if (room.vote && room.vote.type === 'fallback_credit' && room.vote.status === 'open') {
    out.push(`<div class="notice">投票：是否临时启用平台备用额度继续对局？已投 ${room.vote.votedCount} / ${room.vote.eligibleCount}，剩余 <span data-deadline="${room.vote.deadlineAt}">${fmt(room.vote.deadlineAt - serverNow())}</span>
      <div class="row" style="margin-top:6px"><button data-vote="yes">赞成</button><button data-vote="no">反对</button><button data-vote="abstain">弃权</button></div>
      <div class="dim">门槛：有效人数 ≥ 2 且赞成票过半；挂机 / 离线成员的表决不被受理</div></div>`);
  }
  if (room.vote && room.vote.type === 'puzzle_choice' && room.vote.status === 'open') {
    out.push(`<div class="card"><h3>投票选汤（已投 ${room.vote.votedCount} / ${room.vote.eligibleCount}，剩余 <span data-deadline="${room.vote.deadlineAt}">${fmt(room.vote.deadlineAt - serverNow())}</span>）</h3>
      <div class="cands">${(room.vote.candidates || []).map((c) => `
        <div class="cand">
          <div class="row"><span class="pill ${c.rating.toLowerCase()}">${esc(c.rating)}</span><span class="pill">难度 ${c.difficulty}</span><span class="pill">约 ${c.estMinutes} 分钟</span></div>
          <div>${esc(c.surface)}</div>
          <div class="row">${c.tags.map((t) => `<span class="pill">${esc(t)}</span>`).join('')}${c.sensitiveTags.map((t) => `<span class="pill l3">含：${esc(t)}</span>`).join('')}</div>
          <button data-votepuzzle="${esc(c.id)}" ${room.vote.myBallot ? 'disabled' : ''}>投给这道</button>
        </div>`).join('')}</div></div>`);
  }
  if (room.vote && room.vote.status !== 'open' && room.vote.result) out.push(`<div class="notice">投票已结束：${esc(room.vote.result)}</div>`);
  if (room.transfer.state === 'paused_for_resume') {
    out.push(`<div class="notice">房主变更完成，本轮已作废（不计入跳过次数）。等待新房主开始下一轮。
      ${you.isHost ? '<div class="row" style="margin-top:6px"><button class="primary" id="btnResumeTurn">继续对局</button></div>' : ''}</div>`);
  }
  const former = room.members.find((m) => m.formerHost);
  if (former && you.isHost) {
    out.push(`<div class="notice">${esc(former.name)} 已回来（现为普通成员）。是否归还房主位？
      <div class="row" style="margin-top:6px"><button id="btnReturnHost">归还</button><button id="btnDeclineReturn" class="danger">不归还（销毁其挂起 Key）</button></div></div>`);
  }
  if (you.isHost && room.members.find((m) => m.isHost) && room.members.find((m) => m.isHost).keyState === 'suspended' && !former) {
    out.push(`<div class="notice">你的 API Key 处于挂起状态：是否重新启用？
      <div class="row" style="margin-top:6px"><button data-reenable="yes">是（复测并切回自备额度）</button><button data-reenable="no">否（销毁 Key）</button></div></div>`);
  }
  return out.join('');
}

/** 把上面这些提示包成一块：手机上它们排在记录之后（次要信息），不抢题目和输入框的位置 */
function bannersBox(room, you) {

}

function nameOf(room, id) { const m = room.members.find((x) => x.id === id); return m ? m.name : '—'; }
function answerLabel(a) { return { yes: '是', no: '否', partial: '部分接近', irrelevant: '无关', unanswerable: '无法回答' }[a] || a; }

function cfgModal(room) {
  const c = room.config;
  const solo = room.solo === true;
  // 草稿优先：用户在弹窗里改过的值即使被重渲染也要留住（这些控件没有 id，走 cfg: 前缀）
  const cur = (k) => (S.drafts[`cfg:${k}`] !== undefined ? S.drafts[`cfg:${k}`] : c[k]);
  const row = (k, label, min, max, hint) => `
    <div class="fieldrow">
      <span class="lab">${label}</span>
      <input type="number" class="mono" data-cfg="${k}" value="${cur(k)}" min="${min}" max="${max}" aria-label="${label}">
      ${hint ? `<span class="hint">${hint}</span>` : ''}
    </div>`;
  const sel = (k, label, options, hint) => `
    <div class="fieldrow">
      <span class="lab">${label}</span>
      <select data-cfg="${k}" aria-label="${label}">

    <div class="fieldrow">
      <label class="switch"><input type="checkbox" data-cfg="${k}" ${cur(k) ? 'checked' : ''}><span class="track"></span><span class="lab">${label}</span></label>
      ${hint ? `<span class="hint">${hint}</span>` : ''}

  return modalShell('SETTINGS / 01', '对局参数', `
    <p class="dim">${solo
      ? `单人模式：没有回合倒计时，所以时长 / 宽限 / 超时跳过这几项不适用（已隐藏）；次数与上限类只允许增大（防止追溯性剥夺）；题目与评分口径整局锁定。当前 config_version ${room.configVersion}。`
      : `开局后：时长 / 宽限 / 冷却类下一回合生效；次数与上限类只允许增大（防止追溯性剥夺）；题目与评分口径整局锁定。当前 config_version ${room.configVersion}。`}</p>
    <div class="fieldgroup"><h4>01 · 回合</h4>
      ${solo ? '' : `${row('perTurnSec', '每人提问时长（秒）', 15, 600)}
      ${row('graceSec', '超时宽限（秒）', 0, 30)}
      ${sel('turnOrderMode', '提问顺序（下一局生效）', [['join', '顺序（按加入顺序，默认）'], ['random', '乱序（开局洗一次牌）']], '乱序是开局时打乱一次，整局按这个顺序轮转；改了要等下一局开局才生效。')}`}
      ${solo
        ? row('maxRounds', '本局提问次数上限', 1, 60, '单人模式里"一轮"就是"一问"；到上限这一局就结束（想继续可以「再来一道」）。')
        : row('maxRounds', '总回合上限（轮）', 1, 60)}
      ${solo ? '' : `${sw('timeoutSkip', '超时自动跳过')}
      ${sw('idleSkip', '跳过挂机成员的回合')}`}
    </div>
    <div class="fieldgroup"><h4>02 · 猜汤底</h4>
      ${row('guessEveryRounds', '揭秘间隔（每 N 轮）', 1, 10)}
      ${row('guessMaxPerMember', solo ? '本局揭秘次数（0 = 不限）' : '每人揭秘次数（0 = 不限）', 0, 10)}
      ${row('guessCooldownSec', solo ? '猜底冷却（秒，0 = 不限）' : '全桌共用冷却（秒，0 = 不限）', 0, 1800, solo ? '猜一次就重新计时；冷却期间不能再猜。' : '任何人猜一次都会重新计时；冷却期间全桌都不能再猜。')}
    </div>
    <div class="fieldgroup"><h4>03 · 提示</h4>
      ${sw('hintsEnabled', '开启提示系统', '默认关闭；关闭时任何人都拿不到提示。')}
      ${row('hintQuotaPerMember', '每人提示次数（T1+T2）', 0, 10)}
      ${row('hintTier3Max', 'T3 提示（每局共享）', 0, 3)}
      ${row('hintCooldownSec', '提示冷却（秒）', 0, 600)}
    </div>
    <div class="fieldgroup"><h4>04 · 选题与进房</h4>
      ${row('candidateCount', '候选题数量', 1, 5)}
      ${solo ? '' : `${row('voteDurationSec', '投票时长（秒）', 30, 600)}
      ${sel('midJoinPolicy', '对局中进房的人', [['seated_next_round', '排队待入席（默认）：申请后从下一轮起上桌'], ['spectator_only', '只能旁观（本局不接受上桌）'], ['reject', '拒绝加入（等下一局）']])}
      ${row('maxPendingSeats', '待入席排队上限（人）', 0, 10)}`}
    </div>`,
    `<button id="btnCfgClose">关闭</button>
     <span class="row"><button class="primary" id="btnCfgApply">应用参数</button></span>`);

/**
 * 弹窗外壳（§2.26）：遮罩纯黑 68%、深色实底、章节编号、底部操作栏固定（主操作在右、关闭在左）。
 * role/aria-modal 让读屏器知道这是对话框；Esc 关闭与焦点回收在 keydown 里统一处理。
 */
function modalShell(chapter, title, body, foot, extraClass = '') {
  return `<div class="overlay"><div class="modal${extraClass ? ' ' + extraClass : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="chapter"><span class="no">${esc(chapter)}</span><h3>${esc(title)}</h3></div>
    ${body}
    ${foot ? `<div class="foot">${foot}</div>` : ''}
  </div></div>`;
}

function guessModal() {
  const text = S.drafts.guessText ?? '';
  const room = S.view ? S.view.room : null;
  const cdLeft = room && room.guessCooldownUntil ? Math.max(0, room.guessCooldownUntil - serverNow()) : 0;
  const cdSec = room && room.config ? room.config.guessCooldownSec : 0;
  const cooling = cdLeft > 0;
  const solo = Boolean(room && room.solo === true);
  return modalShell('FINAL THEORY / 结案推理', '猜汤底', `
    <p class="dim">判定尺度：关键事实点全部命中 + 表达出因果链 = <b>命中</b>；命中 ≥ 60% = <b>接近</b>（只回数量，不告诉你命中了哪几条）；否则未命中。</p>
    <p class="dim">猜汤底${solo ? '有一个冷却' : '是<b>所有人共用一个冷却</b>'}<span class="mono">${cdSec > 0 ? `（当前设置 ${cdSec} 秒）` : '（当前设置：不限）'}</span>：
      ${solo ? '猜一次就开始计时，冷却期间不能再猜。' : '谁先猜谁开始计时，冷却期间房间里谁都不能再猜。'}${cooling ? `现在还剩 <b class="mono" data-deadline="${room.guessCooldownUntil}">${fmt(cdLeft)}</b>。` : ''}</p>
    <div class="papernote" style="margin-top:12px">
      <div class="eyebrow" style="color:var(--ink-600);margin-bottom:6px">STATEMENT / 结案陈词</div>
      <textarea id="guessText" autocomplete="off" spellcheck="false" placeholder="用几句话说明：发生了什么、为什么会这样（回车换行，Ctrl/Cmd+回车提交）">${esc(text)}</textarea>
    </div>`,
    `<button id="btnGuessCancel">返回</button>
     <span class="row">${cooling ? `<span class="mono dim">冷却中 <b data-deadline="${room.guessCooldownUntil}">${fmt(cdLeft)}</b></span>` : ''}
     <button class="reason${cooling ? '' : ' solid'}" id="btnGuessSubmit" ${cooling ? 'disabled' : ''}>提交推理 · 揭晓</button></span>`);
}

/** 默认提供方（服务端 /api/config 下发，取不到就用 DeepSeek 官方端点兜底） */
function defaultBaseUrl() { return (S.config && S.config.defaultBaseUrl) || 'https://api.deepseek.com'; }
function defaultModel() { return (S.config && S.config.defaultModel) || 'deepseek-flash'; }

/**
 * 提供方预设：选了就把 Base URL / 模型名填成对应值，之后仍可手动改。
 * 「通用 OpenAI 兼容」用于自建代理、OpenRouter、月之暗面、硅基流动等任意兼容端点。
 * 注意 Base URL 的**路径会被保留**（OpenAI 必须带 /v1），服务端只在其后拼 /chat/completions。
 */
const PROVIDERS = {
  deepseek: { label: 'DeepSeek（推荐）', base: 'https://api.deepseek.com', model: 'deepseek-flash', note: '官方端点，判定用 flash 模型即可' },
  openai: { label: 'OpenAI', base: 'https://api.openai.com/v1', model: 'gpt-4o-mini', note: '注意 /v1 会保留，最终请求 …/v1/chat/completions' },
  custom: { label: '通用 OpenAI 兼容端点', base: '', model: '', note: '自建代理 / OpenRouter / 其他兼容服务，填完整 Base URL' },
};
function providerOf() { return PROVIDERS[S.keyProvider] ? S.keyProvider : 'deepseek'; }

/**
 * 房主自备 API Key。
 *
 * 注意：这个弹窗踩过两个坑，改法就写在控件属性里：
 *   · 轮询每 1.8 秒会整页重渲染 → 输入到一半的内容会被清空。
 *     现在输入值实时存进 S.drafts（只在内存里），重渲染后回填；render() 另外恢复焦点与光标位置。
 *   · 用 type="password" 会被 Edge/Chrome 当成登录表单，弹「是否保存密码」并介入填充，
 *     干扰输入（鼠标移开就可能被取消）。现在改用 type="text" + CSS 掩码（-webkit-text-security），
 *     再配上 autocomplete="off/new-password"、data-form-type="other" 等标记，彻底避开密码管理器。
 *
 * 另外：「测试连接」只验证可用性、不入库，结果直接显示成功/失败与原因（含真实请求地址与耗时）。
 */
function keyModal() {
  const base = S.drafts.keyBase ?? defaultBaseUrl();
  const model = S.drafts.keyModel ?? defaultModel();
  const key = S.drafts.keyValue ?? '';
  const vaultOff = Boolean(S.config) && S.config.vaultEnabled === false;
  return modalShell('DEVICE / 02', '房主自备 API Key', `
    ${vaultOff ? `<div class="err">服务端未配置 <code>MASTER_KEY</code>：保险箱处于关闭状态，<b>不会</b>以任何形式保存你的 Key（也绝不退化成明文存储），
      所以「连接测试并提交」暂时不可用。<br>管理员在项目目录执行一次即可启用：
      <code>npx wrangler secret put MASTER_KEY</code>（值用 32 字节随机数的 base64）。<br>
      现在你仍然可以点下面的「测试连接（不入库）」验证 Key 是否有效。</div>` : ''}
    <p class="dim">提交后服务端会先做一次连接测试：通过才加密入库并锁定生效（此后调用失败<b>不会</b>自动改用平台额度）；
      页面只显示掩码，任何人都无法回读原文。</p>
    <div class="fieldgroup"><h4>接线表</h4>
      <div class="fieldrow"><span class="lab">提供方</span>
        <select id="keyProvider" aria-label="提供方">
          ${Object.entries(PROVIDERS).map(([k, p]) => `<option value="${k}" ${providerOf() === k ? 'selected' : ''}>${esc(p.label)}</option>`).join('')}
        </select>
        <span class="hint" id="keyProviderNote">${esc(PROVIDERS[providerOf()].note)}</span>
      </div>
      <div class="fieldrow"><span class="lab">Base URL</span>
        <input id="keyBase" class="mono" name="ht-host-endpoint" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
          spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true"
          value="${esc(base)}" placeholder="https://api.deepseek.com" aria-label="Base URL">
        <span class="hint">实际请求地址（自动补 <code>/chat/completions</code>，路径会保留）：<code id="keyUrl">${esc(completionsUrl(base))}</code></span>
      </div>
      <div class="fieldrow"><span class="lab">模型名</span>
        <input id="keyModel" class="mono" name="ht-host-model" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
          spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true"
          value="${esc(model)}" placeholder="deepseek-flash" aria-label="模型名">
      </div>
      <div class="fieldrow"><span class="lab">API Key</span>
        <input id="keyValue" class="mono secret" name="ht-host-credential" type="text" autocomplete="new-password"
          autocapitalize="off" autocorrect="off" spellcheck="false" data-form-type="other"
          data-lpignore="true" data-1p-ignore="true" value="${esc(key)}" placeholder="sk-..." aria-label="API Key">
        <span class="hint">只留在本页内存里，不会写入浏览器存储；掩码由服务端下发。</span>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="btnKeyToggle">显示 / 隐藏</button>
      ${S.keyMask ? `<span class="dim">当前掩码：<span class="mask">${esc(S.keyMask)}</span></span>` : ''}
    </div>
    <div id="keyTestBox">${keyTestBox()}</div>`,
    `<button id="btnKeyClose">关闭</button>
     <span class="row">
       <button id="btnKeyTest">测试连接（不入库）</button>
       <button class="danger" id="btnKeyRevoke" ${hasOwnKey() ? '' : 'disabled'}>撤销并销毁</button>
       <button class="primary" id="btnKeySubmit" ${vaultOff ? 'disabled title="服务端未配置 MASTER_KEY"' : ''}>连接测试并提交</button>
     </span>`);
}

/** 房主是否已有一把生效中的 Key（本会话提交过，或服务端视图里带掩码）——决定「撤销并销毁」是否可点 */
function hasOwnKey() {
  if (S.keyMask) return true;
  const hostMember = S.view && S.view.room ? S.view.room.members.find((m) => m.isHost) : null;
  return Boolean(hostMember && hostMember.keyMask);
}

/** Base URL → 真实请求地址（与服务端 HostService.chatCompletionsUrl 保持一致） */
function completionsUrl(base) {
  const b = String(base ?? '').trim().replace(/\/+$/, '');
  if (!b) return '';
  return b.endsWith('/chat/completions') ? b : `${b}/chat/completions`;
}

/** 测试结果面板：成功给绿色，失败给红色 + 人话原因 + 排查提示 */
function keyTestBox() {
  const t = S.keyTest;
  if (!t) return '<div class="dim" style="margin-top:8px">点「测试连接」可以先只验证 Key 能不能用，不会入库、不会影响当前对局。</div>';
  if (t.pending) return '<div class="notice" style="margin-top:8px">正在连接上游模型服务…</div>';
  const where = `${t.url ? `<br><span class="dim">实际请求：${esc(t.url)}${t.model ? ' · 模型：' + esc(t.model) : ''}</span>` : ''}`;
  if (t.ok) {
    return `<div class="notice" style="margin-top:8px"><b class="seal yes">检测通过</b>${t.latencyMs ? `（${t.latencyMs} ms）` : ''}：${esc(t.message || '上游已正常响应')}${where}
      ${t.reasonCode === 'RATE_LIMITED_AT_SUBMIT' ? '<br><span class="dim">当前被限流：凭证有效，但对局中调用可能失败。</span>' : ''}
      ${t.stored === false ? '<br><span class="dim">本次只是测试，还没有入库。</span>' : ''}</div>`;
  }
  return `<div class="err" style="margin-top:8px"><b class="seal no">检测失败</b>：${esc(t.message || '未知错误')}
    ${t.reasonCode ? `<span class="dim">（${esc(t.reasonCode)}${t.latencyMs ? ' · ' + t.latencyMs + ' ms' : ''}）</span>` : ''}${where}
    <br>排查建议：${esc(hintForReason(t.reasonCode))}</div>`;
}

/** 把错误码翻译成"下一步该改什么" */
function hintForReason(code) {
  switch (code) {
    case 'MISSING_API_KEY': return '先把 API Key 填进第三个输入框。';
    case 'OUTPUT_TRUNCATED': return '模型输出被截断（达到 max_tokens 上限）：换一个输出更短的模型，或把问题问得更聚焦。系统重试时会自动加大预算。';
    case 'THINKING_ONLY': return '这个模型只回了思考过程、正文是空的：它默认开着思考模式，请换成非思考模型（例如 deepseek-flash）。';
    case 'AUTH_FAILED': return 'Key 无效或已被撤销：到服务商后台重新生成一个（注意别带上多余空格）。';
    case 'PERMISSION_DENIED': return '该账号无权访问这个模型：换个模型名或换账号。';
    case 'QUOTA_EXHAUSTED': return '余额/额度不足：充值或换一个 Key。';
    case 'MODEL_OR_BASE_URL_NOT_FOUND': return '模型名或 Base URL 写错了。DeepSeek 用 https://api.deepseek.com，模型名 deepseek-flash 或 deepseek-v4-pro。';
    case 'INVALID_REQUEST': return '上游不接受这个请求：基本是模型名不对（或该模型不支持当前参数）。';
    case 'RATE_LIMITED_AT_SUBMIT': return '被限流了，稍等一会儿再试；凭证本身是有效的。';
    case 'UPSTREAM_UNAVAILABLE': return '上游服务暂时不可用（5xx），稍后重试。';
    case 'UPSTREAM_TIMEOUT': return '8 秒内没响应：检查网络/代理，或换个服务商地址。';
    case 'NETWORK_ERROR': return '网络不通：确认地址是公网 https 且能访问。';
    case 'BASE_URL_INVALID':
    case 'BASE_URL_MUST_BE_HTTPS':
    case 'BASE_URL_PRIVATE_HOST':
    case 'BASE_URL_PRIVATE_ADDRESS':
    case 'BASE_URL_MUST_NOT_CONTAIN_QUERY_OR_FRAGMENT':
    case 'BASE_URL_MUST_NOT_CONTAIN_CREDENTIALS': return 'Base URL 必须是不带路径参数的 https 公网地址，例如 https://api.deepseek.com。';
    default: return '依次确认：Base URL（https://api.deepseek.com）、模型名（deepseek-flash）、API Key 三者是否对得上。';
  }
}

/**
 * 复盘（§2.21）：像一份结案档案 —— 顶部结论，汤底用暖纸，提问用正式记录格式，成员用名册表格。
 * 顶部一条固定的红色窄条提示"仅房主可见"，不占正文空间。
 */
function recapModal(recap) {
  return modalShell('CASE FILE / 结案档案', `复盘 · ${recap.puzzle.title}`, `
    <div class="redbar">仅房主可见 · 含汤底与事实点，请勿分享给将要玩这道题的人</div>
    <div class="attrs">
      <span>结果 <b>${esc(recap.result?.result || '—')}</b></span>
      <span>${esc(recap.result?.reason || '')}</span>
      <span>共 <span class="mono">${recap.questions.length}</span> 次提问</span>
    </div>
    <div class="recap">
      <h4><span class="no">01</span>汤底</h4>
      ${recap.canRevealTruth
        ? `<div class="sheet"><div class="surface">${esc(recap.truth || '')}</div></div>`
        : `<div class="notice warn">${esc(recap.truthNote || '本局不予揭晓汤底')}</div>`}
      <h4><span class="no">02</span>完整提问记录</h4>
      <table><tr><th>#</th><th>成员</th><th>提问</th><th>判定</th><th>来源</th></tr>
        ${recap.questions.map((q) => `<tr><td class="mono">${q.turnSeq}</td><td>${esc(q.memberName)}</td><td>${esc(q.text)}</td>
          <td><span class="seal ${esc(q.answer)}">${answerLabel(q.answer)}</span>${q.reasonCode && q.reasonCode !== 'NONE' ? ` <span class="dim mono">${esc(q.reasonCode)}</span>` : ''}</td>
          <td class="mono dim">${esc(q.source)}</td></tr>`).join('')}</table>
      <h4><span class="no">03</span>成员数据</h4>
      <table><tr><th>成员</th><th>得分</th><th>被跳过</th><th>揭秘次数</th></tr>
        ${recap.members.map((m) => `<tr><td>${esc(m.name)}</td><td class="mono">${m.score}</td><td class="mono">${m.skipStreak}</td><td class="mono">${m.guessesUsed}</td></tr>`).join('')}</table>
    </div>`,
    `<span class="dim">复盘不含任何 Key</span><button id="btnRecapClose">关闭</button>`);
}


/* ============================================================================
 * 交互绑定
 * ==========================================================================*/
/**
 * 讨论列表滚动（§12.7）：滚到底 → 视为已读、恢复自动跟随；往上翻 → 保持位置并显示「有 N 条新消息」。
 * 注意 scroll 事件不冒泡，必须用捕获阶段委托（列表每次重渲染都会换新节点）。
 * 只有"可见"的列表才算已读 —— 手机上面板没打开时列表是 display:none，绝不能把没看过的消息标成已读。
 */
document.addEventListener('scroll', (e) => {
  const t = e.target;
  if (!t || t.id !== 'chatLog' || t.offsetParent === null) return;
  const pinned = t.scrollHeight - t.scrollTop - t.clientHeight < 24;
  if (pinned === S.chatPinned) return;
  S.chatPinned = pinned;
  if (pinned) markChatRead();
  render();
}, true);

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[id],[data-pick],[data-hint],[data-vote],[data-votepuzzle],[data-reenable],[data-cfg],[data-preset],[data-kick]');
  if (!el) return;
  const id = el.id;
  const hintTier = el.getAttribute('data-hint');
  const vote = el.getAttribute('data-vote');
  const votePuzzle = el.getAttribute('data-votepuzzle');
  const reenable = el.getAttribute('data-reenable');
  const pickPuzzle = el.getAttribute && el.getAttribute('data-pick');
  const presetPick = el.getAttribute && el.getAttribute('data-preset');
  const kickTarget = el.getAttribute && el.getAttribute('data-kick');
  const room = S.view ? S.view.room : null;
  // 记住是哪个按钮把弹窗打开的：关闭后要把焦点还回去（§23）
  if (['btnCfg', 'btnKey', 'btnGuessQuick', 'btnRecap'].includes(id)) S.modalTriggerId = id;

  try {
    if (kickTarget && room) {
      const target = room.members.find((m) => m.id === kickTarget);
      if (target && confirm(`把「${target.name}」移出房间？他需要重新用房号加入。`)) {
        const res = await sendAction({ type: 'kick', memberId: kickTarget });
        S.notice = res ? `已把 ${target.name} 移出房间` : S.notice;
      }
      return;
    }
    if (presetPick) {
      S.preset = presetPick;
      const hidden = $('#preset'); if (hidden) hidden.value = presetPick;
      render();               // 焦点在 div 上，不是输入框，可以安全重渲染
      return;
    }
    if (hintTier) { S.error = ''; request({ t: 'hint', tier: Number(hintTier) }); return; }
    if (vote) { S.error = ''; request({ t: 'vote', choice: vote }); return; }
    if (votePuzzle) { S.error = ''; request({ t: 'vote', choice: votePuzzle }); return; }
    if (reenable) { S.error = ''; request({ t: 'reenable_key', yes: reenable === 'yes' }); return; }
    // 「选这道」：有人在没准备时要先确认，并带 force —— 否则服务端必然拒绝，
    // 提示里写着"或确认后强制开局"却根本没有确认框（S1：以前这里直接 return，
    // 把下面那个带 confirm+force 的分支变成了死代码）
    if (pickPuzzle) { S.error = ''; requestStart('pick', pickPuzzle); return; }
    switch (id) {
      case 'btnAiPuzzle': {
        S.aiPuzzle = { pending: true };
        render();
        const res = await sendAction({ type: 'create_ai_puzzle' }, { silent: true });
        if (res && res.data && res.data.puzzleId) {
          S.aiPuzzle = { ...res.data };
          S.notice = `AI 出了一道《${res.data.title}》，已通过坏题检测`;
        } else if (res) {
          S.aiPuzzle = null;
        } else {
          // sendAction 已把错误放进 S.error；这里把"坏题检测逐条原因 / 模型层失败原因"也带上
          const d = S.lastFailDetail;
          const issues = Array.isArray(d)
            ? d
            : (d && (d.issues || d.errors)) || [];
          S.aiPuzzle = { error: S.lastFailMessage || S.error || '生成失败', issues };
        }
        render();
        break;
      }
      case 'btnAiStart': {
        const st = S.aiPuzzle;
        if (!st || !st.puzzleId) break;
        requestStart('pick', st.puzzleId);
        break;
      }
      case 'btnReady': {
        const me = room ? room.members.find((m) => m.id === (S.view.you ? S.view.you.memberId : '')) : null;
        const next = !(me && me.ready);
        const res = await sendAction({ type: 'ready', ready: next });
        // 用服务端回报的真实状态（"举手"与"开局"撞在一起时可能被忽略）
        const real = res && res.data ? res.data.ready === true : next;
        S.notice = res ? (real ? '已举手：我准备好了' : '已收回准备状态') : S.notice;
        break;
      }
      case 'btnStart': requestStart('pick'); break;
      // 窄屏：打开近全屏讨论面板（桌面端这两个按钮被 CSS 隐藏，侧栏一直看得见讨论卡片）
      // 注意用 render(true)：点这两个按钮时聊天输入框通常还带着焦点，非强制渲染会被
      // isBusy() 推迟最多 700ms —— 表现就是"点了返回没反应"。
      // 「有 N 条新消息 ↓」：用户主动要求跳到底部（我们不强行拉走他）
      case 'btnChatJump': S.chatPinned = true; S.chatScrollToBottom = true; markChatRead(); render(true); break;
      // 右栏页签（§5.5）：切页签只换右侧内容，不动中央记录的滚动位置，也不清空聊天草稿
      // 右栏页签（§5.5）：切页签只换右侧内容，不动中央记录的滚动位置，也不清空聊天草稿。
      // 用 render(true)：光标常常还留在便笺输入框里，非强制渲染会被 isBusy() 一直推迟 ——
      // 表现就是"点了页签没反应"（真实踩到过）。草稿存在 S.chatDraft 里，重渲染不会丢。
      case 'btnTabCrew': S.railTab = 'crew'; render(true); break;
      case 'btnTabNotes': S.railTab = 'notes'; markChatRead(); render(true); break;
      // 顶栏「房间信息与设置」（§2.7 / §5.2）：房间元数据、额度铭牌与房主入口都收进抽屉
      case 'btnSeat': {
        // 待入席者的"举手"= 申请下一轮上桌（服务端按成员状态区分语义）
        const me = room ? room.members.find((m) => m.id === (S.view.you ? S.view.you.memberId : '')) : null;
        const asked = Boolean(me && me.seatRequested);
        const res = await sendAction({ type: 'ready', ready: !asked });
        S.notice = res ? (asked ? '已取消申请：本局继续旁观' : '已申请：本局下一轮起排进轮转') : S.notice;
        break;
      }
      case 'btnStartVote': requestStart('vote'); break;
      case 'btnCopyCode': {
        const okCopy = await copyText(room.code);
        S.notice = okCopy ? `房号 ${room.code} 已复制，发给朋友即可加入` : '复制失败，请手动选中房号复制';
        render();
        break;
      }
      case 'btnCopyInvite': {
        const inv = inviteText(room);
        const okCopy = await copyText(inv.text);
        S.notice = okCopy ? '邀请文案已复制（含可点开的房间链接）' : `复制失败，请手动分享：${inv.text}`;
        render();
        break;
      }
      case 'btnCfg': S.configModal = true; render(true); break;
      // 便笺栏自己的「贴上」按钮（讨论区在右栏页签 / 窄屏内联，都在同一张卡片里）
      case 'btnChatSend': await sendChat(); break;
      case 'btnCfgClose':
        closeWithFx(() => {
          Object.keys(S.drafts).filter((k) => k.startsWith('cfg:')).forEach((k) => delete S.drafts[k]);
          S.configModal = false; render(true);
        });
        break;
      case 'btnCfgApply': {
        const patch = {};
        document.querySelectorAll('[data-cfg]').forEach((input) => {
          const k = input.getAttribute('data-cfg');
          // 三类控件：勾选框给 boolean、下拉框给字符串（如 midJoinPolicy）、数字框给 int
          patch[k] = input.type === 'checkbox' ? input.checked
            : input.tagName === 'SELECT' ? String(input.value)
            : Number(input.value);
        });
        const res = await sendAction({ type: 'config', patch, expectedVersion: room.configVersion });
        if (res) {
          // 服务端已接受：清掉草稿，之后以服务端配置为准
          Object.keys(S.drafts).filter((k) => k.startsWith('cfg:')).forEach((k) => delete S.drafts[k]);
          S.configModal = false;
        }
        break;
      }
      case 'btnSkip': request({ t: 'skip_turn' }); break;
      case 'btnKey': S.keyModal = true; S.keyTest = null; render(); break;
      case 'btnKeyFromBanner': S.keyModal = true; S.keyTest = null; render(); break;
      case 'btnKeyClose': closeWithFx(() => { S.keyModal = false; S.keyTest = null; delete S.drafts.keyValue; render(true); }); break;
      case 'btnKeyToggle': {
        const el = $('#keyValue');
        if (el) el.classList.toggle('secret');
        break;
      }
      case 'btnKeyTest': {
        const baseUrl = ($('#keyBase').value || '').trim() || defaultBaseUrl();
        const model = ($('#keyModel').value || '').trim() || defaultModel();
        const apiKey = $('#keyValue').value;
        const provider = providerOf();
        S.keyTest = { pending: true, url: completionsUrl(baseUrl), model };
        render();
        try {
          const res = await api('/api/credentials/test', { method: 'POST', body: JSON.stringify({ apiKey, baseUrl, model, provider }) });
          S.keyTest = { ...res, url: res.url || completionsUrl(baseUrl), model: res.model || model };
        } catch (err) {
          const b = err.body || {};
          S.keyTest = {
            ok: false, reasonCode: b.error || `HTTP_${err.status || 'ERR'}`, message: b.message || err.message,
            latencyMs: b.latencyMs, url: b.url || completionsUrl(baseUrl), model: b.model || model,
          };
        }
        render();
        break;
      }
      case 'btnKeySubmit': {
        const baseUrl = ($('#keyBase').value || '').trim() || defaultBaseUrl();
        const model = ($('#keyModel').value || '').trim() || defaultModel();
        const apiKey = $('#keyValue').value;                 // 只在内存中，提交后立即清空
        const provider = providerOf();
        S.error = '';
        try {
          const res = await api('/api/credentials', { method: 'POST', body: JSON.stringify({ apiKey, baseUrl, model, provider }) });
          S.keyMask = res.credential.mask;
          S.notice = res.resumedBlockedMatch
            ? '已启用自备额度，且已解除 AI 中断 —— 对局继续'
            : '已启用自备额度（' + res.message + '）';
          S.keyTest = null;
          S.keyModal = false;
          delete S.drafts.keyValue;                          // Key 绝不留在内存里
          if ($('#keyValue')) $('#keyValue').value = '';
        } catch (err) {
          // 提交失败时把详情留在弹窗里，方便直接看到"为什么不成"
          const b = err.body || {};
          S.error = err.message;
          S.keyTest = {
            ok: false, reasonCode: b.error || `HTTP_${err.status || 'ERR'}`, message: b.message || err.message,
            latencyMs: b.latencyMs, url: b.url || completionsUrl(baseUrl), model: b.model || model,
          };
        }
        render();
        break;
      }
      case 'btnKeyRevoke': await api('/api/credentials', { method: 'DELETE' }); S.keyMask = null; S.keyModal = false; S.keyTest = null; delete S.drafts.keyValue; S.notice = '已撤销并销毁 Key，改用平台备用额度'; render(); break;
      // 猜汤底入口只在底部书写板（之前工具条里还有一个重复的，已去掉）
      case 'btnGuessQuick': S.guessModal = true; render(true); break;
      case 'btnTruthClose':
      case 'btnTruthClose2': {
        const r = S.view ? S.view.room : null;
        closeWithFx(() => {
          S.truthModal = false;
          if (r && r.truth) S.truthDismissedKey = `${r.id}:${r.roundNo}`;
          render();
        });
        break;
      }
      // 「回到选题」：把房间放回等待状态，房主接着选下一道题（只有房主能点）
      case 'btnTruthNext':
      case 'btnNextRound': {
        S.truthModal = false;
        S.truthDismissedKey = '';
        await sendAction({ type: 'next_round' });
        break;
      }
      case 'btnGuessCancel': closeWithFx(() => { S.guessModal = false; delete S.drafts.guessText; render(true); }); break;
      case 'btnGuessSubmit': {
        const text = $('#guessText').value;
        // 提交后弹窗同样淡出再走（request 内部会重渲染，所以先让 .out 播起来）
        closeWithFx(() => {
          S.guessModal = false;
          delete S.drafts.guessText;
          request({ t: 'guess', text });
        });
        break;
      }
      case 'btnResumeTurn': request({ t: 'resume_transfer' }); break;
      case 'btnReturnHost': request({ t: 'return_host' }); break;
      case 'btnDeclineReturn': request({ t: 'decline_return' }); break;
      case 'btnFixKey': S.keyModal = true; S.keyTest = null; render(); break;
      case 'btnRevokeKey': await api('/api/credentials', { method: 'DELETE' }); S.notice = '已撤销 Key'; render(); break;
      // 房主「换一批」候选题：拿服务端新抽的一批，替换候选题区块（不改房间状态）
      case 'btnReroll': {
        const res = await sendAction({ type: 'reroll_candidates' }, { silent: true });
        const list = res && res.data && Array.isArray(res.data.candidates) ? res.data.candidates : null;
        if (list) { S.pickPool = list; S.notice = `换了一批候选（${list.length} 道）`; }
        render(true);
        break;
      }
      case 'btnLeave': await leaveRoom(); break;
      case 'btnRecap': {
        const recap = await api('/api/recap');
        S.recap = recap; render();
        break;
      }
      case 'btnRecapClose': closeWithFx(() => { S.recap = null; render(); }); break;
      case 'btnSend': doSend(); break;
    }
  } catch (err) {
    S.error = err.message; render();
  }
});

/**
 * 发一条讨论消息。失败保留草稿（不吞用户输入），成功后立刻把自己那条挂上去（clientMessageId 去重）。
 *
 * 注意：全程走 patchChatList()（局部更新），**不做整页 render(true)**：
 *    整页重渲染会把整个房间（含正在输入的提问框、页签、名册）重建一遍，
 *    表现就是"在讨论区说句话，整页闪一下"——房间还没开局时尤其明显。
 */
async function sendChat() {
  const text = String(S.chatDraft || '').trim();
  if (!text) return;
  const clientMessageId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()));
  const meId = S.view && S.view.you ? S.view.you.memberId : '';
  const meName = S.view && S.view.you ? S.view.you.name : '';
  // 乐观显示：**先挂上去再发请求**。弱网下往返可能要一两秒，等响应才显示的话，
  // 用户会以为没发出去而重复点。chatSeq 用哨兵值，服务端真值回来后原地替换。
  S.chat.push({
    id: 'local:' + clientMessageId, chatSeq: CHAT_LOCAL_SEQ, memberId: meId, memberName: meName,
    text, clientMessageId, matchNo: (S.view && S.view.room ? S.view.room.matchNo : 0) || 0,
    createdAt: Date.now() + (S.serverOffset || 0), pending: true,
  });
  S.chatDraft = '';
  countChatUnread();
  S.chatPinned = true;                       // 自己发的那条必须看得见
  S.chatScrollToBottom = true;
  patchChatList();
  const el0 = $('#chatLog'); if (el0) el0.scrollTop = el0.scrollHeight;
  const input0 = $('#chatInput'); if (input0) input0.focus();

  const res = await sendAction({ type: 'chat', text, clientMessageId }, { silent: true });
  if (!res) {
    // 失败：把自己那条撤掉、草稿还回输入框（不吞用户写的东西）；错误信息已由 sendAction 显示
    S.chat = S.chat.filter((m) => m.clientMessageId !== clientMessageId);
    S.chatDraft = text;
    countChatUnread();
    patchChatList();
    const back = $('#chatInput'); if (back) back.focus();
    return;
  }
  const msg = res.data && res.data.message;
  if (msg) {
    // 动作响应里这条的 chatSeq 是 0（真值由服务端 SQL 分配）：能替换就替换，
    // 但**只替换本地乐观条目**，绝不能覆盖轮询已经拿到的权威值。
    const i = S.chat.findIndex((m) => m.clientMessageId === clientMessageId && m.pending === true);
    if (i >= 0 && msg.chatSeq) S.chat[i] = msg;
  }
  patchChatList();
  const el = $('#chatLog'); if (el) el.scrollTop = el.scrollHeight;
  const input = $('#chatInput'); if (input) { input.value = ''; input.focus(); }
}

function doSend() {
  const ta = $('#ask');
  const text = (ta ? ta.value : '').trim();
  if (!text) return;
  const v = S.view;
  // 清干净三处：本机草稿（localStorage）、内存草稿（S.drafts.ask）、输入框本身。
  // 不清会怎样：渲染时输入框是从 S.drafts.ask 回填的 → 发送后那句话还留在框里，
  // 用户很容易以为没发出去，再按一次回车 / 再点一次发送（"重复提问"的来源）。
  localStorage.removeItem(LS_DRAFT);
  delete S.drafts.ask;
  if (ta) ta.value = '';
  request({ t: 'submit', turnSeq: v.room.turn.seq, text, clientSubmitId: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())) });
}

document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t || !t.id) return;
  if (t.id === 'ask') {
    // 预输入草稿：只写本机 localStorage，绝不上传
    localStorage.setItem(LS_DRAFT, t.value);
    S.drafts.ask = t.value;
    return;
  }
  if (t.id === 'chatInput') {
    // 讨论草稿只在本页内存里，与正式提问草稿（LS_DRAFT）完全分开，互不覆盖
    S.chatDraft = t.value;
    const btn = $('#btnChatSend');
    if (btn) btn.disabled = !t.value.trim();
    return;
  }
  // 弹窗输入（API Key / Base URL / 模型名 / 推理）：只存内存，重渲染时不丢；
  // 关闭弹窗或提交后立即删除，尤其 API Key 绝不落盘。
  if (t.id === 'keyBase' || t.id === 'keyModel' || t.id === 'keyValue' || t.id === 'guessText') {
    S.drafts[t.id] = t.value;
    if (t.id === 'keyBase') {
      const u = $('#keyUrl'); if (u) u.textContent = completionsUrl(t.value);   // 实际请求地址跟着变
    }
    // 改了任一字段，上一次的测试结论就作废（只更新结果面板，不动输入框）
    if (S.keyTest && !S.keyTest.pending) {
      S.keyTest = null;
      const box = $('#keyTestBox'); if (box) box.innerHTML = keyTestBox();
    }
    return;
  }
  // 对局参数弹窗（没有 id，用 data-cfg 记录草稿）
  if (typeof t.hasAttribute === 'function' && t.hasAttribute('data-cfg')) {
    const k = t.getAttribute('data-cfg');
    S.drafts[`cfg:${k}`] = t.type === 'checkbox' ? t.checked : t.value;
    return;
  }
  if (t.id === 'nick' || t.id === 'code') { S.drafts[t.id] = t.value; return; }
});

// 公共对话记录：只有用户本来就贴在底部时，新消息才自动滚到底
document.addEventListener('scroll', (e) => {
  const el = e.target;
  if (el && el.id === 'log') S.logPinned = (el.scrollHeight - el.scrollTop - el.clientHeight) < 48;
}, true);

// 光标离开输入框 → 把输入期间推迟的渲染补上（延迟 250ms，先让点击事件走完）
document.addEventListener('focusout', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) flushDeferredRender();
});

// 鼠标按着（选中文字 / 拖滚动条 / 拖拽）期间冻结重渲染，松手后再补一次 —— 消除拖动时的闪烁
document.addEventListener('mousedown', () => { pointerDown = true; }, true);
document.addEventListener('mouseup', () => { pointerDown = false; flushDeferredRender(); }, true);
document.addEventListener('dragend', () => { pointerDown = false; flushDeferredRender(); }, true);
document.addEventListener('mouseleave', () => { pointerDown = false; }, true);
// 选区变化也算"用户在操作"（双击选词、Shift+方向键选字）
document.addEventListener('selectionchange', () => { if (isBusy()) S.renderPending = true; });

// 提供方下拉：选了就把 Base URL / 模型名填成预设值（直接改 DOM，不整页重渲染，
// 否则正在编辑的 Key 输入框会被替换掉）
document.addEventListener('change', (e) => {
  const t = e.target;
  if (!t || t.id !== 'keyProvider') return;
  const p = PROVIDERS[t.value] ?? PROVIDERS.deepseek;
  S.keyProvider = t.value;
  S.keyTest = null;
  S.drafts.keyBase = p.base;
  S.drafts.keyModel = p.model;
  const b = $('#keyBase'); if (b) b.value = p.base;
  const m = $('#keyModel'); if (m) m.value = p.model;
  const u = $('#keyUrl'); if (u) u.textContent = completionsUrl(p.base);
  const n = $('#keyProviderNote'); if (n) n.textContent = p.note;
  const box = $('#keyTestBox'); if (box) box.innerHTML = keyTestBox();
});

document.addEventListener('keydown', (e) => {
  // Esc 关弹窗（§23）：关掉最上面一层，把焦点还给打开它的按钮
  if (e.key === 'Escape') {
    // 先播 130ms 淡出再真正关（否则弹窗"啪"地消失，很生硬）
    if (modalKeyOf()) {
      e.preventDefault();
      const back = S.modalTriggerId;
      closeWithFx(() => {
        closeTopModal();
        render(true);
        const el = back ? document.getElementById(back) : null;
        if (el && el.focus) el.focus();
      });
      return;
    }
  }
  // Tab 循环锁在弹窗内（§23：弹窗打开后焦点留在弹窗里）
  if (e.key === 'Tab') {
    const dlg = document.querySelector('.overlay .modal');
    if (dlg) {
      const items = [...dlg.querySelectorAll('input:not([type=hidden]),textarea,select,button')]
        .filter((el) => !el.disabled && el.offsetParent !== null);
      if (items.length) {
        const first = items[0];
        const last = items[items.length - 1];
        const active = document.activeElement;
        if (e.shiftKey && (active === first || !dlg.contains(active))) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && active === last) { e.preventDefault(); first.focus(); }
      }
    }
  }
  // 提问框：**回车发送**（Shift+回车换行），Ctrl/Cmd+回车也照旧发送。
  // 中文输入法组字期间（isComposing / keyCode 229）绝不发送 —— 那时回车是在选字。
  // 弹窗开着时不发送（焦点可能在弹窗里，别把键盘事件当成"发送提问"）。
  if (e.key === 'Enter' && e.target && e.target.id === 'ask') {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.shiftKey) return;                     // Shift+回车 = 换行（textarea 默认行为）
    if (document.querySelector('.overlay')) return;
    e.preventDefault();
    // 焦点留在输入框里会让整页渲染被推迟（isBusy 保护正在输入的内容），
    // 于是"发出去了，但记录和判定迟迟不出现" —— 发送就意味着这句话写完了，主动交还焦点。
    e.target.blur();
    doSend();
    return;
  }
  // 讨论区：Enter 发送 / Shift+Enter 换行；中文输入法组字期间绝不发送
  if (e.key === 'Enter' && e.target && e.target.id === 'chatInput' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
    if (e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    void sendChat();
    return;
  }
  // 猜汤底结案陈词：是一段话，回车留给换行；Ctrl/Cmd+回车提交（与提问框的手感一致：想发就按修饰键）
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target && e.target.id === 'guessText') {
    e.preventDefault();
    const btn = $('#btnGuessSubmit');
    if (btn && !btn.disabled) btn.click();
    return;
  }
  // 入口页：署名/房号里按回车 = 点「创建 / 加入」（表单里回车的默认期待）
  if (e.key === 'Enter' && e.target && (e.target.id === 'nick' || e.target.id === 'code')) {
    if (e.isComposing || e.keyCode === 229) return;
    e.preventDefault();
    e.target.blur();                            // 同上：焦点不移开的话，房间页会被推迟渲染
    const go = $('#btnGo');
    if (go) go.click();
    return;
  }
  // 任何交互都算活动信号（服务端据此推导挂机状态；只上报"有活动"这一事实）
  if (S.connected) send({ t: 'activity', hidden: document.visibilityState !== 'visible' });
});

document.addEventListener('visibilitychange', () => {
  if (S.connected) send({ t: 'activity', hidden: document.visibilityState !== 'visible' });
  // 回到页面就停止闪烁（并立刻重算一次，保证标题状态正确）
  if (document.visibilityState === 'visible') setTitleAlert(false);
  render();
});

/* ============================================================================
 * 启动
 * ==========================================================================*/
(async () => {
  // 顶栏海龟图章（§2.7）：单色线性 SVG，静态注入一次
  const logo = document.getElementById('brandLogo');
  if (logo) logo.innerHTML = turtleSvg();
  try {
    S.config = await api('/api/config');
  } catch { /* 忽略：入口页会用默认文案 */ }
  if (token()) {
    const bootEpoch = sessionEpoch;      // 启动期的会话检查同样是异步的：期间会话可能已经结束
    try {
      const me = await api('/api/session');
      if (bootEpoch !== sessionEpoch || !token()) return;   // 已经离开/被清理 → 丢弃这次结果
      S.me = { roomId: me.roomId, memberId: me.memberId, token: token() };
      S.view = me.view; S.screen = 'room';
      if (S.view && S.view.room) S.serverOffset = S.view.room.serverTime - Date.now();
      startPolling();
    } catch (e) {
      if (bootEpoch !== sessionEpoch) return;
      // 房间真的没了（长时间没人参与被回收 / 已经散场 / 最后一人离席即清理）：
      // 清掉旧令牌并说明一句 —— 别让人以为是自己网络坏了。
      if (e && (e.status === 401 || e.status === 404)) {
        clearSession();
        S.notice = '上一个房间已经关闭了（长时间没有人参与，或已经散场）。重新开一局，或在下面输入房号加入。';
      } else {
        // 网络抖动 / 5xx：**不能**扔掉令牌 —— 房间多半还在，扔了就再也回不去了
        S.error = `恢复房间失败：${e ? e.message : '未知错误'}（房间可能还在，刷新页面重试即可）`;
      }
    }
  }
  startTicker();          // 倒计时按秒走（只改文本/进度条，不整页重渲染）
  render();
})();
</script>
</body>
</html>
