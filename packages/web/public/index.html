<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 海龟汤</title>
<!--
  M1 本地服务器版前端（阶段性实现：零依赖、直接吃同一份 @ht/core 语义）。
  正式客户端将按《阶段1》§3.1 换成 React + Vite，并把 packages/web 作为构建产物目录；
  当前这一版是"能真正联机试玩"的最小实现，用来验证服务端行为与交互节奏。
  安全前提：本页面**永远不接触 API Key 明文**——房主提交的 Key 只在服务端加密存储，
  页面拿到的只有掩码；所有判定与汤底都在服务端。
-->
<style>
  :root{
    --bg:#12141a;--bg2:#191c24;--bg3:#212532;--line:#2c3242;--fg:#e6e8ee;--fg2:#a3aab9;--fg3:#6f7788;
    --ok:#3ecf8e;--warn:#f2c14e;--bad:#ef5f6b;--info:#5aa9f8;--radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  button{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
  button:hover:not(:disabled){border-color:#3a4256;background:#262b3a}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,#6f5df0,#5a49d8);border-color:#6f5df0;color:#fff;font-weight:600}
  button.danger{border-color:#5a2b31;color:#ffb3ba}
  input,textarea,select{font:inherit;color:inherit;background:#141721;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
  textarea{resize:vertical;min-height:70px}
  .wrap{max-width:1120px;margin:0 auto;padding:14px 16px 90px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:14px;color:#cdd3e0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:290px 1fr;gap:12px;align-items:start}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);background:#1b1f2a;color:var(--fg2)}
  .pill.l1{color:#9fe3c0;border-color:#2c5c45}.pill.l2{color:#f2d08a;border-color:#5c4a25}.pill.l3{color:#ff9fa8;border-color:#5c2b31}
  .dim{color:var(--fg3);font-size:12px}.muted{color:var(--fg2)}
  .notice{font-size:12.5px;color:#ffd894;background:#3a2a12;border:1px solid #6a5121;border-radius:8px;padding:8px 10px;margin-bottom:10px}
  .err{font-size:12.5px;color:#ffb3ba;background:#241618;border:1px solid #5a2b31;border-radius:8px;padding:8px 10px;margin-bottom:10px}
  .mem{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-radius:8px}
  .mem.turn{background:#1d2436;outline:1px solid #38427a}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
  .dot.active{background:var(--ok)}.dot.idle{background:var(--warn)}.dot.off{background:#5a6070}
  .timeline{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow:auto}
  .tl{background:#161a23;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .tl.sys{border-style:dashed;color:var(--fg2)}.tl.err{border-color:#5a2b31;background:#1e1518}.tl.vote{border-color:#3a4470}
  .tl .meta{color:var(--fg3);font-size:11.5px}
  .turnbar{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
  .bar{height:8px;background:#0e1117;border-radius:99px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:var(--ok);transition:width .15s linear}
  .bar.grace>i{background:var(--warn)}.bar.paused>i{background:var(--fg3)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
  .kv .k{color:var(--fg2)}
  .cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
  .cand{background:#161a23;border:1px solid var(--line);border-radius:8px;padding:10px}
  .cand.win{border-color:var(--ok)}
  .mask{background:#141721;border:1px dashed var(--line);border-radius:8px;padding:3px 8px;font-family:ui-monospace,monospace}
  .overlay{position:fixed;inset:0;background:rgba(8,10,14,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
  .modal{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;max-width:720px;width:100%;max-height:86vh;overflow:auto}
  .field{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;margin-bottom:7px}
  .field label{color:var(--fg2);font-size:12.5px}
  /* 弹窗里的表单一律「标签在上、输入框整行」：输入长 Key / URL 时需要足够宽度 */
  .modal .field{grid-template-columns:1fr;gap:4px;align-items:start}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--fg2);font-size:12px}
  .banner{background:#3a2a12;border:1px solid #6a5121;color:#ffd894;padding:8px 12px;border-radius:var(--radius);font-size:12.5px;margin-bottom:12px}
  /* 汤面单独成块：题目信息 + 汤面全文（汤底永不下发，只在复盘揭晓） */
  .puzzle{background:#161a23;border:1px solid var(--line);border-radius:8px;padding:12px}
  .puzzle .ptitle{font-size:16px;font-weight:600}
  .puzzle .surface{font-size:15.5px;line-height:1.75;white-space:pre-wrap;margin-top:8px}
  /* 公共提问 / 对话记录（所有人共享的问答流水） */
  .log{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding-right:2px}
  .log .qa{background:#161a23;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .log .qa .head{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg2)}
  .log .qa .q{margin-top:3px;white-space:pre-wrap}
  .log .qa .a{margin-top:5px;font-size:12.5px;color:var(--fg2)}
  .log .qa .a.yes{color:#9fe3c0}.log .qa .a.no{color:#ff9fa8}
  .log .qa .a.unanswerable{color:#f2d08a}
  .log .qa.mine{border-color:#38427a}
  .log .qa .late{color:var(--warn)}
  /* Key 输入框：不用 type=password，避免浏览器/密码管理器介入（自动填充弹窗会打断输入） */
  .secret{-webkit-text-security:disc;font-family:ui-monospace,monospace}
  .timer{font-variant-numeric:tabular-nums;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    M1 本地服务器版：真实多客户端联机 · 密钥只在服务端 · 汤底不下发（复盘门禁）。
    <span class="dim">本页为阶段性前端；正式客户端将替换为 React + Vite。</span>
  </div>
  <div id="app"></div>
</div>

<script>
/* ============================================================================
 * 客户端状态与工具
 * ==========================================================================*/
const LS_TOKEN = 'ht.token';
const LS_DRAFT = 'ht.draft';           // 预输入草稿：只存本机，绝不上传（隐私红线）
const LS_NICK = 'ht.nickname';

const S = {
  screen: 'entry',                      // entry | room
  error: '',
  notice: '',
  config: null,                         // GET /api/config
  me: null,                             // { roomId, memberId, token }
  view: null,                           // 最近一次 RoomView
  connected: false,
  lastSeq: 0,
  ack: {},
  pendingTimeline: [],                  // 系统事件（来自 room_events）
  questions: [],                        // 公共提问记录（来自 questions 表，所有人都能看到）
  log: [],                              // 合并后的公共对话记录（提问 + 系统事件，按时间排序）
  logPinned: true,                      // 用户是否停在记录底部（是则新消息自动滚到底）
  drafts: {},                            // 弹窗输入的临时值：只在本页内存里，重渲染不丢；关闭即清
  serverOffset: 0,                      // 服务端时钟 - 本机时钟（计时用服务端时间为准）
  hint: '',
  recap: null,
  keyMask: null,
  keyTest: null,
  configModal: false,
  guessModal: false,
  keyModal: false,
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = (ms) => { ms = Math.max(0, ms | 0); const t = Math.ceil(ms / 1000); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const nowMs = () => Date.now();
/** 服务端当前时间（以服务端快照为基准对齐本机时钟） */
const serverNow = () => Date.now() + S.serverOffset;
/** 时刻 → HH:MM:SS（用于对话记录） */
const fmtClock = (at) => { try { return new Date(at).toLocaleTimeString('zh-CN', { hour12: false }); } catch { return ''; } };

/* ---------------------------------------------------------------- 计时（按秒走）
 * 轮询每 1.8 秒才回来一次，但倒计时必须按秒动，所以这里单独跑一个轻量 ticker：
 *   · 只更新带 data-deadline 的文本 / 带 data-bar 的进度条，**不重渲染整个界面**
 *     （整页重渲染会摧毁正在输入的输入框——这正是"API Key 打一半就没了"的根因）
 *   · 归零时催一次轮询，让服务端做惰性推进（超时跳过 / 投票截止…）
 * ------------------------------------------------------------------------- */
let tickTimer = null;
let zeroNudgedAt = 0;
function startTicker() {
  if (tickTimer) return;
  tickTimer = setInterval(tickUi, 250);
  tickUi();
}
function tickUi() {
  const now = serverNow();
  let anyExpired = false;
  document.querySelectorAll('[data-deadline]').forEach((el) => {
    const left = Math.max(0, Number(el.getAttribute('data-deadline')) - now);
    const text = el.getAttribute('data-format') === 'plain' ? `${Math.ceil(left / 1000)} 秒` : fmt(left);
    if (el.textContent !== text) el.textContent = text;
    if (left <= 0) anyExpired = true;
  });
  document.querySelectorAll('[data-bar]').forEach((el) => {
    const left = Math.max(0, Number(el.getAttribute('data-deadline')) - now);
    const total = Math.max(1, Number(el.getAttribute('data-total')) || 1);
    const pct = Math.max(0, Math.min(100, (left / total) * 100));
    el.style.width = `${pct}%`;
  });
  if (anyExpired && S.view && token() && !pollInFlight && Date.now() - zeroNudgedAt > 1500) {
    zeroNudgedAt = Date.now();
    void pollOnce();
  }
}

function token() { return localStorage.getItem(LS_TOKEN) || ''; }
function saveSession(roomId, memberId, tok) {
  S.me = { roomId, memberId, token: tok };
  // 只存会话凭证，不存任何密钥或汤底（汤底服务端根本不下发）
  localStorage.setItem(LS_TOKEN, tok);
}
function clearSession() {
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_DRAFT);
  S.me = null;
  S.view = null;
  S.drafts = {};                 // 会话结束：连同内存里的 API Key 草稿一起丢掉
  S.questions = [];
  S.log = [];
}

async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json', ...(opts.headers || {}) };
  if (token()) headers.authorization = `Bearer ${token()}`;
  const res = await fetch(path, { ...opts, headers });
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = { raw: text }; }
  if (!res.ok) {
    const err = new Error((body && (body.error || body.message)) || `HTTP ${res.status}`);
    err.status = res.status;
    err.body = body;              // 保留响应体：错误码/真实请求地址等诊断信息要用
    throw err;
  }
  return body;
}

/* ============================================================================
 * 传输层：轮询（方案 A：D1 + 惰性推进，无 WebSocket / 无 Durable Objects）
 *
 *  · 每 1.8 秒 GET /api/rooms/state?since=<seq>
 *      一次请求同时拿到【权威状态快照】+【时间线】+【新事件】+【最新 seq】
 *  · 动作走 POST /api/rooms/actions，响应里自带本次事件 → 自己的操作零等待
 *  · 心跳 20 秒一次（服务端断连判定 60 秒）；页面交互上报"活动"（挂机判定用）
 *  · 服务端每个请求都会先"惰性补算"过期事件（超时跳过/挂机/移交/投票截止），
 *    所以即使没有服务器定时器，语义也与"每秒 tick"等价
 * ==========================================================================*/
let pollTimer = null;
let hbTimer = null;
let pollInFlight = false;

/** {t:...} 帧 → 服务端动作（保持原有调用点不变） */
const ACTIONS = {
  submit: (f) => ({ type: 'submit', turnSeq: f.turnSeq, text: f.text, clientSubmitId: f.clientSubmitId }),
  hint: (f) => ({ type: 'hint', tier: f.tier }),
  guess: (f) => ({ type: 'guess', text: f.text }),
  vote: (f) => ({ type: 'vote', choice: f.choice }),
  config: (f) => ({ type: 'config', patch: f.patch, expectedVersion: f.expectedVersion }),
  start: (f) => ({ type: 'start', mode: f.mode ?? 'pick', ...(f.puzzleId ? { puzzleId: f.puzzleId } : {}) }),
  resume_transfer: () => ({ type: 'resume_transfer' }),
  return_host: () => ({ type: 'return_host' }),
  decline_return: () => ({ type: 'decline_return' }),
  reenable_key: (f) => ({ type: 'reenable_key', yes: f.yes === true }),
  revoke_key: () => ({ type: 'revoke_key' }),
  skip_turn: () => ({ type: 'skip_turn' }),
  end_match: () => ({ type: 'end_match' }),
};

function startPolling() {
  if (!token()) return;
  stopPolling();
  startTicker();
  pollTimer = setInterval(() => { void pollOnce(); }, 1800);
  hbTimer = setInterval(() => { void sendAction({ type: 'heartbeat', hidden: document.visibilityState !== 'visible' }, { silent: true }); }, 20000);
  void pollOnce();
}

function stopPolling() {
  if (pollTimer) clearInterval(pollTimer);
  if (hbTimer) clearInterval(hbTimer);
  pollTimer = null;
  hbTimer = null;
}

async function pollOnce() {
  if (pollInFlight || !token()) return;
  pollInFlight = true;
  try {
    const res = await fetch(`/api/rooms/state?since=${S.lastSeq}`, { headers: { authorization: `Bearer ${token()}` } });
    if (res.status === 401) { expireSession(); return; }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    S.connected = true;
    S.error = '';
    applyState(data);
  } catch (err) {
    S.connected = false;
    S.error = `连接中断（${err.message}），正在重试…`;
    render();
  } finally {
    pollInFlight = false;
  }
}

/** 应用服务端返回的 { view, timeline, questions, events, seq } */
function applyState(data) {
  if (data.view) {
    S.view = data.view;
    S.screen = 'room';
    // 用服务端时间做基准，避免本机时钟偏差把倒计时算歪
    if (data.view.room && typeof data.view.room.serverTime === 'number') {
      S.serverOffset = data.view.room.serverTime - Date.now();
    }
  }
  if (Array.isArray(data.timeline)) {
    S.pendingTimeline = data.timeline.map((t) => ({
      seq: t.seq, kind: t.kind, text: t.text, at: t.at, meta: t.meta,
      memberId: t.memberId ?? null, answer: t.answer, reasonCode: t.reasonCode, source: t.source,
    }));
  }
  if (Array.isArray(data.questions)) {
    S.questions = data.questions.map((q) => ({
      at: q.at, kind: 'question', memberId: q.memberId, memberName: q.memberName, turnSeq: q.turnSeq,
      text: q.text, answer: q.answer, reasonCode: q.reasonCode, source: q.source, late: q.late === true,
    }));
  }
  S.log = buildLog(S.questions, S.pendingTimeline);
  if (typeof data.seq === 'number' && data.seq > S.lastSeq) S.lastSeq = data.seq;
  if (data.view && data.view.room && data.view.room.status === 'settled') S.notice = '对局已结束，可以查看复盘';
  render();
}

/**
 * 公共对话记录 = 所有成员的提问（含判定结果）+ 系统事件，按时间合并排序。
 * 提问来自服务端 questions 表（人人可见），系统事件来自 room_events。
 */
function buildLog(questions, timeline) {
  const qs = (questions || []).map((q) => ({ ...q, text: q.text }));
  const evs = (timeline || []).filter((t) => t.kind !== 'question').map((t) => ({ ...t, kind: t.kind === 'system' ? 'system' : t.kind }));
  return [...qs, ...evs].sort((a, b) => (a.at - b.at) || ((a.seq || 0) - (b.seq || 0)));
}

/** 提交动作；返回服务端响应（含本次事件） */
async function sendAction(action, opts = {}) {
  if (!token()) { S.error = '会话已失效，请重新加入房间'; render(); return null; }
  try {
    const res = await fetch('/api/rooms/actions', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${token()}` },
      body: JSON.stringify(action),
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { expireSession(); return null; }
    if (!res.ok || data.ok === false) {
      const detail = data.detail && data.detail.errors
        ? '（' + data.detail.errors.map((e) => `${e.path}: ${e.reason}`).join('；') + '）'
        : '';
      S.error = (data.message || `HTTP ${res.status}`) + detail;
      render();
      return null;
    }
    S.error = '';
    if (data.data && data.data.text) S.hint = data.data.text;
    if (!opts.silent) S.notice = noticeFor(action);
    if (Array.isArray(data.events) && data.events.length > 0) {
      for (const e of data.events) if (typeof e.seq === 'number' && e.seq > S.lastSeq) S.lastSeq = e.seq;
    }
    await pollOnce();            // 立即刷新，自己的操作零等待
    return data;
  } catch (err) {
    S.connected = false;
    S.error = `请求失败：${err.message}`;
    render();
    return null;
  }
}

/** 会话失效（令牌过期/房间销毁）：回到入口页 */
function expireSession() {
  clearSession();
  stopPolling();
  S.screen = 'entry';
  S.view = null;
  S.error = '会话已失效，请重新创建或加入房间';
  render();
}

/** 兼容原有调用点：request({t:'...'}) → 对应动作 */
function request(frame) {
  const map = ACTIONS[frame.t];
  if (!map) { S.error = `未知操作：${frame.t}`; render(); return null; }
  if (frame.t === 'guess') S.guessModal = false;
  void sendAction(map(frame));
  return null;
}

/** 兼容原有调用点：send({t:'activity'|'heartbeat'}) */
function send(frame) {
  if (frame.t === 'activity' || frame.t === 'heartbeat') {
    void sendAction({ type: frame.t, hidden: frame.hidden === true }, { silent: true });
  }
}

/** 主动离开房间：先告诉服务端（最后一人离开会被立即清理），再清本地 */
async function leaveRoom() {
  if (token()) {
    try {
      await fetch('/api/rooms/actions', {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: `Bearer ${token()}` },
        body: JSON.stringify({ type: 'leave' }),
        keepalive: true,
      });
    } catch { /* 网络失败也要允许离开 */ }
  }
  clearSession();
  stopPolling();
  S.screen = 'entry';
  S.view = null;
  S.notice = '';
  S.error = '';
  render();
}

function noticeFor(action) {
  switch (action.type) {
    case 'submit': return '已提交';
    case 'hint': return '提示已发放';
    case 'vote': return '已记录你的表决';
    case 'start': return '对局开始';
    case 'config': return '参数已更新';
    case 'skip_turn': return '已跳过本轮';
    case 'revoke_key': S.keyMask = null; return '已撤销 Key';
    default: return '';
  }
}

/** 兼容：进入房间时用一次状态快照铺满界面 */
function applyView(view) {
  if (!view) return;
  S.view = view;
  S.screen = 'room';
  render();
}

/* ============================================================================
 * 渲染
 *
 * ⚠️ 这里是全量 innerHTML 重渲染，而轮询每 1.8 秒就会调一次 render()。
 *    所以必须显式保住"用户正在输入的东西"：
 *      · 记录当前焦点元素 id + 光标位置，重渲染后恢复（否则打字会被打断）
 *      · 输入值统一走 S.drafts 回填（否则已输入/已粘贴的内容会被清空）
 *      · 对话记录若原本贴在底部，重渲染后继续贴底
 * ==========================================================================*/
function render() {
  const app = $('#app');
  const active = document.activeElement;
  const keep = active && active.id && app.contains(active) && typeof active.selectionStart === 'number'
    ? { id: active.id, start: active.selectionStart, end: active.selectionEnd }
    : null;
  const oldLog = $('#log');
  const pinned = oldLog ? (oldLog.scrollHeight - oldLog.scrollTop - oldLog.clientHeight < 48) : S.logPinned;

  if (!S.view || S.screen === 'entry') { app.innerHTML = viewEntry(); bindEntry(); }
  else app.innerHTML = viewRoom();

  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) {
      el.focus();
      try { el.setSelectionRange(keep.start, keep.end); } catch { /* number 输入框不支持选区 */ }
    }
  }
  const log = $('#log');
  if (log) { log.scrollTop = pinned ? log.scrollHeight : Math.min(log.scrollTop, log.scrollHeight); S.logPinned = pinned; }
}

function viewEntry() {
  const nickname = S.drafts.nick ?? (localStorage.getItem(LS_NICK) || '');
  return `
  <div class="card">
    <h3>加入或创建房间</h3>
    <p class="dim">身份是轻量的：填个昵称即可，无需注册。房主自备 API Key 时，Key 只提交给服务端并加密存储，
      页面任何位置都拿不到明文（只显示掩码）。</p>
    <div class="field"><label>你的昵称</label><input id="nick" autocomplete="off" spellcheck="false" value="${esc(nickname)}" maxlength="12" placeholder="例如：阿伟"></div>
    <div class="field"><label>房间码（加入已有房间）</label><input id="code" autocomplete="off" spellcheck="false" value="${esc(S.drafts.code ?? '')}" placeholder="6 位房间码，留空则创建新房间" maxlength="8"></div>
    <div class="field"><label>对局预设</label>
      <select id="preset">
        <option value="standard">标准</option><option value="quick">快速</option><option value="casual">休闲</option>
      </select></div>
    <div class="row">
      <button class="primary" id="btnGo">创建 / 加入</button>
      <button id="btnResume" ${token() ? '' : 'disabled'}>回到我的房间</button>
    </div>
    ${S.error ? `<div class="err" style="margin-top:10px">${esc(S.error)}</div>` : ''}
    <div class="dim" style="margin-top:10px">
      ${S.config ? `服务端模型：${S.config.realModelEnabled ? '已配置平台额度' : '未配置（可由房主自备 API Key）'} · 密钥保险箱：${S.config.vaultEnabled ? '已启用' : '未启用'}` : ''}
    </div>
  </div>`;
}

function bindEntry() {
  const go = $('#btnGo');
  if (go) go.onclick = async () => {
    const nickname = ($('#nick').value || '').trim() || '玩家';
    const code = ($('#code').value || '').trim().toUpperCase();
    const preset = $('#preset').value;
    localStorage.setItem(LS_NICK, nickname);
    try {
      S.error = '';
      const res = code
        ? await api(`/api/rooms/${code}/join`, { method: 'POST', body: JSON.stringify({ nickname }) })
        : await api('/api/rooms', { method: 'POST', body: JSON.stringify({ nickname, preset }) });
      saveSession(res.roomId, res.memberId, res.token);
      if (res.view) { S.view = res.view; S.screen = 'room'; }
      startPolling();
      render();
    } catch (e) { S.error = e.message; render(); }
  };
  const resume = $('#btnResume');
  if (resume) resume.onclick = async () => {
    try {
      const me = await api('/api/session');
      S.me = { roomId: me.roomId, memberId: me.memberId, token: token() };
      S.view = me.view; S.screen = 'room';
      startPolling();
      render();
    } catch (e) { S.error = e.message; clearSession(); render(); }
  };
}

function viewRoom() {
  const v = S.view;
  const room = v.room;
  const you = v.you;
  const turn = room.turn;
  const puzzle = room.puzzle;
  const draft = S.drafts.ask ?? (localStorage.getItem(LS_DRAFT) || '');
  const myTurn = you.canSubmit;
  const phaseLabel = { ACTIVE: '提问中', GRACE: '宽限期（提交仍有效）', JUDGING: '主持人判定中', SETTLED: '本轮结束', SKIPPED: '已跳过', PAUSED: '已暂停', IDLE: '—' }[turn.phase] || turn.phase;
  // 计时：以服务端时间为准，按秒走（真正的刷新由 tickUi() 每 250ms 打到 #tickLeft 上，不整页重渲染）
  const counting = turn.phase === 'ACTIVE' || turn.phase === 'GRACE';
  const deadline = turn.phase === 'GRACE' ? turn.graceDeadlineAt : turn.deadlineAt;
  const phaseStart = turn.phase === 'GRACE' ? turn.deadlineAt : turn.startedAt;
  const total = Math.max(1, deadline - phaseStart);
  const left = counting ? Math.max(0, deadline - serverNow()) : 0;
  const pct = counting ? Math.max(0, Math.min(100, (left / total) * 100)) : 0;

  return `
  <div class="grid">
    <div>
      <div class="card"><h3>房间</h3>
        <div class="kv">
          <div class="k">房间码</div><div><b>${esc(room.code)}</b></div>
          <div class="k">状态</div><div>${esc(room.status)}${room.pauseReason ? ' · ' + esc(room.pauseReason) : ''}</div>
          <div class="k">轮次</div><div>第 ${room.roundNo} 轮 · turn_seq ${turn.seq}</div>
          <div class="k">连接</div><div>${S.connected ? '已连接' : '<span style="color:#ffb3ba">断开，正在重连…</span>'}</div>
        </div>
        <div class="row" style="margin-top:8px">
          ${you.isHost ? `<button id="btnStart">开局（房主指定）</button><button id="btnStartVote">开局（投票选汤）</button>` : ''}
          ${you.isHost ? `<button id="btnCfg">对局参数</button><button id="btnSkip">跳过本轮</button>` : ''}
          ${you.isHost ? `<button id="btnKey">我的 API Key</button>` : ''}
          <button id="btnLeave" class="danger">离开</button>
        </div>
      </div>

      <div class="card"><h3>成员</h3>
        ${room.members.map((m) => `
          <div class="mem${turn.memberId === m.id ? ' turn' : ''}">
            <div><span class="dot ${m.conn === 'disconnected' ? 'off' : m.activity === 'idle' ? 'idle' : 'active'}"></span>
              ${esc(m.name)} ${m.isHost ? '<span class="pill">房主</span>' : ''}${m.formerHost ? '<span class="pill">原房主</span>' : ''}
              ${m.keyState === 'suspended' ? '<span class="pill l2">Key 挂起</span>' : ''}
            </div>
            <div class="dim">${m.stateLabel} · 分 ${m.score}</div>
          </div>`).join('')}
        <div class="dim" style="margin-top:6px">挂机只跳过其回合、不移交房主；断连才触发移交。挂机与离线不计入投票分母。</div>
      </div>

      <div class="card"><h3>额度来源</h3>
        <div class="kv">
          <div class="k">当前</div><div>${room.credit.mode === 'host_key' ? '房主自备 API' : '平台备用额度'}</div>
          <div class="k">原因码</div><div>${esc(room.credit.reason)}</div>
          ${room.credit.grantLeft ? `<div class="k">临时授权</div><div>${room.credit.grantLeft} 次</div>` : ''}
          <div class="k">房主 Key</div><div>${room.members.find((m) => m.isHost) && room.members.find((m) => m.isHost).keyMask ? `<span class="mask">${esc(room.members.find((m) => m.isHost).keyMask)}</span>` : '未配置'}</div>
        </div>
        <div class="dim" style="margin-top:6px">原文不可回读：任何角色（含房主本人）都取不回明文。调用失败时系统不会自动改用平台额度。</div>
      </div>
    </div>

    <div>
      <div class="turnbar">
        <div class="spread">
          <div><b>第 ${room.roundNo} 轮</b> · ${turn.memberId ? '轮到 ' + esc(nameOf(room, turn.memberId)) : '—'} <span class="pill">${esc(phaseLabel)}</span></div>
          <div>${counting
            ? `<span class="timer" id="tickLeft" data-deadline="${deadline}">${fmt(left)}</span>`
            : '<span class="dim">—</span>'}</div>
        </div>
        <div class="bar${turn.phase === 'GRACE' ? ' grace' : room.status === 'suspended' ? ' paused' : ''}"><i
          ${counting ? `data-bar data-deadline="${deadline}" data-total="${total}"` : ''} style="width:${pct}%"></i></div>
        <div class="dim">倒计时按秒走，以服务端时间为准${counting ? `（本轮共 ${Math.round(total / 1000)} 秒）` : ''}。</div>
      </div>

      ${S.notice ? `<div class="notice">${esc(S.notice)}</div>` : ''}
      ${S.error ? `<div class="err">${esc(S.error)}</div>` : ''}

      ${puzzle ? puzzleCard(puzzle) : ''}

      ${(room.status === 'waiting' && !you.isHost) ? `
      <div class="card"><div class="spread"><h3 style="margin:0">选题</h3><span class="dim">等待房主选题…</span></div>
        <div class="dim">房主会从题库里挑一道题，或发起「投票选汤」让所有人一起选。</div></div>` : ''}

      ${(you.isHost && v.candidates && v.candidates.length > 0 && room.status === 'waiting') ? `
      <div class="card"><div class="spread"><h3 style="margin:0">选题（${v.candidates.length} 道可选）</h3>
        <span class="dim">点「选这道」直接开局，或发起「投票选汤」让成员一起选</span></div>
        <div class="cands">
          ${v.candidates.map((c) => `
            <div class="cand">
              <div class="row"><span class="pill ${String(c.rating).toLowerCase()}">${esc(c.rating)}</span>
                <span class="pill">难度 ${c.difficulty}</span><span class="pill">约 ${c.estMinutes} 分钟</span></div>
              <div>${esc(c.surface)}</div>
              <div class="row">${(c.tags || []).map((t) => `<span class="pill">${esc(t)}</span>`).join('')}
                ${(c.sensitiveTags || []).map((t) => `<span class="pill l3">含：${esc(t)}</span>`).join('')}</div>
              ${you.isHost ? `<button data-pick="${esc(c.id)}">选这道</button>` : ''}
            </div>`).join('')}
        </div>
      </div>` : ''}

      ${banners(room, you)}

      <div class="card">
        <div class="spread"><h3 style="margin:0">公共提问 · 对话记录 <span class="dim">（${S.log.length} 条 · 所有人共享）</span></h3>
          <div class="row">
            <button data-hint="1" ${you.canHintT12 ? '' : 'disabled'}>提示 T1</button>
            <button data-hint="2" ${you.canHintT12 ? '' : 'disabled'}>提示 T2</button>
            <button data-hint="3" ${you.canHintT3 ? '' : 'disabled'}>提示 T3</button>
            <button id="btnGuess" ${you.guessLeft && room.status === 'playing' ? '' : 'disabled'}>揭秘（剩 ${you.guessLeft}）</button>
          </div>
        </div>
        <div class="log" id="log">
          ${S.log.map((t) => logEntry(t, room, you)).join('') || '<div class="dim">还没有记录。轮到你时提第一个问题吧。</div>'}
        </div>
        <div class="dim" style="margin-top:8px">所有人的提问与主持人判定都在这里，按时间排列，全员可见（自己的提问高亮）。
          提问一旦发出即公开，无法撤回；草稿框里的内容在发送前只有你自己能看到。</div>
      </div>

      <div class="card">
        <div class="spread"><h3 style="margin:0">提问 / 预输入草稿</h3>
          <span class="dim">草稿只存在本机浏览器，不上传、不广播</span></div>
        <textarea id="ask" placeholder="随时可以打字（预输入）。轮到你时才能发送。">${esc(draft)}</textarea>
        <div class="row" style="margin-top:8px">
          <button class="primary" id="btnSend" ${myTurn ? '' : 'disabled'}>${turn.phase === 'GRACE' && myTurn ? '发送（宽限期内仍有效）' : '发送'}</button>
          <span class="dim">${myTurn ? '轮到你了' : '等待 ' + (turn.memberId ? esc(nameOf(room, turn.memberId)) + ' 发言' : '开局')}</span>
          ${turn.lateSubmit ? '<span class="pill l2">上一轮为临界提交</span>' : ''}
        </div>
        ${S.hint ? `<div class="notice" style="margin-top:10px">${esc(S.hint)}</div>` : ''}
      </div>

      ${room.status === 'settled' ? `
      <div class="card"><div class="spread"><h3 style="margin:0">对局结束</h3><button class="primary" id="btnRecap">查看复盘</button></div>
        <div class="dim">复盘含汤底揭晓；中止的对局不予揭晓（避免"开局→立刻结束→读汤底"）。</div></div>` : ''}
    </div>
  </div>

  ${S.configModal ? cfgModal(room) : ''}
  ${S.guessModal ? guessModal(v) : ''}
  ${S.keyModal ? keyModal(v) : ''}
  ${S.recap ? recapModal(S.recap) : ''}`;
}

/** 题目块：汤面单独成块（汤底只在复盘揭晓，服务端根本不下发） */
function puzzleCard(puzzle) {
  return `
  <div class="card"><div class="spread"><h3 style="margin:0">题目 · 汤面</h3>
    <span class="dim">汤底不在这里，对局结束后用「查看复盘」揭晓</span></div>
    <div class="puzzle">
      <div class="spread">
        <div class="ptitle">《${esc(puzzle.title)}》</div>
        <div class="row">
          <span class="pill ${String(puzzle.rating).toLowerCase()}">${esc(puzzle.rating)}</span>
          <span class="pill">难度 ${puzzle.difficulty}</span>
          ${puzzle.estMinutes ? `<span class="pill">约 ${puzzle.estMinutes} 分钟</span>` : ''}
        </div>
      </div>
      <div class="surface">${esc(puzzle.surface)}</div>
      <div class="row" style="margin-top:8px">
        ${(puzzle.tags || []).map((t) => `<span class="pill">${esc(t)}</span>`).join('')}
        ${(puzzle.sensitiveTags || []).map((t) => `<span class="pill l3">含：${esc(t)}</span>`).join('')}
      </div>
    </div>
  </div>`;
}

/** 公共对话记录里的一条：提问（含判定）或系统事件 */
function logEntry(t, room, you) {
  if (t.kind === 'question') {
    const who = t.memberName || nameOf(room, t.memberId || '');
    const mine = t.memberId && you && t.memberId === you.memberId;
    return `<div class="qa${mine ? ' mine' : ''}">
      <div class="head"><b>${esc(who)}${mine ? '（你）' : ''}</b><span>第 ${t.turnSeq} 轮 · ${fmtClock(t.at)}</span></div>
      <div class="q">${esc(t.text)}</div>
      <div class="a ${esc(t.answer || '')}">主持人：<b>${answerLabel(t.answer)}</b>${t.reasonCode && t.reasonCode !== 'NONE' ? ` <span class="dim">（${esc(t.reasonCode)}）</span>` : ''}${t.late ? ' <span class="late">· 临界提交</span>' : ''}</div>
    </div>`;
  }
  const cls = t.kind === 'rejected' ? 'err' : t.kind === 'vote' ? 'vote' : 'sys';
  return `<div class="tl ${cls}">${t.memberId ? `<b>${esc(nameOf(room, t.memberId))}</b>：` : ''}${esc(t.text)}
    <div class="meta">${fmtClock(t.at)}${t.meta ? ' · ' + esc(t.meta) : ''}</div></div>`;
}

function banners(room, you) {
  const out = [];
  // 服务端没有平台额度时：房主自备 Key 就是唯一的真实模型来源，直接给出入口
  const hostMember = room.members.find((m) => m.isHost);
  if (!(S.config && S.config.realModelEnabled) && (S.config ? S.config.vaultEnabled : true)
      && you.isHost && hostMember && !hostMember.keyMask) {
    out.push(`<div class="notice">服务端没有配置模型额度：当前判定由<b>内置模拟主持人</b>给出（能玩，但不理解自然语言）。
      填上你自己的 API Key（默认 DeepSeek）后，判定就会走真实模型。
      <div class="row" style="margin-top:6px"><button class="primary" id="btnKeyFromBanner">填写我的 API Key</button></div></div>`);
  }
  if (room.ai.state === 'BLOCKED') {
    out.push(`<div class="notice">AI 服务异常（${esc(room.ai.reasonCode || '')}）：对局已暂停，等待房主处理。<b>本轮未消耗，且不会自动切换到平台额度。</b>
      ${you.isHost ? '<div class="row" style="margin-top:6px"><button id="btnFixKey">更新 API Key</button><button id="btnRevokeKey">撤销并改用平台额度</button></div>' : ''}</div>`);
  }
  if (room.vote && room.vote.type === 'fallback_credit' && room.vote.status === 'open') {
    out.push(`<div class="notice">投票：是否临时启用平台备用额度继续对局？已投 ${room.vote.votedCount} / ${room.vote.eligibleCount}，剩余 <span data-deadline="${room.vote.deadlineAt}">${fmt(room.vote.deadlineAt - serverNow())}</span>
      <div class="row" style="margin-top:6px"><button data-vote="yes">赞成</button><button data-vote="no">反对</button><button data-vote="abstain">弃权</button></div>
      <div class="dim">门槛：有效人数 ≥ 2 且赞成票过半；挂机 / 离线成员的表决不被受理</div></div>`);
  }
  if (room.vote && room.vote.type === 'puzzle_choice' && room.vote.status === 'open') {
    out.push(`<div class="card"><h3>投票选汤（已投 ${room.vote.votedCount} / ${room.vote.eligibleCount}，剩余 <span data-deadline="${room.vote.deadlineAt}">${fmt(room.vote.deadlineAt - serverNow())}</span>）</h3>
      <div class="cands">${(room.vote.candidates || []).map((c) => `
        <div class="cand">
          <div class="row"><span class="pill ${c.rating.toLowerCase()}">${esc(c.rating)}</span><span class="pill">难度 ${c.difficulty}</span><span class="pill">约 ${c.estMinutes} 分钟</span></div>
          <div>${esc(c.surface)}</div>
          <div class="row">${c.tags.map((t) => `<span class="pill">${esc(t)}</span>`).join('')}${c.sensitiveTags.map((t) => `<span class="pill l3">含：${esc(t)}</span>`).join('')}</div>
          <button data-votepuzzle="${esc(c.id)}" ${room.vote.myBallot ? 'disabled' : ''}>投给这道</button>
        </div>`).join('')}</div></div>`);
  }
  if (room.vote && room.vote.status !== 'open' && room.vote.result) out.push(`<div class="notice">投票已结束：${esc(room.vote.result)}</div>`);
  if (room.transfer.state === 'paused_for_resume') {
    out.push(`<div class="notice">房主变更完成，本轮已作废（不计入跳过次数）。等待新房主开始下一轮。
      ${you.isHost ? '<div class="row" style="margin-top:6px"><button class="primary" id="btnResumeTurn">继续对局</button></div>' : ''}</div>`);
  }
  const former = room.members.find((m) => m.formerHost);
  if (former && you.isHost) {
    out.push(`<div class="notice">${esc(former.name)} 已回来（现为普通成员）。是否归还房主位？
      <div class="row" style="margin-top:6px"><button id="btnReturnHost">归还</button><button id="btnDeclineReturn" class="danger">不归还（销毁其挂起 Key）</button></div></div>`);
  }
  if (you.isHost && room.members.find((m) => m.isHost) && room.members.find((m) => m.isHost).keyState === 'suspended' && !former) {
    out.push(`<div class="notice">你的 API Key 处于挂起状态：是否重新启用？
      <div class="row" style="margin-top:6px"><button data-reenable="yes">是（复测并切回自备额度）</button><button data-reenable="no">否（销毁 Key）</button></div></div>`);
  }
  return out.join('');
}

function nameOf(room, id) { const m = room.members.find((x) => x.id === id); return m ? m.name : '—'; }
function answerLabel(a) { return { yes: '是', no: '否', irrelevant: '无关', unanswerable: '无法回答' }[a] || a; }

/* ============================================================================
 * 弹窗
 * ==========================================================================*/
function cfgModal(room) {
  const c = room.config;
  const num = (k, label, min, max) => `<div class="field"><label>${label}</label><input type="number" data-cfg="${k}" value="${c[k]}" min="${min}" max="${max}"></div>`;
  const bool = (k, label) => `<div class="field"><label>${label}</label><div><input type="checkbox" data-cfg="${k}" ${c[k] ? 'checked' : ''}></div></div>`;
  return `<div class="overlay"><div class="modal">
    <div class="spread"><h3 style="margin:0">对局参数（config_version ${room.configVersion}）</h3><button id="btnCfgClose">关闭</button></div>
    <p class="dim">开局后：时长 / 宽限 / 冷却类下一回合生效；次数与上限类只允许增大（防止追溯性剥夺）；题目与评分口径整局锁定。</p>
    ${num('perTurnSec', '每人提问时长（秒）', 15, 600)}
    ${num('graceSec', '超时宽限（秒）', 0, 30)}
    ${num('guessEveryRounds', '揭秘间隔（每 N 轮）', 1, 10)}
    ${num('guessMaxPerMember', '每人揭秘次数', 1, 10)}
    ${num('hintQuotaPerMember', '每人提示次数（T1+T2）', 0, 10)}
    ${num('hintTier3Max', 'T3 提示（每局共享）', 0, 3)}
    ${num('hintCooldownSec', '提示冷却（秒）', 0, 600)}
    ${num('maxRounds', '总回合上限（轮）', 1, 60)}
    ${num('candidateCount', '候选题数量', 3, 5)}
    ${num('voteDurationSec', '投票时长（秒）', 30, 600)}
    ${bool('timeoutSkip', '超时自动跳过')}
    ${bool('idleSkip', '跳过挂机成员的回合')}
    <div class="row" style="margin-top:10px"><button class="primary" id="btnCfgApply">应用</button></div>
  </div></div>`;
}

function guessModal() {
  const text = S.drafts.guessText ?? '';
  return `<div class="overlay"><div class="modal">
    <div class="spread"><h3 style="margin:0">提交你的推理（揭秘）</h3><button id="btnGuessCancel">取消</button></div>
    <p class="dim">判定尺度：关键事实点全部命中 + 表达出因果链 = 命中；命中 ≥ 60% = 接近（只告诉你数量，不告诉你命中了哪几条）；否则未命中。</p>
    <textarea id="guessText" autocomplete="off" spellcheck="false" placeholder="用几句话说明：发生了什么、为什么会这样">${esc(text)}</textarea>
    <div class="row" style="margin-top:10px"><button class="primary" id="btnGuessSubmit">提交推理</button></div>
  </div></div>`;
}

/** 默认提供方（服务端 /api/config 下发，取不到就用 DeepSeek 官方端点兜底） */
function defaultBaseUrl() { return (S.config && S.config.defaultBaseUrl) || 'https://api.deepseek.com'; }
function defaultModel() { return (S.config && S.config.defaultModel) || 'deepseek-flash'; }

/**
 * 房主自备 API Key。
 *
 * ⚠️ 这个弹窗踩过两个坑，改法就写在控件属性里：
 *   · 轮询每 1.8 秒会整页重渲染 → 输入到一半的内容会被清空。
 *     现在输入值实时存进 S.drafts（只在内存里），重渲染后回填；render() 另外恢复焦点与光标位置。
 *   · 用 type="password" 会被 Edge/Chrome 当成登录表单，弹「是否保存密码」并介入填充，
 *     干扰输入（鼠标移开就可能被取消）。现在改用 type="text" + CSS 掩码（-webkit-text-security），
 *     再配上 autocomplete="off/new-password"、data-form-type="other" 等标记，彻底避开密码管理器。
 *
 * 另外：「测试连接」只验证可用性、不入库，结果直接显示成功/失败与原因（含真实请求地址与耗时）。
 */
function keyModal() {
  const base = S.drafts.keyBase ?? defaultBaseUrl();
  const model = S.drafts.keyModel ?? defaultModel();
  const key = S.drafts.keyValue ?? '';
  const vaultOff = Boolean(S.config) && S.config.vaultEnabled === false;
  return `<div class="overlay"><div class="modal">
    <div class="spread"><h3 style="margin:0">房主自备 API Key</h3><button id="btnKeyClose">关闭</button></div>
    ${vaultOff ? `<div class="err">服务端未配置 <code>MASTER_KEY</code>：保险箱处于关闭状态，**不会**以任何形式保存你的 Key（也绝不退化成明文存储），
      所以「连接测试并提交」暂时不可用。<br>管理员在项目目录执行一次即可启用：
      <code>npx wrangler secret put MASTER_KEY</code>（值用 32 字节随机数的 base64）。<br>
      现在你仍然可以点下面的「测试连接（不入库）」验证 Key 是否有效。</div>` : ''}
    <p class="dim">提交后服务端会先做一次连接测试：通过才加密入库并锁定生效（此后调用失败**不会**自动改用平台额度）；
      页面只显示掩码，任何人都无法回读原文。</p>
    <div class="field"><label>Base URL</label>
      <input id="keyBase" name="ht-host-endpoint" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
        spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true"
        value="${esc(base)}" placeholder="https://api.deepseek.com"></div>
    <div class="dim">实际请求地址（自动补 <code>/chat/completions</code>）：<code id="keyUrl">${esc(completionsUrl(base))}</code></div>
    <div class="field"><label>模型名</label>
      <input id="keyModel" name="ht-host-model" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
        spellcheck="false" data-form-type="other" data-lpignore="true" data-1p-ignore="true"
        value="${esc(model)}" placeholder="deepseek-flash"></div>
    <div class="field"><label>API Key</label>
      <input id="keyValue" name="ht-host-credential" type="text" class="secret" autocomplete="new-password"
        autocapitalize="off" autocorrect="off" spellcheck="false" data-form-type="other"
        data-lpignore="true" data-1p-ignore="true" value="${esc(key)}" placeholder="sk-..."></div>
    <div class="row">
      <button id="btnKeyToggle">显示 / 隐藏</button>
      <span class="dim">默认已填好 DeepSeek：Base URL <code>https://api.deepseek.com</code> · 模型 <code>deepseek-flash</code>。
        用别家兼容服务时改成对应地址与模型名（已经带 /chat/completions 的地址不会重复追加）。</span>
    </div>
    ${S.keyMask ? `<div class="dim" style="margin-top:8px">当前掩码：<span class="mask">${esc(S.keyMask)}</span></div>` : ''}
    <div id="keyTestBox">${keyTestBox()}</div>
    <div class="row" style="margin-top:10px">
      <button id="btnKeyTest">测试连接（不入库）</button>
      <button class="primary" id="btnKeySubmit" ${vaultOff ? 'disabled title="服务端未配置 MASTER_KEY"' : ''}>连接测试并提交</button>
      <button class="danger" id="btnKeyRevoke" ${hasOwnKey() ? '' : 'disabled'}>撤销并销毁</button></div>
    <div class="dim" style="margin-top:8px">测试与提交失败都不会保存任何东西。Key 只留在本页内存里，不会写入浏览器存储。</div>
  </div></div>`;
}

/** 房主是否已有一把生效中的 Key（本会话提交过，或服务端视图里带掩码）——决定「撤销并销毁」是否可点 */
function hasOwnKey() {
  if (S.keyMask) return true;
  const hostMember = S.view && S.view.room ? S.view.room.members.find((m) => m.isHost) : null;
  return Boolean(hostMember && hostMember.keyMask);
}

/** Base URL → 真实请求地址（与服务端 HostService.chatCompletionsUrl 保持一致） */
function completionsUrl(base) {
  const b = String(base ?? '').trim().replace(/\/+$/, '');
  if (!b) return '';
  return b.endsWith('/chat/completions') ? b : `${b}/chat/completions`;
}

/** 测试结果面板：成功给绿色，失败给红色 + 人话原因 + 排查提示 */
function keyTestBox() {
  const t = S.keyTest;
  if (!t) return '<div class="dim" style="margin-top:8px">点「测试连接」可以先只验证 Key 能不能用，不会入库、不会影响当前对局。</div>';
  if (t.pending) return '<div class="notice" style="margin-top:8px">正在连接上游模型服务…</div>';
  const where = `${t.url ? `<br><span class="dim">实际请求：${esc(t.url)}${t.model ? ' · 模型：' + esc(t.model) : ''}</span>` : ''}`;
  if (t.ok) {
    return `<div class="notice" style="margin-top:8px"><b>✅ 连接成功</b>${t.latencyMs ? `（${t.latencyMs} ms）` : ''}：${esc(t.message || '上游已正常响应')}${where}
      ${t.reasonCode === 'RATE_LIMITED_AT_SUBMIT' ? '<br><span class="dim">当前被限流：凭证有效，但对局中调用可能失败。</span>' : ''}
      ${t.stored === false ? '<br><span class="dim">本次只是测试，还没有入库。</span>' : ''}</div>`;
  }
  return `<div class="err" style="margin-top:8px"><b>❌ 连接失败</b>：${esc(t.message || '未知错误')}
    ${t.reasonCode ? `<span class="dim">（${esc(t.reasonCode)}${t.latencyMs ? ' · ' + t.latencyMs + ' ms' : ''}）</span>` : ''}${where}
    <br>排查建议：${esc(hintForReason(t.reasonCode))}</div>`;
}

/** 把错误码翻译成"下一步该改什么" */
function hintForReason(code) {
  switch (code) {
    case 'MISSING_API_KEY': return '先把 API Key 填进第三个输入框。';
    case 'AUTH_FAILED': return 'Key 无效或已被撤销：到服务商后台重新生成一个（注意别带上多余空格）。';
    case 'PERMISSION_DENIED': return '该账号无权访问这个模型：换个模型名或换账号。';
    case 'QUOTA_EXHAUSTED': return '余额/额度不足：充值或换一个 Key。';
    case 'MODEL_OR_BASE_URL_NOT_FOUND': return '模型名或 Base URL 写错了。DeepSeek 用 https://api.deepseek.com，模型名 deepseek-flash 或 deepseek-v4-pro。';
    case 'INVALID_REQUEST': return '上游不接受这个请求：基本是模型名不对（或该模型不支持当前参数）。';
    case 'RATE_LIMITED_AT_SUBMIT': return '被限流了，稍等一会儿再试；凭证本身是有效的。';
    case 'UPSTREAM_UNAVAILABLE': return '上游服务暂时不可用（5xx），稍后重试。';
    case 'UPSTREAM_TIMEOUT': return '8 秒内没响应：检查网络/代理，或换个服务商地址。';
    case 'NETWORK_ERROR': return '网络不通：确认地址是公网 https 且能访问。';
    case 'BASE_URL_INVALID':
    case 'BASE_URL_MUST_BE_HTTPS':
    case 'BASE_URL_PRIVATE_HOST':
    case 'BASE_URL_PRIVATE_ADDRESS':
    case 'BASE_URL_MUST_NOT_CONTAIN_QUERY_OR_FRAGMENT':
    case 'BASE_URL_MUST_NOT_CONTAIN_CREDENTIALS': return 'Base URL 必须是不带路径参数的 https 公网地址，例如 https://api.deepseek.com。';
    default: return '依次确认：Base URL（https://api.deepseek.com）、模型名（deepseek-flash）、API Key 三者是否对得上。';
  }
}

function recapModal(recap) {
  return `<div class="overlay"><div class="modal">
    <div class="spread"><h3 style="margin:0">复盘 · ${esc(recap.puzzle.title)}</h3><button id="btnRecapClose">关闭</button></div>
    <div class="row"><span class="pill">${esc(recap.result?.result || '')}</span><span class="pill">${esc(recap.result?.reason || '')}</span>
      <span class="pill">共 ${recap.questions.length} 次提问</span></div>
    ${recap.canRevealTruth ? `<h3 style="margin-top:12px">汤底揭晓</h3><p>${esc(recap.truth || '')}</p>`
      : `<div class="notice" style="margin-top:12px">${esc(recap.truthNote || '本局不予揭晓汤底')}</div>`}
    <h3>完整提问记录</h3>
    <table><tr><th>#</th><th>成员</th><th>提问</th><th>判定</th><th>来源</th></tr>
      ${recap.questions.map((q) => `<tr><td>${q.turnSeq}</td><td>${esc(q.memberName)}</td><td>${esc(q.text)}</td>
        <td>${answerLabel(q.answer)}${q.reasonCode && q.reasonCode !== 'NONE' ? ` <span class="dim">(${esc(q.reasonCode)})</span>` : ''}</td>
        <td>${esc(q.source)}</td></tr>`).join('')}</table>
    <h3 style="margin-top:12px">计分</h3>
    <table><tr><th>成员</th><th>得分</th><th>被跳过</th><th>揭秘次数</th></tr>
      ${recap.members.map((m) => `<tr><td>${esc(m.name)}</td><td>${m.score}</td><td>${m.skipStreak}</td><td>${m.guessesUsed}</td></tr>`).join('')}</table>
    <div class="dim" style="margin-top:8px">复盘不含任何 Key；请勿分享给将要玩这道题的人。</div>
  </div></div>`;
}

/* ============================================================================
 * 交互绑定
 * ==========================================================================*/
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[id],[data-pick],[data-hint],[data-vote],[data-votepuzzle],[data-reenable],[data-cfg]');
  if (!el) return;
  const id = el.id;
  const hintTier = el.getAttribute('data-hint');
  const vote = el.getAttribute('data-vote');
  const votePuzzle = el.getAttribute('data-votepuzzle');
  const reenable = el.getAttribute('data-reenable');
  const pickPuzzle = el.getAttribute && el.getAttribute('data-pick');
  const room = S.view ? S.view.room : null;

  try {
    if (hintTier) { S.error = ''; request({ t: 'hint', tier: Number(hintTier) }); return; }
    if (vote) { S.error = ''; request({ t: 'vote', choice: vote }); return; }
    if (votePuzzle) { S.error = ''; request({ t: 'vote', choice: votePuzzle }); return; }
    if (reenable) { S.error = ''; request({ t: 'reenable_key', yes: reenable === 'yes' }); return; }
    if (pickPuzzle) { S.error = ''; request({ t: 'start', mode: 'pick', puzzleId: pickPuzzle }); return; }
    switch (id) {
      case 'btnStart': request({ t: 'start', mode: 'pick' }); break;
      case 'pickPuzzle': request({ t: 'start', mode: 'pick', puzzleId: el.getAttribute('data-pick') }); break;
      case 'btnStartVote': request({ t: 'start', mode: 'vote' }); break;
      case 'btnCfg': S.configModal = true; render(); break;
      case 'btnCfgClose': S.configModal = false; render(); break;
      case 'btnCfgApply': {
        const patch = {};
        document.querySelectorAll('[data-cfg]').forEach((input) => {
          const k = input.getAttribute('data-cfg');
          patch[k] = input.type === 'checkbox' ? input.checked : Number(input.value);
        });
        request({ t: 'config', patch, expectedVersion: room.configVersion });
        S.configModal = false;
        break;
      }
      case 'btnSkip': request({ t: 'skip_turn' }); break;
      case 'btnKey': S.keyModal = true; S.keyTest = null; render(); break;
      case 'btnKeyFromBanner': S.keyModal = true; S.keyTest = null; render(); break;
      case 'btnKeyClose': S.keyModal = false; S.keyTest = null; delete S.drafts.keyValue; render(); break;
      case 'btnKeyToggle': {
        const el = $('#keyValue');
        if (el) el.classList.toggle('secret');
        break;
      }
      case 'btnKeyTest': {
        const baseUrl = ($('#keyBase').value || '').trim() || defaultBaseUrl();
        const model = ($('#keyModel').value || '').trim() || defaultModel();
        const apiKey = $('#keyValue').value;
        S.keyTest = { pending: true, url: completionsUrl(baseUrl), model };
        render();
        try {
          const res = await api('/api/credentials/test', { method: 'POST', body: JSON.stringify({ apiKey, baseUrl, model }) });
          S.keyTest = { ...res, url: res.url || completionsUrl(baseUrl), model: res.model || model };
        } catch (err) {
          const b = err.body || {};
          S.keyTest = {
            ok: false, reasonCode: b.error || `HTTP_${err.status || 'ERR'}`, message: b.message || err.message,
            latencyMs: b.latencyMs, url: b.url || completionsUrl(baseUrl), model: b.model || model,
          };
        }
        render();
        break;
      }
      case 'btnKeySubmit': {
        const baseUrl = ($('#keyBase').value || '').trim() || defaultBaseUrl();
        const model = ($('#keyModel').value || '').trim() || defaultModel();
        const apiKey = $('#keyValue').value;                 // 只在内存中，提交后立即清空
        S.error = '';
        try {
          const res = await api('/api/credentials', { method: 'POST', body: JSON.stringify({ apiKey, baseUrl, model }) });
          S.keyMask = res.credential.mask;
          S.notice = '已启用自备额度（' + res.message + '）';
          S.keyTest = null;
          S.keyModal = false;
          delete S.drafts.keyValue;                          // Key 绝不留在内存里
          if ($('#keyValue')) $('#keyValue').value = '';
        } catch (err) {
          // 提交失败时把详情留在弹窗里，方便直接看到"为什么不成"
          const b = err.body || {};
          S.error = err.message;
          S.keyTest = {
            ok: false, reasonCode: b.error || `HTTP_${err.status || 'ERR'}`, message: b.message || err.message,
            latencyMs: b.latencyMs, url: b.url || completionsUrl(baseUrl), model: b.model || model,
          };
        }
        render();
        break;
      }
      case 'btnKeyRevoke': await api('/api/credentials', { method: 'DELETE' }); S.keyMask = null; S.keyModal = false; S.keyTest = null; delete S.drafts.keyValue; S.notice = '已撤销并销毁 Key，改用平台备用额度'; render(); break;
      case 'btnGuess': S.guessModal = true; render(); break;
      case 'btnGuessCancel': S.guessModal = false; delete S.drafts.guessText; render(); break;
      case 'btnGuessSubmit': {
        const text = $('#guessText').value;
        S.guessModal = false;
        delete S.drafts.guessText;
        request({ t: 'guess', text });
        break;
      }
      case 'btnResumeTurn': request({ t: 'resume_transfer' }); break;
      case 'btnReturnHost': request({ t: 'return_host' }); break;
      case 'btnDeclineReturn': request({ t: 'decline_return' }); break;
      case 'btnFixKey': S.keyModal = true; render(); break;
      case 'btnRevokeKey': await api('/api/credentials', { method: 'DELETE' }); S.notice = '已撤销 Key'; render(); break;
      case 'btnLeave': await leaveRoom(); break;
      case 'btnRecap': {
        const recap = await api('/api/recap');
        S.recap = recap; render();
        break;
      }
      case 'btnRecapClose': S.recap = null; render(); break;
      case 'btnSend': doSend(); break;
    }
  } catch (err) {
    S.error = err.message; render();
  }
});

function doSend() {
  const ta = $('#ask');
  const text = (ta ? ta.value : '').trim();
  if (!text) return;
  const v = S.view;
  localStorage.removeItem(LS_DRAFT);
  request({ t: 'submit', turnSeq: v.room.turn.seq, text, clientSubmitId: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())) });
}

document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t || !t.id) return;
  if (t.id === 'ask') {
    // 预输入草稿：只写本机 localStorage，绝不上传
    localStorage.setItem(LS_DRAFT, t.value);
    S.drafts.ask = t.value;
    return;
  }
  // 弹窗输入（API Key / Base URL / 模型名 / 推理）：只存内存，重渲染时不丢；
  // 关闭弹窗或提交后立即删除，尤其 API Key 绝不落盘。
  if (t.id === 'keyBase' || t.id === 'keyModel' || t.id === 'keyValue' || t.id === 'guessText') {
    S.drafts[t.id] = t.value;
    if (t.id === 'keyBase') {
      const u = $('#keyUrl'); if (u) u.textContent = completionsUrl(t.value);   // 实际请求地址跟着变
    }
    // 改了任一字段，上一次的测试结论就作废（只更新结果面板，不动输入框）
    if (S.keyTest && !S.keyTest.pending) {
      S.keyTest = null;
      const box = $('#keyTestBox'); if (box) box.innerHTML = keyTestBox();
    }
    return;
  }
  if (t.id === 'nick' || t.id === 'code') { S.drafts[t.id] = t.value; return; }
});

// 公共对话记录：只有用户本来就贴在底部时，新消息才自动滚到底
document.addEventListener('scroll', (e) => {
  const el = e.target;
  if (el && el.id === 'log') S.logPinned = (el.scrollHeight - el.scrollTop - el.clientHeight) < 48;
}, true);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && $('#ask')) { e.preventDefault(); doSend(); }
  // 任何交互都算活动信号（服务端据此推导挂机状态；只上报"有活动"这一事实）
  if (S.connected) send({ t: 'activity', hidden: document.visibilityState !== 'visible' });
});

document.addEventListener('visibilitychange', () => {
  if (S.connected) send({ t: 'activity', hidden: document.visibilityState !== 'visible' });
});

/* ============================================================================
 * 启动
 * ==========================================================================*/
(async () => {
  try {
    S.config = await api('/api/config');
  } catch { /* 忽略：入口页会用默认文案 */ }
  if (token()) {
    try {
      const me = await api('/api/session');
      S.me = { roomId: me.roomId, memberId: me.memberId, token: token() };
      S.view = me.view; S.screen = 'room';
      if (S.view && S.view.room) S.serverOffset = S.view.room.serverTime - Date.now();
      startPolling();
    } catch { clearSession(); }
  }
  startTicker();          // 倒计时按秒走（只改文本/进度条，不整页重渲染）
  render();
})();
</script>
</body>
</html>
