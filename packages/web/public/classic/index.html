<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>AI 海龟汤</title>
<!--
  M1 本地服务器版前端（阶段性实现：零依赖、直接吃同一份 @ht/core 语义）。
  正式客户端将按《阶段1》§3.1 换成 React + Vite，并把 packages/web 作为构建产物目录；
  当前这一版是"能真正联机试玩"的最小实现，用来验证服务端行为与交互节奏。
  安全前提：本页面**永远不接触 API Key 明文**——房主提交的 Key 只在服务端加密存储，
  页面拿到的只有掩码；所有判定与汤底都在服务端。
-->
<style>
  /* ==========================================================================
   * 设计令牌
   * ========================================================================*/
  :root{
    --bg:#0b0d14;
    --panel:rgba(26,30,45,.78);
    --panel-2:rgba(20,23,35,.9);
    --line:rgba(255,255,255,.075);
    --line-2:rgba(255,255,255,.14);
    --fg:#e9ecf5;--fg2:#a7aec4;--fg3:#6d7690;
    --ok:#41d69b;--warn:#f3b95f;--bad:#f2606b;--info:#5aa9f8;
    --accent:#7c6cf5;--accent-2:#5a49d8;--cyan:#48c9e8;
    --radius:16px;--radius-sm:10px;
    --shadow:0 18px 40px -24px rgba(0,0,0,.9);
    --ring:0 0 0 3px rgba(124,108,245,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(1100px 620px at 12% -10%, rgba(124,108,245,.20), transparent 60%),
      radial-gradient(900px 520px at 105% 0%, rgba(72,201,232,.14), transparent 62%),
      radial-gradient(700px 500px at 50% 120%, rgba(65,214,155,.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--fg);
    font:15px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(124,108,245,.35)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:99px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);background-clip:content-box}

  /* ==========================================================================
   * 基础控件
   * ========================================================================*/
  button{
    font:inherit;font-weight:500;color:var(--fg);
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
    border:1px solid var(--line-2);border-radius:var(--radius-sm);
    padding:9px 14px;cursor:pointer;
    transition:transform .12s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease;
  }
  button:hover:not(:disabled){border-color:rgba(124,108,245,.55);box-shadow:0 6px 18px -12px rgba(124,108,245,.9);transform:translateY(-1px)}
  button:active:not(:disabled){transform:translateY(0)}
  button:focus-visible{outline:none;box-shadow:var(--ring)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;font-weight:650;box-shadow:0 12px 28px -16px rgba(124,108,245,1)}
  button.primary:hover:not(:disabled){filter:brightness(1.08)}
  button.danger{border-color:rgba(242,96,107,.42);color:#ffc2c7}
  button.danger:hover:not(:disabled){border-color:rgba(242,96,107,.8);box-shadow:0 6px 18px -12px rgba(242,96,107,.9)}
  button.ghost{background:transparent}
  input,textarea,select{
    font:inherit;color:var(--fg);background:rgba(9,11,18,.72);
    border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:10px 12px;width:100%;
    transition:border-color .18s ease,box-shadow .18s ease;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(124,108,245,.7);box-shadow:var(--ring)}
  textarea{resize:vertical;min-height:74px;line-height:1.7}
  code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.92em;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:6px}

  /* ==========================================================================
   * 布局
   * ========================================================================*/
  .wrap{max-width:1180px;margin:0 auto;padding:18px 18px 96px}
  .grid{display:grid;grid-template-columns:308px minmax(0,1fr);gap:16px;align-items:start}
  /* ==========================================================================
   * 移动端（≤900px）：单列 + 重新排序
   * 目标：把「谁在发言 → 汤面 → 记录 → 提问输入框」连成一条线，输入框停在拇指边，
   *       不用在题目和输入框之间来回滚。
   * 做法：两栏容器 display:contents 摘掉外壳，让每张卡片在盒模型上变成 .grid 的
   *       直接子项，再用 order 逐个排序。桌面端（>900px）仍是原来的两栏 grid。
   * 注意：这里**不能**写 `.grid>.speakerbox` 这类子选择器 —— display:contents 只改
   *       盒模型，DOM 树上卡片仍然是 .col-main 的子节点，`>` 一个都匹配不到
   *       （踩过一次：order 全部静默失效，手机上顺序毫无变化）。所以统一用类名选择器；
   *       下面这些类名只在房间视图里出现，不会误伤别的页面。
   * ========================================================================*/
  @media(max-width:900px){
    .grid{display:flex;flex-direction:column;gap:0;align-items:stretch}
    .col-main,.col-side{display:contents}
    .topmsg{order:10}
    .speakerbox{order:15}
    .puzzle-card{order:30}
    .your-turn{order:35}
    .records{order:38}
    .composer{order:40}
    .stats{order:50}
    .engine{order:60}
    .settled{order:75}
    .bannerbox{order:80}
    .aicard,.waitcard,.candcard{order:85}
    .roomcard{order:90}
    .memlist{order:92}
    .creditcard{order:94}

    /* 玩家卡片在手机上拆开：发言者 / 倒计时置顶，名单沉到底部当参考信息 */
    .playercard{display:contents}
    .speakerbox,.memlist{
      background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
      padding:13px;margin-bottom:12px;box-shadow:var(--shadow);backdrop-filter:blur(10px);
    }

    /* 汤面卡片：把「提示 / 提交推理·揭秘」这一行抬到卡片顶部。
       手机上输入框吸附在底部时会盖住卡片末尾，而这一行是**操作**（揭秘是胜负手），
       放在下面等于被永久遮住；抬到顶部就永远看得见。 */
    .puzzle-card{display:flex;flex-direction:column}
    .puzzle-card>.spread{order:-2}
    .puzzle-card .actions{order:-1;margin-bottom:12px}
    .puzzle-card>.hr{display:none}

    /* 输入框：只要对局在进行中就吸附在屏幕底部 —— 边看题/边看记录边打字。
       吸附时收掉标题行、压矮输入区，把屏幕让给汤面和记录。 */
    .composer.sticky{
      position:sticky;bottom:0;z-index:30;
      background:linear-gradient(180deg,rgba(18,20,32,.97),rgba(12,14,23,.99));
      border-color:rgba(124,108,245,.45);
      box-shadow:0 -14px 34px -16px rgba(0,0,0,.92);
      padding-bottom:calc(13px + env(safe-area-inset-bottom,0px));
    }
    .composer.sticky .spread{display:none}
    .composer.sticky textarea{min-height:52px}

    /* 收紧留白的那几条放在本文件末尾的同名媒体查询里：它们和基础规则同权重，
       必须写在基础规则之后才生效（否则被上面的 .card / .log 覆盖成没写）。 */
  }
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .stack{display:flex;flex-direction:column;gap:14px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px);
  }
  .card>h3{margin:0 0 12px;font-size:13px;font-weight:650;letter-spacing:.06em;color:var(--fg2);text-transform:none}
  .dim{color:var(--fg3);font-size:12px;line-height:1.6}
  .muted{color:var(--fg2)}
  .hr{height:1px;background:var(--line);margin:12px 0}
  .empty{padding:18px 8px;text-align:center;color:var(--fg3);font-size:13px}

  /* 顶部品牌条 */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:2px 0 18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px}
  .brand .logo{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;
    background:linear-gradient(140deg,var(--accent),var(--cyan));box-shadow:0 12px 26px -14px rgba(124,108,245,1);
  }
  .brand .name{font-size:16.5px;font-weight:700;letter-spacing:.01em}
  .brand .sub{font-size:11.5px;color:var(--fg3)}
  .topchips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    font-size:11.5px;color:var(--fg2);border:1px solid var(--line);border-radius:999px;
    padding:4px 10px;background:rgba(255,255,255,.035);display:inline-flex;align-items:center;gap:6px;
  }
  .chip b{color:var(--fg);font-weight:650}

  .pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;
    border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--fg2);white-space:nowrap}
  .pill.l1{color:#9fe3c0;border-color:rgba(65,214,155,.4);background:rgba(65,214,155,.10)}
  .pill.l2{color:#f3d69a;border-color:rgba(243,185,95,.4);background:rgba(243,185,95,.10)}
  .pill.l3{color:#ffb0b7;border-color:rgba(242,96,107,.4);background:rgba(242,96,107,.10)}
  .pill.accent{color:#d9d3ff;border-color:rgba(124,108,245,.5);background:rgba(124,108,245,.16)}
  .pill.live{color:#c9f7e4;border-color:rgba(65,214,155,.5);background:rgba(65,214,155,.16)}

  .notice{
    font-size:12.5px;color:#ffe0ab;background:linear-gradient(180deg,rgba(243,185,95,.14),rgba(243,185,95,.07));
    border:1px solid rgba(243,185,95,.32);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;
  }
  .err{
    font-size:12.5px;color:#ffc2c7;background:linear-gradient(180deg,rgba(242,96,107,.14),rgba(242,96,107,.06));
    border:1px solid rgba(242,96,107,.34);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;
  }

  /* ==========================================================================
   * 玩家列表（与"谁在发言"合并展示）
   * ========================================================================*/
  .speaker{
    display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-sm);
    background:linear-gradient(140deg,rgba(124,108,245,.22),rgba(72,201,232,.10));
    border:1px solid rgba(124,108,245,.42);box-shadow:0 14px 30px -22px rgba(124,108,245,1);
  }
  .speaker.idle{background:rgba(255,255,255,.035);border-color:var(--line);box-shadow:none}
  .speaker .who{font-size:14.5px;font-weight:700}
  .speaker .what{font-size:11.5px;color:var(--fg2)}
  .speaker .time{margin-left:auto;text-align:right}
  .speaker .time .t{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .speaker .time .l{font-size:10.5px;color:var(--fg3);letter-spacing:.08em}

  /* 统计条（提问 / 线索 / 提示 / 探索度） */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{
    flex:1 1 92px;min-width:92px;border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:10px 12px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  }
  .stat.grow{flex:2 1 220px}
  .stat .v{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.25}
  .stat .l{font-size:11px;color:var(--fg3);letter-spacing:.06em}
  .meter{height:8px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid var(--line);overflow:hidden}
  .meter>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--accent));transition:width .35s ease}
  .dots{letter-spacing:2px;color:#ffd79a;font-size:12px}
  .dots .dim{color:var(--fg3)}

  /* 汤主状态条 */
  .engine{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12.5px;
    border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:var(--radius-sm);
    padding:10px 12px;margin-bottom:14px;background:linear-gradient(90deg,rgba(124,108,245,.14),rgba(255,255,255,.02));
  }
  .engine b{font-size:13px}
  .engine button{padding:5px 10px;font-size:12px}

  /* 轮到你的提醒 */
  .your-turn{
    border:1px solid rgba(65,214,155,.5);background:linear-gradient(90deg,rgba(65,214,155,.18),rgba(65,214,155,.05));
    color:#c9f7e4;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;font-size:13px;font-weight:600;
    animation:glow 1.6s ease-in-out infinite;
  }
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(65,214,155,.35)}50%{box-shadow:0 0 0 7px rgba(65,214,155,0)}}
  .puz-src{font-size:11.5px;color:var(--fg3)}
  .puz-src a{color:var(--cyan);text-decoration:none}

  .mem{
    display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-sm);
    border:1px solid transparent;transition:background .18s ease,border-color .18s ease;
  }
  .mem+.mem{margin-top:2px}
  .mem:hover{background:rgba(255,255,255,.04)}
  .mem.turn{background:rgba(124,108,245,.14);border-color:rgba(124,108,245,.42)}
  .mem.turn .nm{font-weight:700}
  .mem.away{opacity:.55}
  .avatar{
    width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;
    font-size:13.5px;font-weight:700;color:#fff;position:relative;
    background:linear-gradient(140deg,hsl(var(--h,255) 68% 58%),hsl(calc(var(--h,255) + 42) 64% 46%));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  }
  .mem.turn .avatar{box-shadow:0 0 0 2px rgba(124,108,245,.55),inset 0 1px 0 rgba(255,255,255,.3);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 2px rgba(124,108,245,.5)}50%{box-shadow:0 0 0 6px rgba(124,108,245,.12)}}
  .mem .nm{font-size:13.5px;font-weight:550;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mem .meta{margin-left:auto;text-align:right;font-size:11.5px;color:var(--fg3);white-space:nowrap;display:flex;align-items:center;gap:8px}
  .mem .meta .kick{padding:3px 8px;font-size:11px;color:#ffc2c7;border-color:rgba(242,96,107,.35);opacity:.75}
  .mem .meta .kick:hover{opacity:1}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
  .dot.active{background:var(--ok);box-shadow:0 0 8px rgba(65,214,155,.8)}
  .dot.idle{background:var(--warn)}
  .dot.off{background:#59607a}

  /* ==========================================================================
   * 回合条 / 计时
   * ========================================================================*/
  .turnbar{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);backdrop-filter:blur(10px);
  }
  .turnbar .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .turnbar .round{font-size:15px;font-weight:700}
  .turnbar .timer{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums;margin-left:auto;letter-spacing:.02em}
  .bar{height:9px;background:rgba(0,0,0,.45);border-radius:99px;overflow:hidden;margin-top:11px;border:1px solid var(--line)}
  .bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),#7ee0b8);transition:width .2s linear}
  .bar.grace>i{background:linear-gradient(90deg,var(--warn),#ffd79a)}
  .bar.paused>i{background:linear-gradient(90deg,#5a6070,#7b8296)}
  .bar.urgent>i{background:linear-gradient(90deg,var(--bad),#ff9aa3);animation:pulseBar 1s ease-in-out infinite}
  @keyframes pulseBar{0%,100%{opacity:1}50%{opacity:.6}}

  /* ==========================================================================
   * 汤面
   * ========================================================================*/
  .puzzle{
    position:relative;border-radius:var(--radius-sm);padding:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));
    border:1px solid var(--line-2);overflow:hidden;
  }
  .puzzle::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(180deg,var(--accent),var(--cyan))}
  .puzzle .ptitle{font-size:18px;font-weight:750;letter-spacing:.01em}
  .puzzle .surface{font-size:15.5px;line-height:1.85;white-space:pre-wrap;margin-top:10px;color:#eef1f9}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* ==========================================================================
   * 公共记录（只放记录）
   * ========================================================================*/
  .log{display:flex;flex-direction:column;gap:9px;max-height:52vh;overflow:auto;padding:2px 4px 2px 0}
  .log .qa{
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
    border:1px solid var(--line);border-left:3px solid var(--line-2);
    border-radius:var(--radius-sm);padding:10px 12px;
  }
  .log .qa.mine{border-left-color:var(--accent);background:linear-gradient(180deg,rgba(124,108,245,.14),rgba(124,108,245,.04))}
  .log .qa.yes{border-left-color:rgba(65,214,155,.75)}
  .log .qa.no{border-left-color:rgba(242,96,107,.75)}
  .log .qa.irrelevant{border-left-color:rgba(255,255,255,.16)}
  .log .qa.unanswerable{border-left-color:rgba(243,185,95,.7)}
  .log .qa .head{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--fg2)}
  .log .qa .head .who{font-weight:650;color:var(--fg)}
  .log .qa .q{margin-top:5px;white-space:pre-wrap;font-size:14.5px}
  .log .qa .a{margin-top:7px;font-size:12.5px;color:var(--fg2);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .log .qa .a .verdict{font-weight:750;font-size:13px}
  .log .qa .a .verdict.yes{color:var(--ok)}
  .log .qa .a .verdict.no{color:var(--bad)}
  .log .qa .a .verdict.irrelevant{color:var(--fg2)}
  .log .qa .a .verdict.unanswerable{color:var(--warn)}
  .log .qa .explain{color:#cfd5e6;font-style:italic;border-left:2px solid var(--line-2);padding-left:8px;margin-top:6px;display:block}
  .log .qa .late{color:var(--warn)}

  /* ==========================================================================
   * 全员讨论区（房间内自由发言，不参与判定）
   * 自己的消息右对齐（暖色便笺），别人的左对齐；纯文本渲染，绝不注入 HTML
   * ========================================================================*/
  .chat{display:flex;flex-direction:column;gap:8px;max-height:34vh;overflow:auto;padding-right:3px}
  .chat .msg{max-width:86%;border-radius:12px;padding:7px 11px;font-size:13px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--line)}
  .chat .msg.mine{align-self:flex-end;background:linear-gradient(180deg,rgba(243,185,95,.20),rgba(243,185,95,.08));
    border-color:rgba(243,185,95,.34)}
  .chat .msg .who{font-size:10.5px;color:var(--fg3);margin-bottom:2px}
  .chat .msg .txt{white-space:pre-wrap;word-break:break-word;line-height:1.6}
  /* 跨局分隔线：居中的细线 + 小字，和消息便笺明显区分（§12.8） */
  .chat .chatsep{display:flex;align-items:center;gap:8px;margin:2px 0;color:var(--fg3);font-size:11px;white-space:nowrap}
  .chat .chatsep::before,.chat .chatsep::after{content:'';flex:1 1 auto;height:1px;background:var(--line)}
  .chatcard .row input{flex:1 1 auto;min-width:0}
  .chatcard .counter{font-size:11px;color:var(--fg3);white-space:nowrap;align-self:center}
  .chatcard .badge{display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:999px;
    background:var(--accent);color:#1b1305;font-size:10.5px;font-weight:700;line-height:16px;text-align:center}
  .chatcard .pill.jump{cursor:pointer;border:1px solid rgba(243,185,95,.5)}

    .chatcard{display:none}

  /* ==========================================================================

    /* 吸附时把记录压矮一点，保证刚判完的那一条不被输入框盖住 */

<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">🐢</div>
      <div>
        <div class="name">AI 海龟汤</div>
        <div class="sub">情境推理 · 只能问「是 / 否」</div>
      </div>
    </div>
    <div class="topchips">
      <span class="chip" id="roomChip" hidden></span>
      <span class="chip">🔒 密钥只在服务端加密存储</span>
      <span class="chip" id="connChip">⚡ Cloudflare Workers + D1</span>
    </div>
  </div>
  <div id="app"></div>
</div>

<script>
/* ============================================================================
 * 客户端状态与工具
 * ==========================================================================*/
const LS_TOKEN = 'ht.classic.token';
const LS_DRAFT = 'ht.classic.draft';           // 预输入草稿：只存本机，绝不上传（隐私红线）
const LS_NICK = 'ht.classic.nickname';

const S = {
  screen: 'entry',                      // entry | room
  error: '',
  notice: '',
  config: null,                         // GET /api/config
  me: null,                             // { roomId, memberId, token }
  view: null,                           // 最近一次 RoomView
  connected: false,
  lastSeq: 0,
  ack: {},
  pendingTimeline: [],                  // 系统事件（来自 room_events）
  questions: [],                        // 公共提问记录（来自 questions 表，所有人都能看到）
  log: [],                              // 合并后的公共对话记录（提问 + 系统事件，按时间排序）
  logPinned: true,                      // 用户是否停在记录底部（是则新消息自动滚到底）
  renderPending: false,                 // 输入/拖拽期间被推迟的渲染（操作结束后补一次）
  lastFingerprint: '',                  // 上次渲染对应的状态指纹（相同就不再碰 DOM）
  preset: 'standard',                   // 入口页选中的对局预设
  keyProvider: 'deepseek',              // 自备 Key 的提供方预设
  aiPuzzle: null,                       // AI 创作状态：{pending} | {puzzleId,title,surface,warnings} | {error,issues}
  lastFailDetail: null,                 // 上一次动作失败时的 detail（供具体功能展示细节）
  lastFailMessage: '',
  drafts: {},                            // 弹窗输入的临时值：只在本页内存里，重渲染不丢；关闭即清
  serverOffset: 0,                      // 服务端时钟 - 本机时钟（计时用服务端时间为准）
  hint: '',  recap: null,
  // 全员讨论区：消息、增量游标、草稿（只在内存里，和正式提问草稿分开）、未读数
  chat: [], chatSeq: 0, chatDraft: '', chatReadSeq: 0, chatUnread: 0,
  // chatOpen：窄屏的讨论面板是否打开（桌面端忽略，侧栏一直看得见）
  // chatPinned：讨论列表是否停在底部 —— 停在底部才自动跟随新消息，也才算"已读"
  chatOpen: false, chatPinned: true, chatScrollToBottom: false,
  keyMask: null,
  keyTest: null,
  configModal: false,
  guessModal: false,
  truthModal: false,                     // "汤底公示"弹窗（被猜出时自动弹一次）
  truthDismissedKey: '',                 // 已经点过"返回"的那一局（避免每轮重渲染又弹出来）
  keyModal: false,
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = (ms) => { ms = Math.max(0, ms | 0); const t = Math.ceil(ms / 1000); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const nowMs = () => Date.now();
/** 服务端当前时间（以服务端快照为基准对齐本机时钟） */
const serverNow = () => Date.now() + S.serverOffset;

/* ---------------------------------------------------------------- 全员讨论区
 * 只统计"别人发的、我还没看到的"未读数；未读纯属前端提示，不改房间/对局状态。
 * 打开讨论区并停在底部即视为已读（chatReadSeq 推进到最新）。
 * ------------------------------------------------------------------------- */
/** 单条讨论消息长度上限，与服务端 `PLATFORM.chatMaxLen` 对齐（这里只用于输入框提示与字数显示） */
const CHAT_MAXLEN = 500;
function countChatUnread() {
  const meId = S.view && S.view.you ? S.view.you.memberId : '';
  S.chatUnread = S.chat.filter((m) => (m.chatSeq || 0) > S.chatReadSeq && m.memberId !== meId).length;
}
function markChatRead() {
  // ⚠️ 必须跳过本地乐观条目：它的 chatSeq 是哨兵值（CHAT_LOCAL_SEQ = 最大整数），
  // 一旦算进 max，chatReadSeq 会被顶到最大整数 → 之后**所有**新消息都被判成"已读"，
  // 未读角标再也不出现（真缺陷，E2E 抓到的）。
  const newest = S.chat.reduce((mx, m) => (m.pending === true ? mx : Math.max(mx, m.chatSeq || 0)), 0);
  if (newest > S.chatReadSeq) { S.chatReadSeq = newest; countChatUnread(); }
}
/** 时刻 → HH:MM:SS（用于对话记录） */
const fmtClock = (at) => { try { return new Date(at).toLocaleTimeString('zh-CN', { hour12: false }); } catch { return ''; } };
/**
 * 元素此刻是否真的看得见（display:none / 被折叠都算看不见）。
 * 讨论区的"已读"判定必须建立在它之上：手机上面板没打开时列表是隐藏的，
 * 把隐藏列表当成"停在底部"会把人没看过的消息标成已读。
 * 测试用的 DOM 桩没有 getBoundingClientRect，这里要容错（否则整页渲染会抛）。
 */
function isVisible(el) {
  if (!el || el.offsetParent === null) return false;
  const r = typeof el.getBoundingClientRect === 'function' ? el.getBoundingClientRect() : null;
  return r ? r.height > 0 : true;
}
/** 讨论列表的 HTML（整页渲染与局部补渲染共用同一份，避免两处写法漂移） */
function chatListHtml() {
  const meId = S.view && S.view.you ? S.view.you.memberId : '';
  const msgs = S.chat.slice(-80);
  if (!msgs.length) return '<div class="empty">还没人说话。想商量就打个招呼。</div>';
  // 跨局分隔线（§12.8）：局号变化时插一条「第 N 局开始」，让旧消息仍可查、但一眼看得出分界。
  // 0 = 还没开过局（等待/选题阶段）不打线；第一条就属于第 N 局时也要打，否则看不出从哪局开始。
  const parts = [];
  let prevMatch = null;
  for (const m of msgs) {
    const mn = m.matchNo || 0;
    if (mn !== prevMatch && mn >= 1) parts.push(`<div class="chatsep"><span>第 ${mn} 局开始</span></div>`);
    prevMatch = mn;
    parts.push(chatEntry(m, meId));
  }
  return parts.join('');
}
/** 讨论卡片右上角：未读提示 / 「有 N 条新消息 ↓」入口（§12.7） */
function chatPillHtml() {
  const unread = S.chatUnread || 0;
  const n = unread > 99 ? '99+' : unread;
  // 用户正在往上翻旧消息：**不强行拉到底**，只给一个入口
  if (unread && !S.chatPinned) return `<button class="pill live jump" id="btnChatJump">有 ${n} 条新消息 ↓</button>`;
  return `<span class="pill ${unread ? 'live' : ''}">${unread ? `${n} 条新消息` : '房间内自由发言'}</span>`;
}
/**
 * 局部补渲染讨论区。
 *
 * 为什么需要它：整页是 innerHTML 全量重渲染，而 `isBusy()`（输入框带焦点 / 正在组字）会把
 * 重渲染整个推迟 —— 否则中文输入法组字会被打断。可只要用户把光标留在输入框里，
 * **整个页面就再也不更新**。所以被推迟时至少把讨论区补上：只替换列表与角标这几块，
 * 绝不碰输入框本身，组字安全。
 */
function patchChatList() {
  if (!S.view || S.screen !== 'room') return;
  const log = $('#chatLog');
  if (!log) return;
  log.innerHTML = chatListHtml();
  const pill = $('#chatPill');
  if (pill) pill.innerHTML = chatPillHtml();
  const cnt = $('#chatCount');
  if (cnt) cnt.textContent = `${S.chat.length} 条`;
  if (S.chatPinned) log.scrollTop = log.scrollHeight;
}

/* ---------------------------------------------------------------- 计时（按秒走）
 * 轮询每 1.8 秒才回来一次，但倒计时必须按秒动，所以这里单独跑一个轻量 ticker：
 *   · 只更新带 data-deadline 的文本 / 带 data-bar 的进度条，**不重渲染整个界面**
 *     （整页重渲染会摧毁正在输入的输入框——这正是"API Key 打一半就没了"的根因）
 *   · 归零时催一次轮询，让服务端做惰性推进（超时跳过 / 投票截止…）
 * ------------------------------------------------------------------------- */
let tickTimer = null;
let zeroNudgedAt = 0;
function startTicker() {
  if (tickTimer) return;
  tickTimer = setInterval(tickUi, 250);
  tickUi();
}
function tickUi() {
  const now = serverNow();
  let anyExpired = false;
  document.querySelectorAll('[data-deadline]').forEach((el) => {
    const left = Math.max(0, Number(el.getAttribute('data-deadline')) - now);
    const text = el.getAttribute('data-format') === 'plain' ? `${Math.ceil(left / 1000)} 秒` : fmt(left);
    if (el.textContent !== text) el.textContent = text;
    if (left <= 0) anyExpired = true;
  });
  document.querySelectorAll('[data-bar]').forEach((el) => {
    const left = Math.max(0, Number(el.getAttribute('data-deadline')) - now);
    const total = Math.max(1, Number(el.getAttribute('data-total')) || 1);
    const pct = Math.max(0, Math.min(100, (left / total) * 100));
    el.style.width = `${pct}%`;
  });
  if (anyExpired && S.view && token() && !pollInFlight && Date.now() - zeroNudgedAt > 1500) {
    zeroNudgedAt = Date.now();
    void pollOnce();
  }
}

function token() { return localStorage.getItem(LS_TOKEN) || ''; }
function saveSession(roomId, memberId, tok) {
  S.me = { roomId, memberId, token: tok };
  // 只存会话凭证，不存任何密钥或汤底（汤底服务端根本不下发）
  localStorage.setItem(LS_TOKEN, tok);
}
/**
 * 会话代次：每次"会话结束"（主动离开 / 令牌失效 / 房间被清理）+1。
 * 所有跨网络的异步回调（轮询、动作）都在发起前记下代次，回来时对不上就**整包丢弃**。
 * 否则会出现这类竞态：点「离开」时已有一个轮询在飞，它比离开请求晚回来，
 * 于是把房间页又渲染回来（或写上一句 HTTP 404），页面卡死只能刷新。
 */
let sessionEpoch = 0;

function clearSession() {
  sessionEpoch++;
  S.connected = false;             // 别再用旧会话的"已连接"去上报活动/心跳
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_DRAFT);
  S.me = null;
  S.view = null;
  S.drafts = {};                 // 会话结束：连同内存里的 API Key 草稿一起丢掉
  S.questions = [];
  S.log = [];
}

/** 房间在服务端已经不存在（最后一人离开会立刻清理 / 过期回收）：回入口页，别一直重试 */
function roomGone(message = '房间已结束或已被清理，请重新创建或加入房间') {
  const wasInRoom = S.screen === 'room';
  clearSession();
  stopPolling();
  S.screen = 'entry';
  S.view = null;
  S.error = '';
  S.notice = wasInRoom ? message : '';
  render();
}

async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json', ...(opts.headers || {}) };
  if (token()) headers.authorization = `Bearer ${token()}`;
  const res = await fetch(path, { ...opts, headers });
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = { raw: text }; }
  if (!res.ok) {
    const err = new Error((body && (body.error || body.message)) || `HTTP ${res.status}`);
    err.status = res.status;
    err.body = body;              // 保留响应体：错误码/真实请求地址等诊断信息要用
    throw err;
  }
  return body;
}

/* ============================================================================
 * 传输层：轮询（方案 A：D1 + 惰性推进，无 WebSocket / 无 Durable Objects）
 *
 *  · 每 1.8 秒 GET /api/rooms/state?since=<seq>
 *      一次请求同时拿到【权威状态快照】+【时间线】+【新事件】+【最新 seq】
 *  · 动作走 POST /api/rooms/actions，响应里自带本次事件 → 自己的操作零等待
 *  · 心跳 20 秒一次（服务端断连判定 60 秒）；页面交互上报"活动"（挂机判定用）
 *  · 服务端每个请求都会先"惰性补算"过期事件（超时跳过/挂机/移交/投票截止），
 *    所以即使没有服务器定时器，语义也与"每秒 tick"等价
 * ==========================================================================*/
let pollTimer = null;
let hbTimer = null;
let pollInFlight = false;

/**
 * 讨论区乐观条目的 chatSeq 哨兵值：真实 seq 由服务端 SQL 分配（MAX+1），本地不等往返就先显示。
 * 用最大整数是**故意**的 —— 排序时它必然落在最下面（自己刚发的就是最新一条），
 * 而且它只活在 S.chat 数组里，服务端真值一到就按 clientMessageId 原地替换。
 */
const CHAT_LOCAL_SEQ = Number.MAX_SAFE_INTEGER;

/** {t:...} 帧 → 服务端动作（保持原有调用点不变） */
const ACTIONS = {
  next_round: () => ({ type: 'next_round' }),
  submit: (f) => ({ type: 'submit', turnSeq: f.turnSeq, text: f.text, clientSubmitId: f.clientSubmitId }),
  hint: (f) => ({ type: 'hint', tier: f.tier }),
  guess: (f) => ({ type: 'guess', text: f.text }),
  vote: (f) => ({ type: 'vote', choice: f.choice }),
  config: (f) => ({ type: 'config', patch: f.patch, expectedVersion: f.expectedVersion }),
  start: (f) => ({ type: 'start', mode: f.mode ?? 'pick', ...(f.puzzleId ? { puzzleId: f.puzzleId } : {}), ...(f.force ? { force: true } : {}) }),
  resume_transfer: () => ({ type: 'resume_transfer' }),
  return_host: () => ({ type: 'return_host' }),
  decline_return: () => ({ type: 'decline_return' }),
  ready: (f) => ({ type: 'ready', ready: f.ready !== false }),
  kick: (f) => ({ type: 'kick', memberId: f.memberId }),
  create_ai_puzzle: () => ({ type: 'create_ai_puzzle' }),
  reenable_key: (f) => ({ type: 'reenable_key', yes: f.yes === true }),
  revoke_key: () => ({ type: 'revoke_key' }),
  skip_turn: () => ({ type: 'skip_turn' }),
  end_match: () => ({ type: 'end_match' }),
};

function startPolling() {
  if (!token()) return;
  stopPolling();
  startTicker();
  // 1.2 秒一轮：4 人玩 30 分钟约 6000 次请求，远低于免费额度（10 万/天），
  // 但别人动作的传播延迟从 ~0.9s 降到 ~0.6s。配合"状态没变就不重渲染"，开销可忽略。
  pollTimer = setInterval(() => { void pollOnce(); }, 1200);
  hbTimer = setInterval(() => { void sendAction({ type: 'heartbeat', hidden: document.visibilityState !== 'visible' }, { silent: true }); }, 20000);
  void pollOnce();
}

function stopPolling() {
  if (pollTimer) clearInterval(pollTimer);
  if (hbTimer) clearInterval(hbTimer);
  pollTimer = null;
  hbTimer = null;
}

async function pollOnce() {
  if (pollInFlight || !token()) return;
  const epoch = sessionEpoch;
  pollInFlight = true;
  try {
    const res = await fetch(`/api/rooms/state?since=${S.lastSeq}&chatSince=${S.chatSeq}`, { headers: { authorization: `Bearer ${token()}` } });
    // 响应回来时如果会话已经结束（用户已离开 / 房间被清理），整包丢弃：
    // 既不能把页面拉回房间，也不能写一句"连接中断（HTTP 404）"把入口页卡住。
    if (epoch !== sessionEpoch || !token()) return;
    if (res.status === 401) { expireSession(); return; }
    // 404 有两种，必须分开：ROOM_NOT_FOUND = 房间真没了（回入口页）；
    // 其它 404（例如路由不存在 = 前后端版本不匹配）是连接问题，要照实报出来，不能悄悄踢人。
    if (res.status === 404) {
      const body = await res.json().catch(() => null);
      if (body && body.error === 'ROOM_NOT_FOUND') { roomGone(); return; }
      throw new Error(`HTTP 404${body && body.path ? ` ${body.path}` : ''}`);
    }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (epoch !== sessionEpoch) return;
    S.connected = true;
    S.error = '';
    applyState(data);
  } catch (err) {
    if (epoch !== sessionEpoch) return;
    S.connected = false;
    S.error = `连接中断（${err.message}），正在重试…`;
    render();
  } finally {
    pollInFlight = false;
  }
}

/** 应用服务端返回的 { view, timeline, questions, events, seq } */
function applyState(data) { applyViewPayload(data); }

/** 把一份服务端载荷铺进本地状态（轮询与动作响应共用同一条路径） */
function applyViewPayload(data) {
  if (data.view) {
    S.view = data.view;
    S.screen = 'room';
    // 用服务端时间做基准，避免本机时钟偏差把倒计时算歪
    if (data.view.room && typeof data.view.room.serverTime === 'number') {
      S.serverOffset = data.view.room.serverTime - Date.now();
    }
  }
  if (Array.isArray(data.timeline)) {
    S.pendingTimeline = data.timeline.map((t) => ({
      seq: t.seq, kind: t.kind, text: t.text, at: t.at, meta: t.meta,
      memberId: t.memberId ?? null, answer: t.answer, reasonCode: t.reasonCode, source: t.source,
    }));
  }
  if (Array.isArray(data.questions)) {
    S.questions = data.questions.map((q) => ({
      at: q.at, kind: 'question', memberId: q.memberId, memberName: q.memberName, turnSeq: q.turnSeq,
      text: q.text, answer: q.answer, reasonCode: q.reasonCode, source: q.source, late: q.late === true,
      explain: q.explain || null,
    }));
  }
  S.log = buildLog(S.questions, S.pendingTimeline);
  // 全员讨论区：按 clientMessageId 合并。自己刚发的那条是**乐观条目**（chatSeq 用哨兵值、pending=true），
  // 服务端真值到了就原地替换 —— 不能当成重复直接丢掉，否则它永远停在哨兵位置、pending 也永远不消。
  if (Array.isArray(data.chatMessages) && data.chatMessages.length > 0) {
    let newest = 0;
    for (const m of data.chatMessages) {
      const i = S.chat.findIndex((x) => x.clientMessageId === m.clientMessageId);
      if (i < 0) S.chat.push(m);
      else if (S.chat[i].pending === true || !S.chat[i].chatSeq) S.chat[i] = m;
      if (m.chatSeq > newest) newest = m.chatSeq;
    }
    S.chat.sort((a, b) => (a.chatSeq || a.createdAt) - (b.chatSeq || b.createdAt));
    if (S.chat.length > 200) S.chat = S.chat.slice(-200);
    if (typeof data.chatSeq === 'number' && data.chatSeq > S.chatSeq) S.chatSeq = data.chatSeq;
    else if (newest > S.chatSeq) S.chatSeq = newest;
    countChatUnread();
  }
  if (typeof data.seq === 'number' && data.seq > S.lastSeq) S.lastSeq = data.seq;
  if (Array.isArray(data.events)) {
    for (const e of data.events) if (typeof e.seq === 'number' && e.seq > S.lastSeq) S.lastSeq = e.seq;
  }
  const roomNow = data.view && data.view.room ? data.view.room : null;
  if (roomNow && roomNow.status === 'settled') {
    S.notice = roomNow.truth ? '有人猜出了汤底：已对所有人公示' : '对局已结束，可以查看复盘';
    S.guessModal = false;                       // 结束了就别再挂着"猜汤底"弹窗
    const key = roomNow.truth ? `${roomNow.id}:${roomNow.roundNo}` : '';
    if (key && S.truthDismissedKey !== key) S.truthModal = true;   // 刚被猜出 → 自动弹一次
  } else if (roomNow) {
    // 不在"已结束"状态了（回到选题 / 开了下一局）：清掉"已点过返回"的记录，
    // 否则下一局再被猜出时 roundNo 又是 1，key 相同就再也不弹了（真实缺陷，W9 抓到）
    S.truthDismissedKey = '';
    S.truthModal = false;
  }
  render();
}

/**
 * 公共对话记录 = 所有成员的提问（含判定结果）+ 系统事件，按时间合并排序。
 * 提问来自服务端 questions 表（人人可见），系统事件来自 room_events。
 */
function buildLog(questions, timeline) {
  const qs = (questions || []).map((q) => ({ ...q, text: q.text }));
  const evs = (timeline || []).filter((t) => t.kind !== 'question').map((t) => ({ ...t, kind: t.kind === 'system' ? 'system' : t.kind }));
  return [...qs, ...evs].sort((a, b) => (a.at - b.at) || ((a.seq || 0) - (b.seq || 0)));
}

/**
 * 提交动作；**响应里直接带回最新视图**，所以自己的操作零额外往返（以前要再轮询一次）。
 * 失败时返回 null，并把错误显示出来。
 */
async function sendAction(action, opts = {}) {
  // 没有令牌 = 已经不在房间里（刚离开/被清理）。直接静默返回：
  // 页面上不该出现"会话已失效"这种噪音 —— 用户什么都没做错。
  if (!token()) return null;
  const epoch = sessionEpoch;
  try {
    const res = await fetch('/api/rooms/actions', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: `Bearer ${token()}` },
      body: JSON.stringify(action),
    });
    const data = await res.json().catch(() => ({}));
    // 会话已经结束（用户已离开）：这份响应属于上一个房间，丢弃
    if (epoch !== sessionEpoch || !token()) return null;
    if (res.status === 401) { expireSession(); return null; }
    // 同上：只有 ROOM_NOT_FOUND（房间真没了）才回入口页
    if (res.status === 404 && data && data.error === 'ROOM_NOT_FOUND') { roomGone(); return null; }
    if (!res.ok || data.ok === false) {
      const detail = data.detail && data.detail.errors
        ? '（' + data.detail.errors.map((e) => `${e.path}: ${e.reason}`).join('；') + '）'
        : '';
      S.error = (data.message || `HTTP ${res.status}`) + detail;
      S.lastFailDetail = data.detail ?? null;      // 供具体功能展示细节（例如坏题检测的逐条原因）
      S.lastFailMessage = data.message || '';
      // 失败响应里同样带着**最新视图**：用上它，别让房主对着陈旧状态再点一次
      // （典型场景：有人刚加入还没举手 → 开局被拒 → 不刷新视图就得等 1.2 秒轮询后才能再点）
      if (data.view) applyViewPayload(data);
      else render();
      return null;
    }
    S.error = '';
    if (data.data && data.data.text) S.hint = data.data.text;
    if (!opts.silent) S.notice = noticeFor(action);
    // 响应自带 view/questions/seq → 直接应用，省掉一次往返
    if (data.view) applyViewPayload(data);
    else await pollOnce();
    return data;
  } catch (err) {
    if (epoch !== sessionEpoch) return null;      // 离开房间后才回来的失败，同样丢弃
    S.connected = false;
    S.error = `请求失败：${err.message}`;
    render();
    return null;
  }
}

/** 会话失效（令牌过期/房间销毁）：回到入口页 */
function expireSession() {
  clearSession();
  stopPolling();
  S.screen = 'entry';
  S.view = null;
  S.error = '会话已失效，请重新创建或加入房间';
  render();
}

/** 兼容原有调用点：request({t:'...'}) → 对应动作 */
function request(frame) {
  const map = ACTIONS[frame.t];
  if (!map) { S.error = `未知操作：${frame.t}`; render(); return null; }
  if (frame.t === 'guess') S.guessModal = false;
  void sendAction(map(frame));
  return null;
}

/** 兼容原有调用点：send({t:'activity'|'heartbeat'}) */
function send(frame) {
  if (frame.t === 'activity' || frame.t === 'heartbeat') {
    void sendAction({ type: frame.t, hidden: frame.hidden === true }, { silent: true });
  }
}

/** 主动离开房间：先告诉服务端（最后一人离开会被立即清理），再清本地 */
async function leaveRoom() {
  if (token()) {
    try {
      await fetch('/api/rooms/actions', {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: `Bearer ${token()}` },
        body: JSON.stringify({ type: 'leave' }),
        keepalive: true,
      });
    } catch { /* 网络失败也要允许离开 */ }
  }
  clearSession();
  stopPolling();
  S.screen = 'entry';
  S.view = null;
  S.notice = '';
  S.error = '';
  render();
}

function noticeFor(action) {
  switch (action.type) {
    case 'submit': return '已提交';
    case 'hint': return '提示已发放';
    case 'vote': return '已记录你的表决';
    case 'start': return '对局开始';
    case 'config': return '参数已更新';
    case 'skip_turn': return '已跳过本轮';
    case 'revoke_key': S.keyMask = null; return '已撤销 Key';
    default: return '';
  }
}

/** 兼容：进入房间时用一次状态快照铺满界面 */
function applyView(view) {
  if (!view) return;
  S.view = view;
  S.screen = 'room';
  render();
}

/** 复制到剪贴板（http 页面下 navigator.clipboard 不可用，回落到临时 textarea） */
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch { /* 回落 */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const okCopy = document.execCommand('copy');
    document.body.removeChild(ta);
    return okCopy;
  } catch { return false; }
}

/**
 * 「轮到你了」提醒：切到别的标签页时把标题闪起来，回来后立刻复原。
 * （我们只有一个人能发言，错过回合的代价很高，所以这个提醒是值得的）
 */
let titleTimer = null;
let titleBase = document.title;
function setTitleAlert(on) {
  if (on) {
    titleBase = 'AI 海龟汤';
    if (titleTimer) return;
    let flip = false;
    titleTimer = setInterval(() => {
      flip = !flip;
      document.title = flip ? '🎤 轮到你了！' : titleBase;
    }, 900);
    document.title = '🎤 轮到你了！';
  } else {
    if (titleTimer) { clearInterval(titleTimer); titleTimer = null; }
    document.title = 'AI 海龟汤';
  }
}

/* ============================================================================
 * 渲染
 *
 * ⚠️ 这里是全量 innerHTML 重渲染，而轮询每 1.8 秒就会调一次 render()。
 *    **正在输入时绝不重渲染**：整页 innerHTML 会把输入框整个换掉，
 *    中文输入法正在组字的内容会直接被打断、光标丢失 —— 表现就是"打不进字/一闪一闪"。
 *    输入结束后（失焦或停手 700ms）再补一次渲染，把期间收到的状态追上。
 *    另外仍显式保住：焦点/光标位置、S.drafts 回填的输入值、对话记录是否贴底。
 * ==========================================================================*/
/**
 * 是否"用户正在操作"：输入中 / 鼠标按着拖动 / 有文字选区。
 *
 * 轮询每 1.2 秒回一次，期间**绝不动 DOM**：
 *   · 输入中（含中文输入法组字）→ 输入框被替换会打断组字
 *   · 鼠标按着拖动（选中文字、拖滚动条）→ 节点被替换会打断拖拽与选区，表现为"闪一下"
 *   · 有选区 → 重渲染会清掉选区，用户会以为点错了
 */
function isBusy() {
  if (pointerDown) return true;
  const a = document.activeElement;
  if (a && a.tagName) {
    const editable = a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable === true;
    if (editable && $('#app').contains(a)) return true;
  }
  try {
    const sel = window.getSelection();
    if (sel && !sel.isCollapsed && String(sel).length > 0) return true;
  } catch { /* 忽略 */ }
  return false;
}

let pointerDown = false;

let deferredRenderTimer = null;
function scheduleDeferredRender() {
  if (deferredRenderTimer) clearTimeout(deferredRenderTimer);
  deferredRenderTimer = setTimeout(() => {
    deferredRenderTimer = null;
    if (S.renderPending && !isBusy()) render(true);
  }, 700);
}

/** 操作结束（失焦 / 松开鼠标）后补渲染；延迟一点，避免把正要点击的按钮提前替换掉 */
function flushDeferredRender() {
  setTimeout(() => {
    if (S.renderPending && !isBusy()) render(true);
  }, 250);
}

/**
 * 状态指纹：只有它变了才重渲染。
 *
 * ⚠️ 这里**必须剔除每轮都在变的字段**（`room.serverTime`）：时间戳每 1.2 秒变一次，
 * 一旦进指纹，指纹就永远不同，"状态没变就不动 DOM"直接失效 ——
 * 表现就是整个页面（尤其是弹窗）每 1.2 秒重建一次、入场动画反复重播 = **闪回**。
 * 倒计时不走这里：它由 tickUi() 直接改 `data-deadline` 元素的文本，不需要重渲染。
 */
function stateFingerprint() {
  const t = S.keyTest;
  const view = S.view
    ? { ...S.view, room: S.view.room ? { ...S.view.room, serverTime: 0 } : S.view.room }
    : null;
  return JSON.stringify([
    S.screen, S.connected, S.notice, S.error, S.hint,
    S.configModal, S.guessModal, S.keyModal, S.truthModal,
    // 讨论区：消息条数与未读数进指纹（否则新消息不会触发重渲染）；草稿刻意不进（打字不重渲染）；
    // chatOpen 进指纹（打开/关闭面板要立刻重画）；chatPinned 不进（只看不重画，改了由滚动处理器显式 render）
    S.chat.length, S.chatUnread, S.chatOpen,
    S.keyMask, t ? [t.pending === true, t.ok === true, t.reasonCode, t.message, t.url] : null,
    S.recap ? 1 : 0,
    view, S.questions, S.log.length, S.pendingTimeline.length,
    S.preset, S.keyProvider,
    S.drafts.ask, S.drafts.guessText, S.drafts.keyBase, S.drafts.keyModel, S.drafts.nick, S.drafts.code,
    Object.keys(S.drafts).filter((k) => k.startsWith('cfg:')).map((k) => [k, S.drafts[k]]),
  ]);
}

function render(force = false) {
  const app = $('#app');
  if (!app.firstChild) force = true;                 // 首次渲染必须画
  if (!force && isBusy()) {
    S.renderPending = true;
    // 整页渲染推迟了，但讨论区不能跟着停摆：把列表/角标局部补上（不碰输入框，组字安全）
    patchChatList();
    scheduleDeferredRender();
    return;
  }

  const fingerprint = stateFingerprint();
  if (!force && fingerprint === S.lastFingerprint) return;   // 状态没变：一个字节都不动
  S.renderPending = false;
  S.lastFingerprint = fingerprint;

  const active = document.activeElement;
  const keep = active && active.id && app.contains(active) && typeof active.selectionStart === 'number'
    ? { id: active.id, start: active.selectionStart, end: active.selectionEnd }
    : null;
  const oldLog = $('#log');
  const pinned = oldLog ? (oldLog.scrollHeight - oldLog.scrollTop - oldLog.clientHeight < 48) : S.logPinned;
  // 先抄下旧位置的 scrollTop：下面 innerHTML 一换，#log 是全新节点（scrollTop=0），
  // 再读 log.scrollTop 只能读到 0 → "没贴底"时每次重渲染都被拉回记录最上面。
  const logScrollBefore = oldLog ? oldLog.scrollTop : 0;
  // 讨论列表同理：重渲染前先记住"是不是停在底部"和滚动位置。
  // ⚠️ 不可见时（手机上面板没打开）**不能**当成停在底部 —— 否则会把人没看过的消息算成已读。
  const oldChat = $('#chatLog');
  const chatVisible = isVisible(oldChat);
  // S.chatScrollToBottom：点「有 N 条新消息 ↓」或打开面板时的一次性指令 ——
  // 否则重渲染后会按"重渲染前的位置"还原，把用户又扔回列表顶部（点了个寂寞）。
  const chatPinnedBefore = S.chatScrollToBottom === true
    ? true
    : (oldChat && chatVisible
      ? (oldChat.scrollHeight - oldChat.scrollTop - oldChat.clientHeight < 24)
      : S.chatPinned);
  const chatScrollBefore = oldChat ? oldChat.scrollTop : 0;
  // 弹窗内部可能被滚动过（Key 弹窗、参数弹窗内容多），重渲染后要还原，否则会"跳回顶部"
  const oldModal = document.querySelector('.modal');
  const modalScroll = oldModal ? oldModal.scrollTop : 0;

  if (!S.view || S.screen === 'entry') { app.innerHTML = viewEntry(); bindEntry(); }
  else app.innerHTML = viewRoom();

  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) {
      el.focus();
      try { el.setSelectionRange(keep.start, keep.end); } catch { /* number 输入框不支持选区 */ }
    }
  }
  const log = $('#log');
  // 公共记录：贴在底部 → 跟随最新；往上翻 → 原样还原到用户看的那一行
  if (log) {
    log.scrollTop = pinned ? log.scrollHeight : Math.min(logScrollBefore, log.scrollHeight);
    S.logPinned = pinned;
  }
  // 讨论列表：停在底部 → 跟随到底；往上翻 → 保持原位置（新消息只提示，不强行拉走）
  const chatLog = $('#chatLog');
  if (chatLog) {
    if (chatPinnedBefore) chatLog.scrollTop = chatLog.scrollHeight;
    else chatLog.scrollTop = Math.min(chatScrollBefore, chatLog.scrollHeight);
    const vis = isVisible(chatLog);
    S.chatPinned = vis ? (chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 24) : chatPinnedBefore;
    S.chatScrollToBottom = false;                  // 一次性指令已消费
    if (vis && S.chatPinned) {
      // 看得见 + 停在底部 = 已读。未读数变了就下一拍补一次渲染让角标消失
      // （用 setTimeout 而不是直接递归 render：避免"渲染中再渲染"）
      const before = S.chatUnread;
      markChatRead();
      if (S.chatUnread !== before) setTimeout(() => render(), 0);
    }
  }
  // 窄屏讨论面板打开时锁住页面滚动（面板本身是 fixed 覆盖层）。
  // 容错：测试用的 DOM 桩没有 body.classList / matchMedia。
  const narrow = typeof window.matchMedia === 'function' ? window.matchMedia('(max-width:900px)').matches : false;
  if (document.body && document.body.classList && typeof document.body.classList.toggle === 'function') {
    document.body.classList.toggle('chat-open', Boolean(S.chatOpen && narrow));
  }
  if (modalScroll > 0) {
    const modal = document.querySelector('.modal');
    if (modal) modal.scrollTop = modalScroll;
  }

  // 顶部连接状态（不在房间时不显示连接问题）
  const chip = document.getElementById('connChip');
  if (chip) {
    const inRoom = Boolean(S.view && S.screen === 'room');
    chip.innerHTML = inRoom && !S.connected ? '⚠ 连接中断，正在重试…' : '⚡ Cloudflare Workers + D1';
  }

  // 房号实时显示在顶栏（滚动到哪儿都能看见、随时能念给朋友听）
  const roomChip = document.getElementById('roomChip');
  if (roomChip) {
    const inRoom = Boolean(S.view && S.screen === 'room' && S.view.room);
    if (inRoom) {
      roomChip.hidden = false;
      roomChip.innerHTML = `房号 <b style="letter-spacing:.14em">${esc(S.view.room.code)}</b> · 点我复制`;
      roomChip.style.cursor = 'pointer';
      roomChip.onclick = async () => {
        const okCopy = await copyText(S.view.room.code);
        S.notice = okCopy ? `房号 ${S.view.room.code} 已复制` : `房号：${S.view.room.code}`;
        render();
      };
    } else {
      roomChip.hidden = true;
      roomChip.onclick = null;
    }
  }

  // 轮到你/没轮到你：标题栏提醒（只在自己需要动手时闪）
  const myTurnNow = Boolean(S.view && S.screen === 'room' && S.view.you && S.view.you.canSubmit);
  setTitleAlert(myTurnNow && document.visibilityState !== 'visible');
}

/**
 * 入口页的「创建 / 加入」：留空房间码就新建，否则按房号加入。
 * 单独抽成函数（而不是塞在 onclick 里）是为了能测：离开房间后立刻重开，
 * 上一次会话留下的报错/说明不许带进新房间。
 */
async function joinOrCreate() {
  const nickname = ($('#nick').value || '').trim() || '玩家';
  const code = ($('#code').value || '').trim().toUpperCase();
  const preset = $('#preset').value;
  localStorage.setItem(LS_NICK, nickname);
  S.error = '';
  S.notice = '';                   // 上一次会话的说明（如"房间已被清理"）不要带进新房间
  const res = code
    ? await api(`/api/rooms/${code}/join`, { method: 'POST', body: JSON.stringify({ nickname }) })
    : await api('/api/rooms', { method: 'POST', body: JSON.stringify({ nickname, preset }) });
  saveSession(res.roomId, res.memberId, res.token);
  if (res.view) { S.view = res.view; S.screen = 'room'; }
  startPolling();
  render();
}

function bindEntry() {
  const go = $('#btnGo');
  if (go) go.onclick = async () => {
    try { await joinOrCreate(); } catch (e) { S.error = e.message; render(); }
  };
  const resume = $('#btnResume');
  if (resume) resume.onclick = async () => {
    try {
      const me = await api('/api/session');
      S.me = { roomId: me.roomId, memberId: me.memberId, token: token() };
      S.view = me.view; S.screen = 'room';
      startPolling();
      render();
    } catch (e) {
      // 房间已经没了（长时间没人 → 被回收；或最后一人在离开时立即清理）：给中文说明，不甩错误码
      clearSession();
      if (e.status === 401 || e.status === 404) {
        S.error = '';
        S.notice = '上一个房间已经关闭了（长时间没有人参与，或已经散场）。重新开一局，或在下面输入房号加入。';
      } else {
        S.error = e.message;
      }
      render();
    }
  };
}

  // 另外只要写了草稿也吸附（等待阶段预输入完不被收走）

  const phaseLabel = { ACTIVE: '提问中', GRACE: '宽限期（提交仍有效）', JUDGING: '主持人判定中', SETTLED: '本轮结束', SKIPPED: '已跳过', PAUSED: '已暂停', IDLE: '—' }[turn.phase] || turn.phase;

  const deadline = turn.phase === 'GRACE' ? turn.graceDeadlineAt : turn.deadlineAt;

  const total = turn.phase === 'GRACE'
    ? Math.max(1, (room.config.graceSec || 5) * 1000)
    : Math.max(1, (room.config.perTurnSec || 60) * 1000);

        </div>

      <div class="card creditcard">
        <div class="spread"><h3 style="margin:0">额度来源</h3>
          <span class="pill ${room.credit.mode === 'host_key' ? 'accent' : ''}">${room.credit.mode === 'host_key' ? '房主自备 API' : '平台备用额度'}</span></div>
        <div class="kv">
          <div class="k">原因码</div><div>${esc(room.credit.reason)}</div>
          ${room.credit.grantLeft ? `<div class="k">临时授权</div><div>${room.credit.grantLeft} 次</div>` : ''}

      </div>
    </div>

    <div class="col-main">
      ${(S.notice || S.error) ? `<div class="topmsg">
        ${S.notice ? `<div class="notice">${esc(S.notice)}</div>` : ''}
        ${S.error ? `<div class="err">${esc(S.error)}</div>` : ''}

        <div class="cands">

          <button id="btnChatOpen" class="btnchat">讨论${S.chatUnread ? `<span class="badge">${S.chatUnread > 99 ? '99+' : S.chatUnread}</span>` : ''}</button>
          <span class="dim">${myTurn ? '轮到你发言了' : '等待 ' + (turn.memberId ? esc(nameOf(room, turn.memberId)) + ' 发言' : '开局')}</span>
          ${turn.lateSubmit ? '<span class="pill l2">上一轮为临界提交</span>' : ''}
        </div>
        ${S.hint ? `<div class="notice" style="margin-top:12px">${esc(S.hint)}</div>` : ''}
      </div>

      ${room.truth ? truthCard(room, you) : ''}

      ${room.status === 'settled' ? `
      <div class="card settled"><div class="spread"><h3 style="margin:0">对局结束</h3>
        ${you.isHost ? '<button class="primary" id="btnRecap">查看复盘</button><button id="btnNextRound">回到选题（下一局）</button>' : '<span class="pill">等房主开下一局</span>'}</div>
        <div class="dim">${room.truth
          ? '汤底已经公示（见上方）。房主点「回到选题」就能选下一道题；中止的对局不予揭晓（避免"开局→立刻结束→读汤底"）。'

            : '本局没被猜出来。汤底只有房主能揭晓。'}</div></div>` : ''}

  ${S.configModal ? cfgModal(room) : ''}

  ${S.keyModal ? keyModal(v) : ''}
  ${S.recap ? recapModal(S.recap) : ''}`;
}

/**
 * 题目块：汤面 + 所有**操作按钮**（提示 / 揭秘）都放这里。
 * 提示由 config.hintsEnabled 控制，默认关闭 —— 关闭时连按钮都不显示，只留一句说明。
 */
function puzzleCard(puzzle, room, you) {
  const hintsOn = Boolean(room.config && room.config.hintsEnabled);
  const playing = room.status === 'playing';
  return `
  <div class="card puzzle-card">
    <div class="spread" style="margin-bottom:12px">
      <h3 style="margin:0">题目 · 汤面</h3>
      ${you.isHost && playing ? `<button id="btnCfgQuick" class="ghost">对局参数</button>` : ''}
    </div>
    <div class="puzzle">
      <div class="spread">
        <div class="ptitle">《${esc(puzzle.title)}》</div>
        <div class="row">
          <span class="pill ${String(puzzle.rating).toLowerCase()}">${esc(puzzle.rating)}</span>
          <span class="pill">难度 ${diffDots(puzzle.difficulty)}</span>
          ${puzzle.estMinutes ? `<span class="pill">约 ${puzzle.estMinutes} 分钟</span>` : ''}
        </div>
      </div>
      <div class="surface">${esc(puzzle.surface)}</div>
      <div class="row" style="margin-top:10px">
        ${(puzzle.tags || []).map((t) => `<span class="pill">${esc(t)}</span>`).join('')}
        ${(puzzle.sensitiveTags || []).map((t) => `<span class="pill l3">含：${esc(t)}</span>`).join('')}
      </div>
      ${puzzle.attribution ? `<div class="puz-src" style="margin-top:8px">题库来源：${esc(puzzle.attribution.author)}${puzzle.attribution.url ? ` · <a href="${esc(puzzle.attribution.url)}" target="_blank" rel="noopener noreferrer">${esc(puzzle.attribution.url)}</a>` : ''}</div>` : ''}
    </div>
    <div class="hr"></div>
    <div class="actions">
      ${hintsOn ? `
        <span class="dim" style="margin-right:2px">提示：</span>
        <button data-hint="1" ${you.canHintT12 ? '' : 'disabled'}>T1</button>
        <button data-hint="2" ${you.canHintT12 ? '' : 'disabled'}>T2</button>
        <button data-hint="3" ${you.canHintT3 ? '' : 'disabled'}>T3</button>`
      : '<span class="dim">本局未开启提示（房主可在「对局参数」里打开）</span>'}
      <span style="flex:1"></span>
      <button class="primary" id="btnGuess" ${room.canGuess ? '' : 'disabled'}>${guessButtonLabel(room)}</button>

/** 猜汤底按钮的文案：共用冷却期间显示剩余时间（由 tickUi 每 250ms 刷新） */
function guessButtonLabel(room) {
  const until = Number((room && room.guessCooldownUntil) || 0);
  const left = until ? Math.max(0, until - serverNow()) : 0;
  if (left > 0) return `猜汤底 · 共用冷却 <span data-deadline="${until}">${fmt(left)}</span>`;
  return '猜汤底（随时可猜）';
}

/** 公共记录里的一条：提问（含判定）或系统事件 */
function logEntry(t, room, you) {
  if (t.kind === 'question') {
    const who = t.memberName || nameOf(room, t.memberId || '');
    const mine = Boolean(t.memberId && you && t.memberId === you.memberId);
    const ans = String(t.answer || '');
    return `<div class="qa${mine ? ' mine' : ''} ${esc(ans)}">
      <div class="head"><span class="who">${esc(who)}${mine ? '（你）' : ''}</span><span>第 ${t.turnSeq} 轮 · ${fmtClock(t.at)}</span></div>
      <div class="q">${esc(t.text)}</div>
      <div class="a">主持人：<span class="verdict ${esc(ans)}">${answerLabel(t.answer)}</span>${t.reasonCode && t.reasonCode !== 'NONE' ? `<span class="dim">（${esc(t.reasonCode)}）</span>` : ''}${t.source ? sourceTag(t.source) : ''}${t.late ? '<span class="late">· 临界提交</span>' : ''}</div>
      ${t.explain ? `<span class="explain">${esc(t.explain)}</span>` : ''}
    </div>`;
  }
  const cls = t.kind === 'rejected' ? 'err' : t.kind === 'vote' ? 'vote' : 'sys';
  return `<div class="tl ${cls}">${t.memberId ? `<b>${esc(nameOf(room, t.memberId))}</b>：` : ''}${esc(t.text)}
    <div class="meta">${fmtClock(t.at)}${t.meta ? ' · ' + esc(t.meta) : ''}</div></div>`;
}

/** 对局被 AI 中断时，告诉房主"具体该改什么" */
function aiBlockHint(code) {
  switch (code) {
    case 'SCHEMA_INVALID': return '模型没有按要求的 JSON 格式回答（常见原因：模型名不匹配、输出被截断）。可换一个模型名（例如 deepseek-v4-pro）后重新提交，系统会自动重试一次。';
    case 'HTTP_401': case 'AUTH_FAILED': return 'API Key 无效或已被撤销：到服务商后台重新生成后提交。';
    case 'HTTP_402': case 'QUOTA_EXHAUSTED': return '账号余额/额度不足：充值或换一个 Key。';
    case 'HTTP_429': case 'RATE_LIMITED': return '被上游限流：稍等一会儿重新提交即可。';
    case 'HTTP_404': case 'MODEL_OR_BASE_URL_NOT_FOUND': return 'Base URL 或模型名不对：DeepSeek 用 https://api.deepseek.com + deepseek-flash。';
    case 'HTTP_400': case 'INVALID_REQUEST': return '上游不接受请求参数：多半是模型名不对。';
    case 'CONNECT_TIMEOUT': case 'READ_TIMEOUT': case 'UPSTREAM_TIMEOUT': return '调用超时：检查网络/代理，或换一个上游地址。';
    case 'LEAK_DETECTED': return '模型输出里含有汤底片段，已被安全机制拦截（不会展示给玩家）。换一个模型名通常可以避免。';
    case 'PROVIDER_REFUSAL': return '上游因内容策略拒绝了这次判定。换一个模型名试试。';
    default: return '点「更新 API Key 并继续对局」重新做一次连接测试并提交，通过后会自动解除暂停。';
  }
}

/**
 * 全员讨论区（设计稿 §12）：房间内自由发言，**不参与判定**
 * —— 不进 AI 主持人、不占回合、不进判定缓存、不加线索、不触发猜汤底。
 * 谁都能发（含旁观者与待入席者）；限长 500 字、独立限流（10 秒 5 条）。
 */
function chatCard(room, you) {
  const draftLen = String(S.chatDraft || '').length;
  return `
  <div class="card chatcard${S.chatOpen ? ' open' : ''}">
    <div class="spread" style="margin-bottom:10px">
      <h3 style="margin:0"><button class="chat-back" id="btnChatClose" title="返回房间">← 返回</button>全员讨论 <span class="dim" id="chatCount">${S.chat.length} 条</span></h3>
      <span id="chatPill">${chatPillHtml()}</span>
    </div>
    <div class="dim chat-hint" style="margin-bottom:8px">房号 ${esc(room.code)} · 只用来商量怎么问、怎么推理。这里说的话不会进判定，也不占提问回合。</div>
    <div class="chat" id="chatLog">
      ${chatListHtml()}
    </div>
    <div class="row" style="margin-top:9px;align-items:flex-end">
      <input id="chatInput" maxlength="${CHAT_MAXLEN}" autocomplete="off" spellcheck="false" placeholder="发消息…（Enter 发送 / Shift+Enter 换行）" value="${esc(S.chatDraft || '')}">
      <button class="primary" id="btnChatSend" ${String(S.chatDraft || '').trim() ? '' : 'disabled'}>发送</button>
      <span class="counter">${draftLen}/${CHAT_MAXLEN}</span>
    </div>
  </div>`;
}

function chatEntry(m, meId) {
  const mine = m.memberId === meId;
  return `<div class="msg${mine ? ' mine' : ''}">
    <div class="who">${mine ? '你' : esc(m.memberName || '—')}<span class="dim"> ${esc(fmtClock(m.createdAt))}</span></div>
    <div class="txt">${esc(m.text)}</div>
  </div>`;
}

/** 还没准备的"有资格"人数（离线/旁观/房主不阻塞开局）；房主据此决定是否二次确认 */
function startBlockedBy(room) {
  if (!room) return 0;
  return Math.max(0, (room.readyEligible || 0) - (room.readyCount || 0));
}

/**
 * 「待入席」卡片：只有**对局进行中进房**的人会看到。
 * 他此刻不占轮转、也不占玩家位：可以先旁观，点「申请下一轮上桌」后，
 * 到轮次跨轮那一刻才被转正进轮转（不会抢掉老成员本轮的提问机会）。
 */
function pendingSeatCard(room, you) {
  const me = room.members.find((m) => m.id === you.memberId);
  if (!me || me.pendingSeat !== true) return '';
  const asked = me.seatRequested === true;
  const cfg = room.config || {};
  const perTurn = Number(cfg.perTurnSec || 60);
  const players = room.members.filter((m) => m.role !== 'spectator').length || 1;
  const etaMin = Math.max(1, Math.round((perTurn * players) / 60));
  return `
  <div class="card waitcard">
    <div class="spread"><h3 style="margin:0">待入席 <span class="dim">本局已经开始</span></h3>
      <span class="pill ${asked ? 'live' : 'l2'}">${asked ? '已申请上桌' : '旁观中'}</span></div>
    <div class="dim">这一局在你进来之前就开始了，所以你先排队：现在能看全部公开信息、不占用提问顺序。
      ${asked
        ? `等本局走到下一轮（约 ${etaMin} 分钟）就轮到你，届时你会被正式排进轮转。`
        : `想加入就点下面的按钮——会从**下一轮**起排进轮转，不会抢掉别人的提问机会。`}</div>
    <div class="row" style="margin-top:10px">
      <button class="${asked ? '' : 'primary'}" id="btnSeat">${asked ? '取消申请（继续旁观）' : '申请下一轮上桌'}</button>
      <span class="dim">${asked ? '取消后本局不再插入你' : '不申请就一直旁观，不影响对局'}</span>
    </div>
  </div>`;
}

/** 还没举手的人（用来在确认框里**点名**，而不是只说"还有 N 人"） */
function notReadyNames(room) {
  if (!room) return [];
  return room.members
    .filter((m) => m.role !== 'spectator' && m.conn === 'connected' && !m.isHost && !m.ready)
    .map((m) => m.name);
}

/**
 * 开局：有人在没准备时**先点名确认**，确认后带 force 强制开局。
 *
 * 以前「选这道」/「投票选汤」这两条路根本没走这里（一个提前 return、一个直接请求），
 * 于是服务端必然回 NOT_ALL_READY，提示写着"或确认后强制开局"却没有确认框 ——
 * 房主只能改用另一个按钮，而那个按钮是**随机抽题**，反而丢了选题能力（真实缺陷 S1）。
 */
function requestStart(mode, puzzleId) {
  const missing = notReadyNames(S.view ? S.view.room : null);
  if (missing.length > 0) {
    if (!confirm(`${missing.join('、')} 还没点「我准备好了」。仍然开局？`)) return;
  }
  request({ t: 'start', mode, ...(puzzleId ? { puzzleId } : {}), ...(missing.length > 0 ? { force: true } : {}) });
}

/**
 * 「AI 创作」卡片（仅房主、且只有开局前）。
 *
 * 流程：点「生成新题」→ 服务端让模型写整道题（汤面/汤底/事实点表）→
 * **统一坏题检测**（关键事实点是否泄露在汤面里、结构、长度、违禁词…）→
 * 通过后存为本房间的自定义题目 → 房主看着预览决定「就用这道开局」或「重新生成」。
 * 不通过就把具体问题列给房主看（不会静默失败）。
 */
function aiPuzzleCard(room, you) {
  const st = S.aiPuzzle;
  const canUse = Boolean(st && st.puzzleId) && room.status === 'waiting';
  const model = (S.drafts.keyModel ?? defaultModel());
  return `
  <div class="card aicard">
    <div class="spread" style="margin-bottom:10px">
      <h3 style="margin:0">AI 创作 <span class="dim">房主专用</span></h3>
      <span class="pill accent">${esc(model)}</span>
    </div>
    <div class="dim" style="margin-bottom:10px">
      让模型按当前题目分级（${esc(room.config.ratingMax)}）与难度区间（${room.config.difficultyMin}–${room.config.difficultyMax}）现写一道新题。
      生成后会先过一遍坏题检测：汤面不得泄露关键事实点、事实点结构要能判定、不得含违禁内容 —— 不通过会直接告诉你哪里不合格。
      生成的题只属于本房间，不会进公共题库。
    </div>
    <div class="row">
      <button class="primary" id="btnAiPuzzle" ${st && st.pending ? 'disabled' : ''}>${st && st.pending ? '模型正在出题…' : (st && st.puzzleId ? '重新生成一道' : '生成新题')}</button>
      ${canUse ? `<button id="btnAiStart">就用这道开局</button>` : ''}
      ${st && st.error ? `<span class="pill l3">${esc(st.error)}</span>` : ''}
    </div>
    ${st && st.issues && st.issues.length ? `
      <div class="err" style="margin-top:12px">${st.issues.some((i) => i.path === 'model') ? '模型这次没能出题' : '这题没通过坏题检测'}（已作废，不会入库）：<br>
        ${st.issues.slice(0, 6).map((i) => `· ${esc(i.path)}：${esc(i.reason)}`).join('<br>')}
        ${st.issues.some((i) => i.path === 'model') ? '<br><span class="dim">再点一次「生成新题」通常就好；连续失败可换 deepseek-chat 试试。</span>' : ''}</div>` : ''}
    ${st && st.puzzleId ? `
      <div class="puzzle" style="margin-top:12px">
        <div class="spread"><div class="ptitle">《${esc(st.title)}》</div><span class="pill live">已通过检测</span></div>
        <div class="surface">${esc(st.surface)}</div>
        ${st.warnings && st.warnings.length ? `<div class="dim" style="margin-top:8px">提示：${st.warnings.map((w) => esc(w)).join('；')}</div>` : ''}
      </div>` : ''}
  </div>`;
}

/** 房主 Key 掩码（没有则返回 null） */function hostKeyMask(room) {
  const h = room.members.find((m) => m.isHost);
  return h && h.keyMask ? h.keyMask : null;
}

/** 难度圆点（●●●○○）——比数字更直观 */
function diffDots(n) {
  const v = Math.max(1, Math.min(5, Number(n) || 1));
  return `<span class="dots" title="难度 ${v}/5">${'●'.repeat(v)}<span class="dim">${'○'.repeat(5 - v)}</span></span>`;
}

/** 判定来源 → 人话标签（透明化：让玩家知道这条是谁给的） */
function sourceTag(source) {
  const map = { model: ['模型判定', 'accent'], cache: ['判定缓存', ''], rule: ['规则拦截', 'l2'] };
  const [label, cls] = map[String(source)] ?? [String(source || '未知'), ''];
  return `<span class="pill ${cls}" title="判定来源">${esc(label)}</span>`;
}

/**
 * 统计条（参考同类产品，但这里的分母来自服务端的**必需事实点计数**）：
 *   提问数 · 线索 X/Y · 提示用量 · 探索度
 * 探索度 = 已解锁事实点 / 必需事实点，达到 100% 通常意味着可以揭秘了。
 */
function statStrip(room, you) {
  const asked = S.questions.length;
  const clue = room.revealedFacts ? room.revealedFacts.length : 0;
  const total = room.factTotal || 0;
  const need = room.requiredFactTotal || 0;
  const pct = need > 0 ? Math.min(100, Math.round((clue / need) * 100)) : 0;
  const hintsOn = Boolean(room.config && room.config.hintsEnabled);
  return `
  <div class="stats">
    <div class="stat"><div class="v">${asked}</div><div class="l">提问</div></div>
    <div class="stat"><div class="v">${clue}<span class="dim">/${total}</span></div><div class="l">线索</div></div>
    <div class="stat"><div class="v">${hintsOn ? '开' : '关'}</div><div class="l">提示</div></div>
    <div class="stat grow">
      <div class="spread" style="margin-bottom:5px"><span class="l">探索度</span><span class="v" style="font-size:13px">${pct}%</span></div>
      <div class="meter"><i style="width:${pct}%"></i></div>
      <div class="dim" style="margin-top:4px">已拼出 ${clue} 条事实点${need ? ` · 关键 ${Math.min(clue, need)}/${need}` : ''}</div>
    </div>
  </div>`;
}

/**
 * 「汤主」状态条：现在到底是谁在回答？（借鉴同类产品的"XX 汤主在值班"，
 * 但这里把它和**额度来源**合并显示，因为我们的判定引擎取决于凭据而不是一个人格）。
 */
function engineBar(room, you) {
  const blocked = room.ai.state === 'BLOCKED';
  const usingHost = room.credit.mode === 'host_key';
  const mask = hostKeyMask(room);
  const platform = Boolean(S.config && S.config.realModelEnabled);
  let who, tag, note;
  if (blocked) {
    who = '汤主罢工了'; tag = 'l3'; note = `AI 服务异常（${room.ai.reasonCode || '未知'}），对局已暂停`;
  } else if (usingHost && mask) {
    who = 'AI 汤主（房主自备 Key）'; tag = 'accent'; note = `凭据 ${mask} · 调用失败不会自动改用平台额度`;
  } else if (platform) {
    who = 'AI 汤主（平台备用额度）'; tag = 'accent'; note = '由站点额度提供，受月度上限约束';
  } else {
    who = '关键词汤主（内置模拟）'; tag = 'l2'; note = '只认题库里写过的说法，理解不了自然语言改写';
  }
  return `
  <div class="engine">
    <span class="dot ${blocked ? 'off' : 'active'}"></span>
    <b>${esc(who)}</b>
    <span class="pill ${tag}">${blocked ? '已暂停' : '在值班'}</span>
    <span class="dim">${esc(note)}</span>
    ${you.isHost && !blocked ? `<button id="btnKey" class="ghost" style="margin-left:auto">${mask ? '更换 / 撤销 Key' : '接通 AI 汤主'}</button>` : ''}
  </div>`;
}

/** 房间邀请：房号 + 可分享链接（链接里带 ?code=，朋友点开自动填好） */
function inviteText(room) {
  const url = `${location.origin}/?code=${encodeURIComponent(room.code)}`;
  return { url, text: `来玩 AI 海龟汤，房号 ${room.code}\n${url}` };
}

/** 成员名字首字（中文取第一个字，英文取首字母大写） */
function initialOf(name) {
  const s = String(name ?? '?').trim();
  return s ? s.slice(0, 1).toUpperCase() : '?';
}

/** 按名字生成稳定的头像色相，让同一个人在任何设备上颜色一致 */
function hueOf(name) {
  let h = 0;
  for (const ch of String(name ?? '')) h = (h * 31 + ch.codePointAt(0)) % 360;
  return h;
}

/**
 * 「谁在发言」+ 玩家列表**合并**成一块：
 *   · 顶部是当前发言者的醒目卡片（头像 + 名字 + 剩余时间 + 进度条）
 *   · 下面就是完整玩家列表：当前发言者高亮、准备状态、房主的踢人入口
 */
function speakerPanel(room, you, turn, counting, left, deadline, total, pct, phaseLabel) {
  const current = turn.memberId ? room.members.find((m) => m.id === turn.memberId) : null;
  const isMe = Boolean(current && current.id === you.memberId);
  const urgent = counting && left <= 5000;
  const barCls = turn.phase === 'GRACE' ? ' grace' : room.status === 'suspended' ? ' paused' : urgent ? ' urgent' : '';
  const canReady = room.status !== 'playing';                    // 开局后就没有"准备"一说了
  const me = room.members.find((m) => m.id === you.memberId);
  const iAmReady = Boolean(me && me.ready);
  const eligible = room.readyEligible || 0;
  const readyCount = room.readyCount || 0;
  const allReady = eligible > 0 && readyCount >= eligible;

  return `
  <div class="card playercard">
    <div class="speakerbox">
    <div class="speaker${current ? '' : ' idle'}">
      <div class="avatar" style="--h:${hueOf(current ? current.name : '空')}">${current ? esc(initialOf(current.name)) : '·'}</div>
      <div>
        <div class="who">${current ? esc(current.name) + (isMe ? '（你）' : '') : '等待开局'}</div>
        <div class="what">${current ? esc(phaseLabel) + (isMe ? ' · 该你问了' : ' · 正在提问') : '房主选好题目后开始'}</div>
      </div>
      <div class="time">
        ${counting
          ? `<div class="t timer" id="tickLeft" data-deadline="${deadline}">${fmt(left)}</div><div class="l">剩余</div>`
          : '<div class="t">—</div><div class="l">未计时</div>'}
      </div>
    </div>
    ${counting ? `<div class="bar${barCls}"><i data-bar data-deadline="${deadline}" data-total="${total}" style="width:${pct}%"></i></div>` : ''}

    ${canReady && !you.isHost ? `
    <div class="row" style="margin-top:12px">
      <button class="${iAmReady ? '' : 'primary'}" id="btnReady">${iAmReady ? '✓ 已准备（点一下收回）' : '我准备好了'}</button>
      <span class="dim">${eligible === 0 ? '房间只有你一个人，开局由房主决定' : allReady ? '全员已准备，等房主开局' : `还有 ${Math.max(0, eligible - readyCount)} 人没准备（离线/旁观不算数）`}</span>
    </div>` : ''}
    ${canReady && you.isHost ? `
    <div class="row" style="margin-top:12px">
      <span class="dim">你是房主：不用举手，等大家准备好（或确认后强制）直接开局即可。</span>
    </div>` : ''}
    </div>

    <div class="memlist">
    <div class="spread" style="margin-bottom:12px">
      <h3 style="margin:0">玩家 <span class="dim">${room.members.length} 人</span></h3>
      <span class="pill ${allReady && eligible > 0 ? 'live' : ''}">已准备 ${readyCount}/${eligible}${allReady && eligible > 0 ? ' · 可以开局' : ''}</span>
    </div>

    <div class="hr"></div>

    ${room.members.map((m) => {
      const active = turn.memberId === m.id;
      const away = m.conn === 'disconnected' || m.activity === 'idle';
      const kickable = you.isHost && m.id !== you.memberId;
      return `
      <div class="mem${active ? ' turn' : ''}${away && !active ? ' away' : ''}">
        <div class="avatar" style="--h:${hueOf(m.name)}">${esc(initialOf(m.name))}</div>
        <div class="nm">
          <span class="dot ${m.conn === 'disconnected' ? 'off' : m.activity === 'idle' ? 'idle' : 'active'}"></span>
          ${esc(m.name)}${m.id === you.memberId ? '<span class="dim">（你）</span>' : ''}
          ${m.isHost ? '<span class="pill accent">房主</span>' : ''}
          ${m.formerHost ? '<span class="pill">原房主</span>' : ''}
          ${m.keyState === 'suspended' ? '<span class="pill l2">Key 挂起</span>' : ''}
          ${active ? '<span class="pill live">发言中</span>' : ''}
          ${m.isHost ? '' : (m.pendingSeat === true
            ? `<span class="pill l2">待入席${m.seatRequested ? ' · 已申请' : ''}</span>`
            : (m.role !== 'spectator' ? (m.ready ? '<span class="pill live">已准备</span>' : '<span class="pill l2">未准备</span>') : '<span class="pill">旁观</span>'))}
        </div>
        <div class="meta">
          ${esc(m.stateLabel)} · ${m.score} 分
          ${kickable ? `<button class="ghost kick" data-kick="${esc(m.id)}" title="把 ${esc(m.name)} 移出房间">移出</button>` : ''}
        </div>
      </div>`;
    }).join('')}

    <div class="dim" style="margin-top:10px">挂机只跳过其回合、不移交房主；断连才触发移交。被移出的成员会立刻失效，需要重新加入。</div>
    </div>
  </div>`;
}

/** 公共记录：**只放记录**（操作按钮都在题目卡片里） */
function recordsCard(room, you) {
  return `
  <div class="card records">
    <div class="spread" style="margin-bottom:12px">
      <h3 style="margin:0">公共记录 <span class="dim">${S.log.length} 条 · 全员共享</span></h3>
      <span class="pill">按时间排列</span>
    </div>
    <div class="log" id="log">
      ${S.log.map((t) => logEntry(t, room, you)).join('') || '<div class="empty">还没有记录 —— 轮到你时提第一个问题吧。</div>'}
    </div>
    <div class="dim" style="margin-top:10px">所有人的提问与主持人判定都在这里；自己的提问左侧有紫色标记。
      提问一发出即公开、无法撤回；草稿框里的内容在发送前只有你自己能看到。</div>
  </div>`;
}

function banners(room, you) {
  const out = [];
  // 服务端没有平台额度时：房主自备 Key 就是唯一的真实模型来源，直接给出入口
  const hostMember = room.members.find((m) => m.isHost);
  if (!(S.config && S.config.realModelEnabled) && (S.config ? S.config.vaultEnabled : true)
      && you.isHost && hostMember && !hostMember.keyMask) {
    out.push(`<div class="notice">服务端没有配置模型额度：当前判定由<b>内置模拟主持人</b>给出（能玩，但不理解自然语言）。
      填上你自己的 API Key（默认 DeepSeek）后，判定就会走真实模型。
      <div class="row" style="margin-top:6px"><button class="primary" id="btnKeyFromBanner">填写我的 API Key</button></div></div>`);
  }
  if (room.ai.state === 'BLOCKED') {
    out.push(`<div class="notice">AI 服务异常（${esc(room.ai.reasonCode || '')}）：对局已暂停，等待房主处理。<b>本轮未消耗，且不会自动切换到平台额度。</b>
      <br><span class="dim">${esc(aiBlockHint(room.ai.reasonCode))}</span>
      ${you.isHost ? '<div class="row" style="margin-top:6px"><button id="btnFixKey">更新 API Key 并继续对局</button><button id="btnRevokeKey">撤销并改用平台额度</button></div>' : ''}</div>`);
  }
  if (room.vote && room.vote.type === 'fallback_credit' && room.vote.status === 'open') {
    out.push(`<div class="notice">投票：是否临时启用平台备用额度继续对局？已投 ${room.vote.votedCount} / ${room.vote.eligibleCount}，剩余 <span data-deadline="${room.vote.deadlineAt}">${fmt(room.vote.deadlineAt - serverNow())}</span>
      <div class="row" style="margin-top:6px"><button data-vote="yes">赞成</button><button data-vote="no">反对</button><button data-vote="abstain">弃权</button></div>
      <div class="dim">门槛：有效人数 ≥ 2 且赞成票过半；挂机 / 离线成员的表决不被受理</div></div>`);
  }
  if (room.vote && room.vote.type === 'puzzle_choice' && room.vote.status === 'open') {
    out.push(`<div class="card"><h3>投票选汤（已投 ${room.vote.votedCount} / ${room.vote.eligibleCount}，剩余 <span data-deadline="${room.vote.deadlineAt}">${fmt(room.vote.deadlineAt - serverNow())}</span>）</h3>
      <div class="cands">${(room.vote.candidates || []).map((c) => `
        <div class="cand">
          <div class="row"><span class="pill ${c.rating.toLowerCase()}">${esc(c.rating)}</span><span class="pill">难度 ${c.difficulty}</span><span class="pill">约 ${c.estMinutes} 分钟</span></div>
          <div>${esc(c.surface)}</div>
          <div class="row">${c.tags.map((t) => `<span class="pill">${esc(t)}</span>`).join('')}${c.sensitiveTags.map((t) => `<span class="pill l3">含：${esc(t)}</span>`).join('')}</div>
          <button data-votepuzzle="${esc(c.id)}" ${room.vote.myBallot ? 'disabled' : ''}>投给这道</button>
        </div>`).join('')}</div></div>`);
  }
  if (room.vote && room.vote.status !== 'open' && room.vote.result) out.push(`<div class="notice">投票已结束：${esc(room.vote.result)}</div>`);
  if (room.transfer.state === 'paused_for_resume') {
    out.push(`<div class="notice">房主变更完成，本轮已作废（不计入跳过次数）。等待新房主开始下一轮。
      ${you.isHost ? '<div class="row" style="margin-top:6px"><button class="primary" id="btnResumeTurn">继续对局</button></div>' : ''}</div>`);
  }
  const former = room.members.find((m) => m.formerHost);
  if (former && you.isHost) {
    out.push(`<div class="notice">${esc(former.name)} 已回来（现为普通成员）。是否归还房主位？
      <div class="row" style="margin-top:6px"><button id="btnReturnHost">归还</button><button id="btnDeclineReturn" class="danger">不归还（销毁其挂起 Key）</button></div></div>`);
  }
  if (you.isHost && room.members.find((m) => m.isHost) && room.members.find((m) => m.isHost).keyState === 'suspended' && !former) {
    out.push(`<div class="notice">你的 API Key 处于挂起状态：是否重新启用？
      <div class="row" style="margin-top:6px"><button data-reenable="yes">是（复测并切回自备额度）</button><button data-reenable="no">否（销毁 Key）</button></div></div>`);
  }
  return out.join('');
}

function guessModal() {

  return `<div class="overlay"><div class="modal">
    <div class="spread"><h3 style="margin:0">猜汤底（随时可以猜）</h3><button id="btnGuessCancel">返回</button></div>
    <p class="dim">判定尺度：关键事实点全部命中 + 表达出因果链 = 命中；命中 ≥ 60% = 接近（只告诉你数量，不告诉你命中了哪几条）；否则未命中。</p>
    <p class="dim">猜汤底是<b>所有人共用一个冷却</b>${cdSec > 0 ? `（当前设置 ${cdSec} 秒）` : '（当前设置：不限）'}：
      谁先猜谁开始计时，冷却期间房间里谁都不能再猜。${cdLeft > 0 ? `现在还剩 <b data-deadline="${room.guessCooldownUntil}">${fmt(cdLeft)}</b>。` : ''}</p>
    <textarea id="guessText" autocomplete="off" spellcheck="false" placeholder="用几句话说明：发生了什么、为什么会这样">${esc(text)}</textarea>
    <div class="row" style="margin-top:10px">
