<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>海龟汤 · 深海汤屋</title>
<!--
  ════════════════════════════════════════════════════════════════════════════
  海龟汤 · 深海汤屋（LODGE）—— 第三套前端，与 v1（/）和 /deep/ 完全隔离。

  视觉取材（一份风格调研 → 见 docs/前端风格调研.md）：
    · 情绪：Poolsuite 的暖奶油底 + 「温暖故事书 / comfort」的暖棕与纸张感
    · 骨架：SaaS Pages 的三栏密度（左问答记录 / 中汤面 / 右线索板）+ Godly 的细边克制
    · 排版：白纸 + 大字级衬线（Refero/Apple HIG 的留白层级）
    · 动效：Stripe 式微交互（≤300ms、只服务反馈），并尊重 prefers-reduced-motion
  质感全部由 CSS 渐变与内联 SVG（feTurbulence 噪点）现造 —— 不引外链图片/字体/图标。
  只依赖同一套后端 HTTP 接口（/api/*），后端一行没改。
  ════════════════════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --wood:#2a1a11; --wood2:#3b2517; --wood3:#4d3220;
    --paper:#fbf3e2; --paper2:#f3e6cd; --cream:#f6ead3;
    --ink:#2e1d13; --ink2:#5b4433; --ink3:#8a7157;
    --amber:#e9a63c; --ember:#c9542a; --sage:#6f8a5e; --plum:#8a4a5e;
    --line:rgba(46,29,19,.18); --line2:rgba(46,29,19,.34);
    --shadow:0 18px 40px -28px rgba(20,10,4,.9);
    --serif:"Songti SC",Georgia,"Source Han Serif SC",serif;
    --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font:14px/1.7 var(--sans);color:var(--ink);
    background:
      radial-gradient(120% 70% at 50% -10%,rgba(233,166,60,.16),transparent 60%),
      repeating-linear-gradient(93deg,rgba(0,0,0,.16) 0 2px,transparent 2px 9px),
      repeating-linear-gradient(87deg,rgba(255,255,255,.03) 0 1px,transparent 1px 14px),
      linear-gradient(180deg,var(--wood2),var(--wood) 60%,#1d120b);
    background-attachment:fixed;
  }
  /* 纸张颗粒（内联 SVG 噪点，无外部请求） */
  .grain{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.30;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.5'/></svg>")}
  .lamp{position:fixed;top:-140px;left:50%;width:560px;height:420px;transform:translateX(-50%);pointer-events:none;z-index:0;
    background:radial-gradient(50% 50% at 50% 50%,rgba(255,206,122,.34),rgba(255,180,90,.10) 45%,transparent 70%);
    animation:flick 6.5s ease-in-out infinite}
  @keyframes flick{0%,100%{opacity:.92}45%{opacity:.74}70%{opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

  .stage{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:18px 16px 120px}
  .board{display:grid;grid-template-columns:262px minmax(0,1fr) 262px;gap:16px;align-items:start}
  @media(max-width:960px){.board{grid-template-columns:1fr}.col-side{order:3}.col-main{order:1}}

  /* ── 纸卡 ───────────────────────────────────────────── */
  .card{position:relative;background:linear-gradient(180deg,var(--paper),var(--paper2));border:1px solid var(--line2);
    border-radius:4px;padding:14px 15px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card::after{content:'';position:absolute;inset:0;border-radius:4px;pointer-events:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -14px 24px -20px rgba(90,60,30,.5)}
  /* 卡角的小折痕（不用图片） */
  .card.fold::before{content:'';position:absolute;top:0;right:0;width:16px;height:16px;
    background:linear-gradient(225deg,rgba(0,0,0,.10) 0 50%,transparent 50%);border-bottom-left-radius:3px}
  h3.ttl{margin:0 0 10px;font:700 12px/1 var(--sans);letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;
    display:flex;align-items:baseline;gap:8px}
  h3.ttl small{font:11px/1 var(--sans);letter-spacing:.04em;color:var(--ink3);opacity:.8;text-transform:none}
  .dim{color:var(--ink3);font-size:12px}
  .hr{height:1px;background:var(--line);margin:12px 0}
  .hatch{height:8px;margin:-4px 0 10px;opacity:.5;
    background:repeating-linear-gradient(45deg,var(--line2) 0 1px,transparent 1px 5px)}

  /* ── 招牌 ───────────────────────────────────────────── */
  .sign{position:relative;margin:4px 0 16px;padding:16px 20px;border-radius:6px;
    background:linear-gradient(180deg,var(--wood3),var(--wood2));border:1px solid rgba(0,0,0,.5);
    box-shadow:0 26px 50px -30px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,215,150,.18);
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:var(--cream)}
  .sign::before{content:'';position:absolute;inset:5px;border:1px solid rgba(255,205,130,.20);border-radius:4px;pointer-events:none}
  .lantern{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;
    background:radial-gradient(circle at 50% 45%,rgba(255,196,96,.55),rgba(200,80,30,.25) 60%,transparent 72%);
    border:1px solid rgba(255,205,130,.35);animation:flick 5s ease-in-out infinite}
  .sign b{font:700 19px/1.2 var(--serif);display:block;letter-spacing:.04em}
  .sign span{font-size:11.5px;color:rgba(246,234,211,.72);letter-spacing:.16em}
  .sign .stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:11px;letter-spacing:.06em;border:1px solid rgba(255,205,130,.28);border-radius:99px;padding:3px 10px;
    color:rgba(246,234,211,.9);background:rgba(0,0,0,.18)}
  .chip b{color:#ffd694}
  .chip.hot b{color:#ffb08a}

  /* ── 汤面（中央）────────────────────────────────────── */
  .soup{position:relative;background:linear-gradient(180deg,#fffaf0,var(--cream));border:1px solid var(--line2);
    border-radius:4px;padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow)}
  .soup::before{content:'湯';position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:50%;
    display:grid;place-items:center;font:700 17px/1 var(--serif);color:#8d3b2a;
    border:2px solid rgba(141,59,42,.55);transform:rotate(-9deg);opacity:.85}
  .soup h2{margin:0 0 4px;font:700 24px/1.35 var(--serif);letter-spacing:.02em}
  .soup .meta{font-size:11.5px;color:var(--ink3);letter-spacing:.1em;margin-bottom:12px}
  .soup p{margin:0;font:17px/2.05 var(--serif);white-space:pre-wrap}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .tag{font-size:11px;border:1px solid var(--line);border-radius:2px;padding:2px 8px;color:var(--ink2);background:rgba(255,255,255,.5)}
  .tag.risk{color:var(--ember);border-color:rgba(201,84,42,.42);background:rgba(201,84,42,.07)}

  /* ── 提问（主操作）──────────────────────────────────── */
  .ask{position:sticky;bottom:0;z-index:20;background:linear-gradient(180deg,rgba(251,243,226,.86),rgba(243,230,205,.97));
    backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:4px;padding:13px 15px calc(13px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -16px 40px -26px rgba(20,10,4,.95)}
  .ask .lbl{font-size:11.5px;color:var(--ink3);letter-spacing:.12em;margin-bottom:6px}
  textarea,input,select{font:inherit;color:var(--ink);width:100%;padding:11px 12px;border:1px solid var(--line2);border-radius:3px;
    background:rgba(255,255,255,.72);box-shadow:inset 0 1px 2px rgba(90,60,30,.12)}
  textarea:focus,input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(233,166,60,.25)}
  button{font:inherit;cursor:pointer;border-radius:3px;padding:10px 15px;color:var(--ink);
    border:1px solid var(--line2);background:linear-gradient(180deg,#fff8ea,#f0e2c8);
    transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
  button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(60,30,10,.9)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.ask-btn{background:linear-gradient(180deg,var(--amber),#c9801f);border-color:rgba(120,70,10,.5);color:#2b1a08;font-weight:700;letter-spacing:.06em}
  button.seal{background:linear-gradient(180deg,#b8452a,#8f3218);border-color:rgba(80,20,0,.5);color:#ffe9d6;font-weight:700}
  button.ghost{background:transparent}
  button.danger{color:var(--ember);border-color:rgba(201,84,42,.4)}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .bar{height:6px;border-radius:99px;background:rgba(90,60,30,.18);overflow:hidden;margin-top:9px;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--ember));width:0;transition:width .35s ease}

  /* ── 左：问答记录（账本字条）───────────────────────── */
  .quill{display:flex;flex-direction:column;gap:9px;max-height:56vh;overflow:auto;padding-right:3px}
  .note{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.34));
    border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:2px;padding:9px 11px}
  .note.mine{border-left-color:var(--plum);background:linear-gradient(180deg,rgba(138,74,94,.10),rgba(255,255,255,.3))}
  .note.yes{border-left-color:var(--sage)} .note.no{border-left-color:var(--ember)}
  .note.irrelevant{border-left-color:var(--ink3)} .note.unanswerable{border-left-color:var(--amber)}
  .note .who{font-size:11px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap}
  .note .q{font:15px/1.75 var(--serif);margin-top:4px}
  .note .a{margin-top:6px;font-size:12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .stamp{font:700 11px/1 var(--serif);letter-spacing:.1em;border:1.5px solid currentColor;border-radius:3px;padding:3px 7px;transform:rotate(-3deg)}
  .stamp.yes{color:var(--sage)} .stamp.no{color:var(--ember)} .stamp.irrelevant{color:var(--ink3)} .stamp.unanswerable{color:#a9741c}
  .note .rep{display:block;margin-top:6px;padding-left:9px;border-left:2px solid var(--line);font-style:italic;color:var(--ink2)}
  .flow{font-size:11.5px;color:var(--ink3);padding:2px 11px;border-left:2px dashed var(--line2)}

  /* ── 右：线索板（软木板 + 图钉纸条）───────────────── */
  .cork{position:relative;background:
      radial-gradient(80% 60% at 30% 20%,rgba(255,220,160,.18),transparent 60%),
      repeating-linear-gradient(72deg,rgba(120,80,40,.16) 0 2px,transparent 2px 7px),
      linear-gradient(180deg,#b98a55,#9c6f42);
    border:6px solid var(--wood3);border-radius:4px;padding:12px;box-shadow:inset 0 2px 12px rgba(60,30,10,.45)}
  .pins{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 10px}
  .pin{position:relative;width:30px;height:30px;border-radius:2px;background:linear-gradient(180deg,#fffdf6,#efe3cb);
    border:1px solid rgba(90,60,30,.35);box-shadow:0 4px 8px -5px rgba(40,20,5,.9)}
  .pin::before{content:'';position:absolute;top:-4px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#ff8f6a,#a83b1c);box-shadow:0 1px 2px rgba(0,0,0,.5)}
  .pin.empty{opacity:.45;background:transparent;border:1px dashed rgba(60,30,10,.45)}
  .pin.empty::before{display:none}
  .slip{background:linear-gradient(180deg,#fffdf6,#f2e7d2);border:1px solid rgba(90,60,30,.3);border-radius:2px;
    padding:7px 9px;font-size:12px;box-shadow:0 6px 12px -9px rgba(40,20,5,.9)}
  .slip+.slip{margin-top:7px}

  /* ── 客人名单 ───────────────────────────────────────── */
  .guest{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:3px}
  .guest+.guest{margin-top:2px}
  .guest.turn{background:rgba(233,166,60,.20);box-shadow:inset 0 0 0 1px rgba(160,100,20,.35)}
  .guest .face{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12px/1 var(--serif);color:#3a2413;
    background:radial-gradient(circle at 38% 32%,hsl(var(--h,40) 62% 78%),hsl(calc(var(--h,40) + 25) 45% 58%));
    border:1px solid rgba(90,60,30,.35)}
  .guest .nm{font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .guest .mt{margin-left:auto;font-size:11px;color:var(--ink3);white-space:nowrap}
  .mark{font-size:10.5px;border:1px solid var(--line2);border-radius:2px;padding:1px 6px;color:var(--ink3)}
  .mark.on{color:var(--sage);border-color:rgba(111,138,94,.55);background:rgba(111,138,94,.12)}
  .mark.off{color:var(--ember);border-color:rgba(201,84,42,.45)}

  /* ── 选汤（今日菜单）────────────────────────────────── */
  .menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .dish{background:linear-gradient(180deg,#fffdf6,#f3e8d4);border:1px solid var(--line2);border-radius:3px;padding:12px;
    display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 18px -14px rgba(60,30,10,.9)}
  .dish .b{font:14px/1.75 var(--serif);color:var(--ink2)}

  /* ── 揭封（汤底公示）────────────────────────────────── */
  .veil{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:18px;background:rgba(24,13,6,.86)}
  .scroll{position:relative;max-width:660px;width:100%;border-radius:4px;padding:24px;
    background:linear-gradient(180deg,#fffdf5,var(--paper2));border:1px solid var(--line2);
    box-shadow:0 40px 90px -40px rgba(0,0,0,1);animation:unroll .42s ease-out}
  @keyframes unroll{from{transform:scaleY(.86) translateY(-8px);opacity:.4}to{transform:none;opacity:1}}
  .scroll h2{margin:0 0 6px;font:700 22px/1.3 var(--serif)}
  .scroll .seal{position:absolute;top:16px;right:18px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
    font:700 20px/1 var(--serif);color:#8d3b2a;border:2.5px solid rgba(141,59,42,.6);transform:rotate(-11deg);opacity:.9}
  .scroll .body{font:17px/2.05 var(--serif);white-space:pre-wrap;background:rgba(255,255,255,.6);
    border-left:3px solid rgba(141,59,42,.35);padding:14px 16px;border-radius:2px;margin-top:10px}
  .modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:18px;background:rgba(24,13,6,.8)}
  .modal .box{max-width:540px;width:100%;background:linear-gradient(180deg,#fffdf5,var(--paper2));border:1px solid var(--line2);
    border-radius:4px;padding:18px;box-shadow:0 30px 80px -40px rgba(0,0,0,1)}
  .warn{border:1px solid rgba(169,116,28,.45);background:rgba(233,166,60,.14);color:#7a4d10;border-radius:3px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
  .err{border:1px solid rgba(201,84,42,.5);background:rgba(201,84,42,.12);color:#8f3218;border-radius:3px;padding:9px 12px;font-size:12.5px;margin-bottom:12px}
  .empty{padding:20px 6px;text-align:center;color:var(--ink3);font-size:12.5px}
  .mono{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="lamp"></div>
<div class="grain"></div>
<div class="stage" id="app"></div>
<script>
/* 汤屋前端（v3）——零依赖、单文件、与 v1 / deep 完全隔离；只调 /api/* */
const K_TOKEN = 'ht.lodge.token', K_DRAFT = 'ht.lodge.draft', K_NICK = 'ht.lodge.nick';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (ms) => { const t = Math.max(0, Math.round(ms / 1000)); return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
const hue = (s) => { let h = 0; for (const ch of String(s)) h = (h * 29 + ch.charCodeAt(0)) % 40; return 20 + h; };

const S = {
  screen: 'entry', view: null, questions: [], seq: 0,
  token: localStorage.getItem(K_TOKEN) || '', cfg: null,
  notice: '', error: '', lastFp: '', offset: 0,
  draft: localStorage.getItem(K_DRAFT) || '', guessDraft: '',
  modal: null, breachSeen: '',
};
let pollTimer = null, pollBusy = false, epoch = 0;
const serverNow = () => Date.now() + S.offset;

async function api(path, { method = 'GET', body, token } = {}) {
  const res = await fetch(path, {
    method,
    headers: { 'content-type': 'application/json', ...((token ?? S.token) ? { authorization: `Bearer ${token ?? S.token}` } : {}) },
    ...(body ? { body: JSON.stringify(body) } : {}),
  });
  const text = await res.text();
  let json = null; try { json = text ? JSON.parse(text) : null; } catch { json = { raw: text }; }
  if (!res.ok || (json && json.ok === false)) {
    const e = new Error((json && (json.message || json.error)) || `HTTP ${res.status}`); e.status = res.status; e.body = json; throw e;
  }
  return json;
}
const act = (b) => api('/api/rooms/actions', { method: 'POST', body: b });
function forget() { epoch++; S.token = ''; localStorage.removeItem(K_TOKEN); S.view = null; S.questions = []; S.screen = 'entry'; stopPoll(); }
function home(msg) { forget(); S.notice = msg || ''; S.error = ''; render(true); }
function startPoll() { stopPoll(); pollTimer = setInterval(() => void poll(), 1200); void poll(); }
function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

async function poll() {
  if (pollBusy || !S.token) return;
  const my = epoch; pollBusy = true;
  try {
    const res = await fetch(`/api/rooms/state?since=${S.seq}`, { headers: { authorization: `Bearer ${S.token}` } });
    if (my !== epoch || !S.token) return;
    if (res.status === 401) return home('这桌的凭证已经失效，请重新入座。');
    if (res.status === 404) return home('这桌已经打烊（房间被清理）。');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    apply(await res.json());
  } catch (e) {
    if (my !== epoch || !S.token) return;
    S.error = `与汤屋失联（${e.message}），正在重连…`; render(true);
  } finally { pollBusy = false; }
}

function apply(data) {
  if (data && data.view) { S.view = data.view; S.screen = 'room'; if (data.view.room) S.offset = data.view.room.serverTime - Date.now(); }
  if (data && Array.isArray(data.questions)) S.questions = data.questions;
  if (data && typeof data.seq === 'number' && data.seq > S.seq) S.seq = data.seq;
  if (data && data.view && data.view.room) {
    const r = data.view.room;
    if (r.status === 'settled') {
      if (S.modal === 'guess') S.modal = null;
      const key = r.truth ? `${r.id}:${r.roundNo}` : '';
      if (key && S.breachSeen !== key && S.modal !== 'breach') S.modal = 'breach';
      if (!key) S.breachSeen = '';
    } else { S.breachSeen = ''; if (S.modal === 'breach') S.modal = null; }
  }
  S.error = ''; render(true);
}

function fp() {
  const v = S.view ? { ...S.view, room: S.view.room ? { ...S.view.room, serverTime: 0 } : null } : null;
  return JSON.stringify([S.screen, S.notice, S.error, S.modal, v, S.questions.length]);
}
function render(force = false) {
  const app = $('#app'), a = document.activeElement;
  const typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
  const f = fp();
  if (!force && (typing || f === S.lastFp)) return;
  S.lastFp = f;
  app.innerHTML = (S.screen === 'room' && S.view) ? viewRoom() : viewEntry();
  if (S.modal === 'breach') app.insertAdjacentHTML('beforeend', viewBreach());
  if (S.modal === 'guess') app.insertAdjacentHTML('beforeend', viewGuess());
  bind();
}

function viewEntry() {
  const code = new URLSearchParams(location.search).get('code') || '';
  const presets = (S.cfg && S.cfg.presets) || [{ key: 'quick', title: '快速' }, { key: 'standard', title: '标准' }, { key: 'casual', title: '休闲' }];
  return `
  <div class="sign">
    <div class="lantern">🏮</div>
    <div><b>深海汤屋</b><span>海龟汤 · 一问一答熬出真相</span></div>
    <div class="stats"><span class="chip">入座 <b>免费</b></span><span class="chip">汤底 <b>保密</b></span></div>
  </div>
  <div class="board"><div class="col-main">
    <div class="card fold">
      <h3 class="ttl">入座 <small>报上名号，坐下就行</small></h3>
      <p class="dim" style="margin:0 0 12px">汤主只回答三件事：<b>是</b>、<b>不是</b>、<b>与此无关</b>。你用问题一点点把真相挖出来；
        想通了就「揭开汤底」，全桌一起看。</p>
      <div class="row" style="align-items:flex-start">
        <div style="flex:1 1 200px"><div class="dim">你的名号</div><input id="nick" maxlength="12" autocomplete="off" placeholder="例如：阿伟" value="${esc(localStorage.getItem(K_NICK) || '')}"></div>
        <div style="flex:1 1 200px"><div class="dim">桌号（留空 = 新开一桌）</div><input id="code" maxlength="8" autocomplete="off" placeholder="6 位桌号" value="${esc(code.toUpperCase())}"></div>
      </div>
      <div class="dim" style="margin:12px 0 6px">新桌的火候</div>
      <div class="row" id="presets">${presets.map((p, i) => `<button class="ghost${i === 1 ? ' ask-btn' : ''}" data-preset="${esc(p.key)}">${esc(p.title || p.key)}</button>`).join('')}</div>
      ${S.error ? `<div class="err" style="margin-top:12px">${esc(S.error)}</div>` : ''}
      ${S.notice ? `<div class="warn" style="margin-top:12px">${esc(S.notice)}</div>` : ''}
      <div class="row" style="margin-top:14px"><button class="ask-btn" id="btnSit">入座</button></div>
    </div>
  </div><div class="col-side"></div><div class="col-side"></div></div>`;
}

function viewRoom() {
  const v = S.view, r = v.room, you = v.you, turn = r.turn, puzzle = r.puzzle;
  const playing = r.status === 'playing';
  const current = r.members.find((m) => m.id === turn.memberId);
  const left = turn.deadlineAt ? Math.max(0, turn.deadlineAt - serverNow()) : 0;
  const total = Math.max(1, (turn.deadlineAt || 0) - (turn.startedAt || 0));
  const need = r.requiredFactTotal || 0, got = Math.min((r.revealedFacts || []).length, need || 0);
  const pct = need ? Math.round((got / need) * 100) : 0;
  const cd = (r.guessCooldownUntil || 0) - serverNow();
  const missReady = Math.max(0, (r.readyEligible || 0) - (r.readyCount || 0));
  const phase = { waiting: '等汤主开锅', playing: '正在熬', suspended: '压着火', settled: '这锅收了', destroyed: '打烊' }[r.status] || r.status;

  return `
  <div class="sign">
    <div class="lantern">🏮</div>
    <div><b>桌号 ${esc(r.code)}</b><span>${phase} · ${you.isHost ? '你是汤主' : '客官'}</span></div>
    <div class="stats">
      <span class="chip">汤面 <b>${pct}%</b></span>
      <span class="chip">问过 <b class="mono">${S.questions.length}</b></span>
      ${playing && turn.deadlineAt ? `<span class="chip ${left < 10000 ? 'hot' : ''}">沙漏 <b class="mono" data-deadline="${turn.deadlineAt}">${fmt(left)}</b></span>` : ''}
      <span class="chip ${cd > 0 ? 'hot' : ''}">揭底 <b>${cd > 0 ? `<span class="mono" data-deadline="${r.guessCooldownUntil}">${fmt(cd)}</span>` : (r.canGuess ? '可以' : '—')}</b></span>
      <button class="ghost" id="btnLeave" style="padding:4px 9px;font-size:11px;color:#ffd9b0;border-color:rgba(255,205,130,.3)">离席</button>
    </div>
  </div>
  ${S.error ? `<div class="err">${esc(S.error)}</div>` : ''}
  ${S.notice ? `<div class="warn">${esc(S.notice)}</div>` : ''}

  <div class="board">
    <div class="col-side">
      <div class="card fold">
        <h3 class="ttl">问答记录 <small>${S.questions.length} 条 · 写在墙上</small></h3>
        <div class="hatch"></div>
        <div class="quill" id="log">
          ${S.questions.length ? S.questions.map((q) => note(q, you.memberId)).join('') : '<div class="empty">还空着。<br>轮到谁，谁就往汤里添一勺问题。</div>'}
        </div>
      </div>
    </div>

    <div class="col-main">
      ${puzzle ? `
      <div class="soup">
        <h2>《${esc(puzzle.title)}》</h2>
        <div class="meta">${esc(puzzle.rating)} · 火候 ${puzzle.difficulty}/5 · 约 ${puzzle.estMinutes} 分钟</div>
        <p>${esc(puzzle.surface)}</p>
        ${(puzzle.tags || []).length || (puzzle.sensitiveTags || []).length ? `<div class="tags">
          ${(puzzle.tags || []).map((t) => `<span class="tag">${esc(t)}</span>`).join('')}
          ${(puzzle.sensitiveTags || []).map((t) => `<span class="tag risk">含 ${esc(t)}</span>`).join('')}
        </div>` : ''}
      </div>` : `
      <div class="card fold"><h3 class="ttl">今晚这一锅 <small>还没有选题</small></h3>
        <div class="dim">${you.isHost ? '从下面的「今日菜单」里挑一道，或者让全桌投票。' : '等汤主开锅。'}</div></div>`}

      ${r.status === 'waiting' ? menu(v) : ''}
      ${r.status === 'settled' && !r.truth ? `
      <div class="card fold"><h3 class="ttl">这锅没揭底 <small>${esc(r.result ? r.result.result : '')}</small></h3>
        <div class="dim">${you.isHost ? '汤底还在锅底。想看复盘请用旧版界面，或直接开下一锅。' : '只有汤主能揭开它。'}</div>
        ${you.isHost ? '<div class="row" style="margin-top:10px"><button class="ask-btn" id="btnNext">开下一锅</button></div>' : ''}
      </div>` : ''}

      <div class="card ask">
        <div class="lbl">向汤主提问（只能问能被「是 / 不是」回答的问题）</div>
        <textarea id="ask" rows="2" placeholder="轮到你的沙漏亮起时才能端上去。可以先在这里写好。">${esc(S.draft)}</textarea>
        <div class="row" style="margin-top:10px">
          <button class="ask-btn" id="btnAsk" ${you.canSubmit ? '' : 'disabled'}>端给汤主</button>
          <button class="seal" id="btnBreach" ${r.canGuess ? '' : 'disabled'}>${cd > 0 ? `揭底 <span class="mono" data-deadline="${r.guessCooldownUntil}">${fmt(cd)}</span>` : '揭开汤底'}</button>
          <span class="dim" style="flex:1">${you.canSubmit ? '轮到你发问了' : (current ? `等 ${esc(current.name)} 发问` : (playing ? '—' : '尚未开锅'))}</span>
        </div>
        ${playing && turn.deadlineAt ? `<div class="bar"><i data-bar data-deadline="${turn.deadlineAt}" data-total="${total}" style="width:100%"></i></div>` : ''}
        ${(r.config && r.config.hintsEnabled) ? `<div class="row" style="margin-top:9px"><span class="dim">汤主提示：</span>
          <button class="ghost" data-hint="1" ${you.canHintT12 ? '' : 'disabled'}>浅尝</button>
          <button class="ghost" data-hint="2" ${you.canHintT12 ? '' : 'disabled'}>再尝</button>
          <button class="ghost" data-hint="3" ${you.canHintT3 ? '' : 'disabled'}>尝到锅底</button></div>` : '<div class="dim" style="margin-top:8px">本锅未开启提示</div>'}
      </div>
    </div>

    <div class="col-side">
      <div class="card">
        <h3 class="ttl">线索板 <small>${got}/${need || '—'} · ${pct}%</small></h3>
        <div class="cork">
          <div class="pins">${pinRow(got, need)}</div>
          ${got ? `<div class="slip">已经熬出 <b>${got}</b> 条事实点${got >= need && need ? '：锅底就在眼前了' : '，火候还差一点'}</div>`
                : '<div class="slip">还没挖到线索。<br>先问几个「是 / 不是」都能答的问题。</div>'}
          ${playing && current ? `<div class="slip">此刻掌勺：<b>${esc(current.name)}</b>${current.id === you.memberId ? '（你）' : ''}</div>` : ''}
        </div>
        <div class="bar" style="margin-top:10px"><i data-bar data-deadline="0" data-total="1" style="width:${pct}%"></i></div>
      </div>

      <div class="card fold">
        <h3 class="ttl">客人 <small>${r.members.length} 位${r.status === 'waiting' ? ` · 已落座 ${r.readyCount}/${r.readyEligible}` : ''}</small></h3>
        ${r.members.map((m) => `
          <div class="guest${turn.memberId === m.id ? ' turn' : ''}">
            <div class="face" style="--h:${hue(m.name)}">${esc(String(m.name || '?').slice(0, 1))}</div>
            <div class="nm">${esc(m.name)}${m.id === you.memberId ? '<span class="dim">（你）</span>' : ''}
              ${m.isHost ? '<span class="mark on">汤主</span>' : ''}
              ${m.role === 'spectator' ? '<span class="mark">旁听</span>' : ''}
              ${m.conn === 'disconnected' ? '<span class="mark off">走了</span>' : m.activity === 'idle' ? '<span class="mark off">发呆</span>' : ''}
            </div>
            <div class="mt">${m.score} 分</div>
          </div>`).join('')}
        ${missing(v, missReady)}
      </div>
    </div>
  </div>`;
}

function pinRow(got, need) {
  const n = Math.max(need || 0, got, 1);
  let out = '';
  for (let i = 0; i < Math.min(n, 12); i++) out += `<span class="pin${i < got ? '' : ' empty'}"></span>`;
  return out;
}
function missing(v, n) {
  const r = v.room, you = v.you;
  if (r.status !== 'waiting') return '';
  if (you.isHost) return `<div class="dim" style="margin-top:9px">你是汤主，不用举手：${n ? `还差 ${n} 位没落座，叫一声或直接开锅。` : '人都齐了，随时开锅。'}</div>`;
  const me = r.members.find((m) => m.id === you.memberId) || {};
  return `<div class="row" style="margin-top:10px"><button class="${me.ready ? '' : 'ask-btn'}" id="btnReady">${me.ready ? '✓ 已落座（点一下收回）' : '我已落座'}</button></div>`;
}

function menu(v) {
  const r = v.room, you = v.you, cands = v.candidates || [];
  if (!you.isHost) return `<div class="card fold"><h3 class="ttl">今日菜单 <small>汤主在挑</small></h3>
    <div class="dim">汤主会挑一道、或让全桌投票。你先落座，等他开锅。</div>${missing(v, Math.max(0, (r.readyEligible || 0) - (r.readyCount || 0)))}</div>`;
  return `<div class="card fold">
    <h3 class="ttl">今日菜单 <small>${cands.length} 道可选 · 点一道就开锅</small></h3>
    <div class="menu">
      ${cands.map((c) => `<div class="dish">
        <div class="row"><span class="mark on">${esc(c.rating)}</span><span class="mark">火候 ${c.difficulty}</span><span class="mark">约 ${c.estMinutes} 分</span></div>
        <div class="b">${esc(c.surface)}</div>
        <button class="ask-btn" data-pick="${esc(c.id)}">就熬这道</button>
      </div>`).join('') || '<div class="empty">没有符合火候的题</div>'}
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnVote">让全桌投票选</button>
      <button class="ghost danger" id="btnEnd">收锅（结束这局）</button>
      <span class="dim">${Math.max(0, (r.readyEligible || 0) - (r.readyCount || 0)) ? `还差 ${Math.max(0, (r.readyEligible || 0) - (r.readyCount || 0))} 位落座，也可以直接开` : '全员已落座'}</span>
    </div>
  </div>`;
}

function note(q, mine) {
  const ans = String(q.answer || '');
  const word = { yes: '是', no: '不是', irrelevant: '与此无关', unanswerable: '无法回答' }[ans] || ans;
  const isMine = q.memberId === mine;
  return `<div class="note ${esc(ans)}${isMine ? ' mine' : ''}">
    <div class="who"><b>${esc(q.memberName || '—')}${isMine ? '（你）' : ''}</b><span>第 ${q.turnSeq} 轮</span>${q.late ? '<span>· 压哨</span>' : ''}</div>
    <div class="q">${esc(q.text)}</div>
    <div class="a"><span class="stamp ${esc(ans)}">${esc(word)}</span>${q.explain ? `<span class="rep">${esc(q.explain)}</span>` : ''}</div>
  </div>`;
}

function viewBreach() {
  const r = S.view.room, you = S.view.you;
  return `<div class="veil"><div class="scroll">
    <div class="seal">揭</div>
    <h2>汤底 · 揭封</h2>
    <div class="dim">有人把真相熬出来了。${esc(r.truthNote || '')}</div>
    <div class="body">${esc(r.truth)}</div>
    <div class="row" style="margin-top:16px">
      ${you.isHost ? '<button class="ask-btn" id="btnBreachNext">收锅 · 再开一锅</button>' : ''}
      <button id="btnBreachClose">继续坐着</button>
    </div>
  </div></div>`;
}
function viewGuess() {
  const r = S.view.room;
  const cd = (r.guessCooldownUntil || 0) - serverNow();
  const sec = (r.config && r.config.guessCooldownSec) || 0;
  return `<div class="modal"><div class="box">
    <h3 class="ttl">揭开汤底 <small>用你自己的话，把真相说清楚</small></h3>
    <p class="dim" style="margin:0 0 10px">汤主看关键要素齐不齐、有没有把因果串上。沾到六成就告诉你「近了」，但不会说是哪几条。
      揭底是<b>全桌共用一个冷却</b>${sec ? `（${sec} 秒）` : '（不限）'}：谁先揭谁开始计时${cd > 0 ? `，还剩 <b class="mono" data-deadline="${r.guessCooldownUntil}">${fmt(cd)}</b>` : ''}。</p>
    <textarea id="guess" rows="4" placeholder="例如：他当年在海上遇难，靠同伴的肉活了下来……">${esc(S.guessDraft || '')}</textarea>
    <div class="row" style="margin-top:12px">
      <button class="seal" id="btnGuessGo" ${cd > 0 ? 'disabled' : ''}>${cd > 0 ? '冷却中…' : '揭底'}</button>
      <button class="ghost" id="btnGuessBack">再想想</button>
    </div>
  </div></div>`;
}

function bind() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('btnSit', sit);
  on('btnAsk', doAsk);
  on('btnBreach', () => { S.modal = 'guess'; render(true); });
  on('btnGuessBack', () => { S.modal = null; render(true); });
  on('btnGuessGo', doGuess);
  on('btnReady', () => void send({ type: 'ready', ready: !(S.view.room.members.find((m) => m.id === S.view.you.memberId) || {}).ready }));
  on('btnVote', () => void send({ type: 'start', mode: 'vote' }));
  on('btnEnd', () => { if (confirm('收锅结束这局？汤底不会揭封。')) void send({ type: 'end_match' }); });
  on('btnNext', () => void send({ type: 'next_round' }));
  on('btnLeave', () => void leaveRoom());
  on('btnBreachClose', () => { const r = S.view.room; S.breachSeen = `${r.id}:${r.roundNo}`; S.modal = null; render(true); });
  on('btnBreachNext', () => { S.breachSeen = ''; S.modal = null; void send({ type: 'next_round' }); });
  const ask = $('#ask');
  if (ask) { ask.oninput = () => { S.draft = ask.value; localStorage.setItem(K_DRAFT, ask.value); }; ask.onkeydown = (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doAsk(); } }; }
  const g = $('#guess'); if (g) { g.oninput = () => { S.guessDraft = g.value; }; g.focus(); }
  $('#app').querySelectorAll('[data-preset]').forEach((b) => { b.onclick = () => { $('#app').querySelectorAll('[data-preset]').forEach((x) => x.classList.remove('ask-btn')); b.classList.add('ask-btn'); }; });
  $('#app').querySelectorAll('[data-pick]').forEach((b) => { b.onclick = () => { const id = b.getAttribute('data-pick'); void send({ type: 'start', mode: 'pick', puzzleId: id, ...(askForce() ? { force: true } : {}) }); }; });
  $('#app').querySelectorAll('[data-hint]').forEach((b) => { b.onclick = () => void send({ type: 'hint', tier: Number(b.getAttribute('data-hint')) }); });
}
function askForce() {
  const r = S.view.room;
  const miss = r.members.filter((m) => m.role !== 'spectator' && m.conn === 'connected' && !m.isHost && !m.ready);
  if (!miss.length) return false;
  return confirm(`${miss.map((m) => m.name).join('、')} 还没落座。还是开锅？`);
}
async function sit() {
  const nick = (($('#nick') && $('#nick').value) || '').trim() || '客官';
  const code = (($('#code') && $('#code').value) || '').trim().toUpperCase();
  const preset = ($('[data-preset].ask-btn') && $('[data-preset].ask-btn').getAttribute('data-preset')) || 'standard';
  localStorage.setItem(K_NICK, nick); S.error = '';
  try {
    const res = code ? await api(`/api/rooms/${code}/join`, { method: 'POST', body: { nickname: nick } })
                     : await api('/api/rooms', { method: 'POST', body: { nickname: nick, preset } });
    epoch++; S.token = res.token; localStorage.setItem(K_TOKEN, res.token);
    S.view = res.view; S.screen = 'room'; S.seq = 0; startPoll(); render(true);
  } catch (e) { S.error = e.message; render(true); }
}
async function doAsk() {
  const el = $('#ask'); const text = (el ? el.value : '').trim(); if (!text) return;
  localStorage.removeItem(K_DRAFT); S.draft = '';
  await send({ type: 'submit', turnSeq: S.view.room.turn.seq, text, clientSubmitId: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())) });
}
async function doGuess() {
  const text = (($('#guess') && $('#guess').value) || '').trim();
  if (await send({ type: 'guess', text })) { S.guessDraft = ''; S.modal = null; render(true); }
}
async function send(body) {
  try {
    const data = await act(body); S.error = '';
    if (data.view) apply(data); else render(true);
    return true;
  } catch (e) {
    S.error = e.message + (e.body && e.body.detail && e.body.detail.cooldownLeftMs ? `（还剩 ${fmt(e.body.detail.cooldownLeftMs)}）` : '');
    if (e.body && e.body.view) apply(e.body); else render(true);
    return false;
  }
}
async function leaveRoom() {
  if (S.token) { try { await fetch('/api/rooms/actions', { method: 'POST', headers: { 'content-type': 'application/json', authorization: `Bearer ${S.token}` }, body: JSON.stringify({ type: 'leave' }), keepalive: true }); } catch { /* 网络失败也允许离席 */ } }
  forget(); S.notice = '你已经离席。'; S.error = ''; render(true);
}

setInterval(() => {
  const now = serverNow();
  document.querySelectorAll('[data-deadline]').forEach((el) => {
    const dl = Number(el.getAttribute('data-deadline')); if (!dl) return;
    const left = Math.max(0, dl - now); const t = fmt(left);
    if (el.textContent.trim() !== t) el.textContent = t;
  });
  document.querySelectorAll('[data-bar]').forEach((el) => {
    const dl = Number(el.getAttribute('data-deadline')); if (!dl) return;
    const total = Math.max(1, Number(el.getAttribute('data-total')) || 1);
    el.style.width = `${Math.max(0, Math.min(100, (Math.max(0, dl - now) / total) * 100))}%`;
  });
}, 250);

(async () => {
  try { S.cfg = await api('/api/config'); } catch { /* 入口页有默认火候 */ }
  if (S.token) {
    const my = epoch;
    try {
      const me = await api('/api/session');
      if (my !== epoch || !S.token) return;
      S.view = me.view; S.screen = 'room';
      if (me.view && me.view.room) S.offset = me.view.room.serverTime - Date.now();
      startPoll();
    } catch { forget(); }
  }
  render(true);
})();
</script>
</body>
</html>
